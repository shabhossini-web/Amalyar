server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # /api normally goes to the more-specific Coolify backend route.
  # If that backend is unhealthy and Coolify falls back to this root app,
  # fail closed instead of returning the SPA HTML with HTTP 200.
  location = /api {
    return 503;
  }

  location ^~ /api/ {
    return 503;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location = /version.json { add_header Cache-Control "no-store" always; }
  location = /sw.js { add_header Cache-Control "no-cache, must-revalidate" always; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:woff2?|ttf|eot|svg|png|jpe?g|webp|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
  }
}
