# مرجِ خودکارِ PRهای ایجنت‌ها وقتی security-ci سبز شد.
#
# ⚠️ چرا: مسئله هیچ‌وقت «کلیکِ مرج» نبود، **شاخه‌ای بود که منتظر می‌ماند**.
# PR #4 سه هفته باز ماند و پنج بار کانفلیکت خورد. اگر مرج در چند دقیقه بعد از
# سبزشدن انجام شود، شاخه اصلاً فرصتِ کهنه‌شدن پیدا نمی‌کند — یعنی همان بندِ ۳
# `AGENTS.md` («همان روز مرج کن») به‌جای یادآوری، خودکار اجرا می‌شود.
#
# ⚠️ `workflow_run` همیشه نسخهٔ **شاخهٔ پیش‌فرض** فایل را اجرا می‌کند؛ پس این
# تا وقتی روی `main` ننشیند اثری ندارد.
name: automerge

on:
  workflow_run:
    workflows: ["security-ci"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # فقط رانِ سبزِ خودِ PR — نه رانِ push روی main.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;

            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', base: 'main', per_page: 100 });
            const candidates = prs.filter((p) => p.head.sha === sha);
            if (!candidates.length) return core.info(`هیچ PR بازی روی ${sha} نیست`);

            for (const brief of candidates) {
              // فهرست خلاصه است؛ mergeable_state فقط در پاسخِ تکی می‌آید و
              // GitHub گاهی «unknown» می‌دهد تا محاسبه تمام شود.
              let pr = null;
              for (let attempt = 0; attempt < 5; attempt++) {
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: brief.number }));
                if (pr.mergeable_state !== 'unknown') break;
                await new Promise((r) => setTimeout(r, 3000));
              }

              const labels = pr.labels.map((l) => l.name);
              const agentBranch = pr.head.ref.startsWith('claude/') || pr.head.ref.startsWith('agent/');
              // شرط‌ها عمداً سخت‌گیرند: مرجِ خودکار فقط برای چیزی که
              // خودِ ایجنت ساخته، تمام‌شده اعلام کرده، و کسی نگهش نداشته.
              const reasons = [];
              if (pr.draft) reasons.push('پیش‌نویس است');
              if (labels.includes('hold')) reasons.push('برچسبِ hold دارد');
              if (!agentBranch && !labels.includes('automerge')) reasons.push('نه شاخهٔ ایجنت است نه برچسبِ automerge دارد');
              if (pr.mergeable === false) reasons.push(`قابلِ مرج نیست (${pr.mergeable_state})`);
              if (reasons.length) { core.info(`#${pr.number} رد شد: ${reasons.join(' · ')}`); continue; }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number,
                  merge_method: 'merge',  // تاریخچهٔ کامیت‌ها ارزشِ خودش را دارد؛ squash پیام‌ها را می‌بلعد
                  commit_title: `Merge pull request #${pr.number} from ${pr.head.label}`,
                });
                core.notice(`#${pr.number} مرج شد — «${pr.title}»`);
              } catch (e) {
                // شکستِ مرج نباید بی‌صدا بماند: همان چیزی که شش ساعت گیجمان کرد.
                core.warning(`مرجِ #${pr.number} نشد: ${e.message}`);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `مرجِ خودکار انجام نشد: \`${e.message}\`\n\nCI سبز بود ولی GitHub مرج را نپذیرفت. دستی نگاهش کن.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
                });
              }
            }
