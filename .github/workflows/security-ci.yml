      - name: Verify revenue is recognized only when the work is done
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          /* ⚠️ **پول رسیده ≠ درآمد.** تا دیروز درآمد جمعِ Charge بود، بی‌هیچ
             توجهی به انجامِ عمل: لحظه‌ای که ادمین فرم را تأیید می‌کرد، کلِ مبلغ
             در سود می‌نشست — برای عملی که هفتهٔ بعد بود. و چون تقسیمِ سهم روی
             همان عدد کار می‌کند، سهمِ شرکا و جراح هم روی پولِ نشناخته تقسیم
             می‌شد؛ اگر عمل لغو می‌شد باید از جیبِ شریک پس گرفته می‌شد. */
          const rev = read('server/src/patients/revenue.ts');
          if (!/export function recognize/.test(rev) || !/export const isEarned/.test(rev)) {
            console.error('قرارِ شناسایی باید یک تعریفِ مشترک باشد'); process.exit(1);
          }

          // ① گزارش قاعده را **مصرف** کند، نه بازتعریف.
          const rep = read('server/src/patients/reports.service.ts');
          if (!/from '\.\/revenue'/.test(rep) || !/recognize\(/.test(rep)) {
            console.error('گزارشِ مالی باید از قرارِ مشترک بخواند'); process.exit(1);
          }
          // ⚠️ لنگر روی **نبودِ بازتعریف** هم هست: اگر گزارش خودش opStatus را
          //    با done مقایسه کند، فردا یکی‌شان عوض می‌شود و دیگری نه.
          if (/opStatus === '/.test(rep)) {
            console.error('گزارش نباید خودش وضعیت را تفسیر کند — isEarned'); process.exit(1);
          }
          // ② سود از **شناسایی‌شده** حساب شود، نه از فاکتور و نه از وصولی.
          if (!/profit: revenue - expenseTotal/.test(rep)) {
            console.error('سود باید بر مبنای درآمدِ شناسایی‌شده باشد'); process.exit(1);
          }
          for (const f of ['deferred', 'contracted']) {
            if (!new RegExp(f + ',').test(rep)) {
              console.error('گزارش باید ' + f + ' را جدا بدهد'); process.exit(1);
            }
          }

          /* ③ ⚠️ **تسویه فقط روی عملِ انجام‌شده** — و این گاردِ سرور است، نه
             پیامِ UI: پولِ تقسیم‌شدهٔ عملِ لغوشده باید از جیبِ شریک برگردد. */
          const st = read('server/src/patients/settlement.service.ts');
          const compute = st.slice(st.indexOf('async compute('), st.indexOf('async finalize('));
          /* ⚠️ لنگر روی **شکلِ شرط** است نه صرفِ حضورِ نام: بندِ اول فقط
             \`isEarned(\` را می‌دید و با \`if (false && !isEarned(...))\` سبز
             می‌ماند. همین اشتباه پیش‌تر سه بار تکرار شده بود. */
          if (!/if \(!isEarned\(/.test(compute)) {
            console.error('نوشتنِ تسویه باید به انجامِ عمل مشروط باشد'); process.exit(1);
          }
          if (/if \(false/.test(compute)) {
            console.error('شرطِ تسویه خنثی شده است'); process.exit(1);
          }
          // پیش‌نمایش عمداً باز است — دیدن اشکالی ندارد، نوشتن دارد.
          const preview = st.slice(st.indexOf('async preview('), st.indexOf('async compute('));
          if (/isEarned\(/.test(preview)) {
            console.error('پیش‌نمایش نباید بسته شود — فقط نوشتن مشروط است'); process.exit(1);
          }

          /* ④ هیچ ستونِ ذخیره‌شده‌ای. \`opStatus\` یک‌بار عوض می‌شود و همهٔ
             گزارش‌ها باید همان لحظه درست شوند؛ ستونِ ذخیره‌شده جا می‌ماند. */
          const schema = read('server/prisma/schema.prisma');
          for (const col of ['recognizedRevenue', 'deferredRevenue', 'recognized_revenue']) {
            if (schema.includes(col)) {
              console.error('درآمدِ شناسایی‌شده باید مشتق بماند، نه ستونِ ' + col); process.exit(1);
            }
          }

          // ⑤ کاربر باید هر سه عدد را ببیند، وگرنه فکر می‌کند درآمدش پریده.
          /* ⚠️ لنگر روی **رندرِ خودِ عدد** است نه وجودِ کلمه: نسخهٔ اول دنبالِ
             واژهٔ «پیش‌دریافت» می‌گشت و چون همان واژه در پاراگرافِ راهنما هم
             بود، حذفِ کاشیِ عدد را نمی‌گرفت. */
          const ui = read('src/app/Accounting.jsx');
          for (const field of ['t.deferred', 't.contracted', 't.revenue']) {
            if (!ui.includes(field)) {
              console.error('صفحهٔ حسابداری باید ' + field + ' را نشان دهد'); process.exit(1);
            }
          }
          if (!/درآمدِ شناسایی‌شده/.test(ui) || !/پیش‌دریافت/.test(ui)) {
            console.error('اعداد باید برچسبِ روشن داشته باشند'); process.exit(1);
          }
          console.log('revenue ok');
          "

      - name: Verify money reaches the ledger and portals follow permissions
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          // ① مراجعهٔ تازه باید بتواند مبلغ بگیرد و آن مبلغ **قلمِ فاکتور**
          //    بشود، نه ستونی روی مراجعه: جمعِ فاکتور از قلم‌ها مشتق می‌شود و
          //    ستونِ موازی یعنی دو منبعِ حقیقت برای «مبلغِ این عمل».
          const pvc = read('server/src/patients/patients.service.ts');
          const from = pvc.indexOf('async createVisit(');
          const create = pvc.slice(from, pvc.indexOf('async setTimes(', from));
          if (!/tx\\.charge\\.create\\(/.test(create) || !/dto\\.amount/.test(create)) {
            console.error('ثبتِ مراجعه باید از مبلغ قلمِ خدمت بسازد'); process.exit(1);
          }
          if (/visit.*amount.*Int/.test(read('server/prisma/schema.prisma').slice(
                read('server/prisma/schema.prisma').indexOf('model Visit'),
                read('server/prisma/schema.prisma').indexOf('model Charge')))) {
            console.error('مبلغ نباید ستونی روی Visit شود'); process.exit(1);
          }

          // ② ⚠️ مراجعهٔ تأییدشده نباید بدهکار بماند: تأیید یعنی ادمین فیش را
          //    دیده. پرداخت ثبت می‌شود ولی **حسابِ مقصد را ادمین می‌گوید**.
          const isvc = read('server/src/patients/intake.service.ts');
          if (!/this\\.billing\\.addPayment\\(/.test(isvc)) {
            console.error('تأیید باید پرداخت را هم ثبت کند وگرنه مراجعه بدهکار می‌ماند'); process.exit(1);
          }
          if (!/dto\\.registerPayment !== false/.test(isvc)) {
            console.error('ثبتِ پرداخت باید پیش‌فرض روشن و قابلِ خاموش‌کردن باشد'); process.exit(1);
          }
          if (!/bankAccountId: dto\\.bankAccountId/.test(isvc)) {
            console.error('حسابِ مقصد باید از ادمین بیاید، نه حدس زده شود'); process.exit(1);
          }

          // ③ اعتبارسنجیِ کدِ ملی در **درِ عمومی** نباید سست‌تر از مسیرِ ادمین
          //    باشد؛ وگرنه پرونده‌ای ساخته می‌شود که ادمین هرگز نمی‌توانست.
          if (!/isValidNationalId\\(nationalId\\)/.test(isvc)) {
            console.error('فرمِ عمومی باید همان اعتبارسنجیِ کدِ ملی را داشته باشد'); process.exit(1);
          }

          // ④ ⚠️ «چه چیزی را می‌بینم» **یک** منبع دارد و آن سرور است. تا دیروز
          //    لانچر خودش level >= minLevel حساب می‌کرد و صلاحیتِ نقش را
          //    نمی‌دانست: رانندهٔ سطح ۲ کاشیِ پنلِ کارشناسی را می‌دید.
          const fsvc = read('server/src/features/features.service.ts');
          if (!/async forUser\\(/.test(fsvc) || !/allowed:/.test(fsvc)) {
            console.error('سرور باید allowed را به‌ازای کاربر بدهد'); process.exit(1);
          }
          /**
           * ⚠️ کامنت‌ها پیش از سنجش حذف می‌شوند.
           *
           * نسخهٔ اولِ این بند **توضیحِ خودِ کد** را خطا گرفت: جمله‌ای که
           * می‌گفت «تا دیروز این‌جا سطح حساب می‌شد» عیناً همان الگو را
           * داشت. نگهبانی که درسِ ثبت‌شده را پاک کند بدتر از نداشتنش
           * است — همان اشتباه یک‌بار سرِ «ریال» هم رخ داد.
           */
          const code = (src) => src.replace(/\\/\\*[\\s\\S]*?\\*\\//g, '').replace(/\\/\\/[^\\n]*/g, '');
          /* از W2.3 کاتالوگِ کاشی‌ها و گیتشان در `src/app/tools.jsx` است و هم
             لانچر (`/app/tools`) و هم کشوی صفحهٔ «امروز» از همان می‌خوانند —
             پس سنجهٔ مثبت همان‌جاست و سنجهٔ منفی روی **هر دو**. */
          const surfaces = { 'src/app/tools.jsx': true, 'src/app/Launcher.jsx': false };
          for (const [file, mustRead] of Object.entries(surfaces)) {
            const lx = code(read(file));
            if (/lvl >= min\\b/.test(lx) || /f\\?\\.minLevel/.test(lx)) {
              console.error(`${file} نباید خودش سطح را حساب کند — allowedِ سرور`); process.exit(1);
            }
            if (mustRead && !/f\\.allowed/.test(lx)) { console.error(`${file} باید allowed را بخواند`); process.exit(1); }
          }
          if (/const (HERO|TOOLS|DAILY) =/.test(code(read('src/app/Launcher.jsx')))) {
            console.error('کاتالوگِ کاشی‌ها فقط در src/app/tools.jsx — دو نسخه یعنی ماژولی که در یکی هست و در دیگری نیست'); process.exit(1);
          }

          // ⑤ سطح به‌تنهایی راننده را از کارشناس جدا نمی‌کند — هر دو سطح ۲اند.
          if (!/TransportStaff|transportStaff/.test(fsvc) || !/!staff \\|\\| hasTechVisits/.test(fsvc)) {
            console.error('صلاحیتِ نقش باید راننده را از کارشناس جدا کند'); process.exit(1);
          }

          // ⑥ هر صفحهٔ ماژولی پشتِ دروازه باشد تا تایپِ مستقیمِ نشانی صفحهٔ
          //    خالی ندهد. (دروازه جایگزینِ گاردِ سرور نیست، مکملِ آن است.)
          const app = read('src/App.jsx');
          for (const key of ['tech', 'transport', 'dashboard', 'accounting', 'inventory']) {
            if (!new RegExp('Gate feature=\\\\\"' + key + '\\\\\"').test(app)) {
              console.error('صفحهٔ ' + key + ' پشتِ Gate نیست'); process.exit(1);
            }
          }
          console.log('money+acl ok');
          "

      - name: Verify paid intake, multi-role forms, bank invoices and follow-up integration
        run: node scripts/e2e/intake-finance-roles.mjs

      - name: Verify neuromonitoring tariffs and immutable invoice issuance
        run: node scripts/e2e/neuromonitoring-invoice.mjs

      - name: Verify profile registration, requirements and surgeon scope
        run: node scripts/e2e/profile-workflows.mjs

      # دو مرزی که هیچ تایپ‌چکی نمی‌گیرد و هر دو یک‌بار شکسته بودند:
      # حسابی که مدیر برای دیگری می‌سازد باید قابلِ تحویل‌گرفتن بماند، و
      # اطلاعاتِ حسابِ بانکی نباید از گاردِ حسابداری بیرون بزند.
      #
      # ⚠️ در متنِ این گام backtick نگذارید: داخلِ رشتهٔ دوتاییِ node -e،
      # پوسته آن را دستور می‌خواند و گام با «command not found» می‌شکند.
      - name: Verify admin-created accounts stay claimable and bank details stay scoped
        run: |
          node -e "
          const fs = require('fs');
          const read = (p) => fs.readFileSync(p, 'utf8');
          /* کامنت‌ها اول برداشته می‌شوند — نثرِ توضیحیِ خودِ فایل بارها
             به‌جای کد سنجیده شده است. */
          const code = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '');
          const acc = code(read('server/src/accounts/accounts.service.ts'));
          const auth = code(read('server/src/auth/auth.service.ts'));
          const bill = code(read('server/src/patients/billing.service.ts'));

          /* حسابِ ساخته‌شده توسطِ مدیر نباید رمزِ غیرقابلِ‌دانستن بگیرد. هشِ
             تصادفی یعنی حسابی که نه صاحبش می‌تواند واردش شود (بازیابیِ رمز
             وجود ندارد) و نه ثبت‌نامِ دوباره قبولش می‌کند — شماره تا ویرایشِ
             دستیِ دیتابیس قفل می‌ماند. */
          const tech = acc.slice(acc.indexOf('async createTechnician('), acc.indexOf('async list('));
          if (/randomBytes|bcrypt\.hash/.test(tech)) {
            console.error('حسابِ کارشناس نباید رمزِ تصادفی بگیرد؛ باید تصاحب‌نشده بماند'); process.exit(1);
          }
          if (!/passwordHash = ''/.test(tech)) {
            console.error('حسابِ کارشناس باید با passwordHashِ خالی ساخته شود'); process.exit(1);
          }

          // تعریفِ تصاحب‌نشده یکی است و هر سه مصرف‌کننده از همان می‌خوانند.
          if (!/export const isUnclaimedAccount/.test(auth)) {
            console.error('تعریفِ isUnclaimedAccount نیست'); process.exit(1);
          }
          const uses = (auth.match(/isUnclaimedAccount\(/g) || []).length;
          if (uses < 3) {
            console.error('گاردِ ورود، درخواستِ کد و مسیرِ تصاحب هر سه باید از isUnclaimedAccount بخوانند (یافت: ' + uses + ')');
            process.exit(1);
          }

          /* تصاحب نباید سطح یا وضعیت بدهد — وگرنه هر کس با یک شمارهٔ از پیش
             ثبت‌شده سطحِ خودش را بالا می‌برد. */
          const claim = auth.slice(auth.indexOf('if (known?.account) {'), auth.indexOf('const bootstrap ='));
          /* ⚠️ سنجه فقط شیءِ data (چیزی که **نوشته** می‌شود) است، نه کلِ بلوک:
             رکوردِ audit همان‌جا سطح را می‌خوانَد تا ثبتش کند، و بندِ اول
             همان خواندن را نوشتن حساب کرد و بی‌دلیل قرمز شد. */
          const dataStart = claim.indexOf('data: {');
          const written = dataStart < 0 ? '' : claim.slice(dataStart, claim.indexOf('include:', dataStart));
          if (!dataStart) { console.error('شیءِ data در مسیرِ تصاحب پیدا نشد'); process.exit(1); }
          for (const forbidden of ['level:', 'status:', 'jobRole:', 'approvedAt:']) {
            if (written.includes(forbidden)) {
              console.error('مسیرِ تصاحب نباید ' + forbidden + ' را بنویسد'); process.exit(1);
            }
          }

          /* اطلاعاتِ حسابِ بانکی: billing.read سطحِ سوپروایزر است ولی مسیرِ
             bank-accounts سطحِ ادمین. selectِ باز یعنی شمارهٔ کارت از گاردِ
             حسابداری رد می‌شود. */
          if (/invoiceBankAccount: true/.test(bill)) {
            console.error('صورت‌حساب باید فیلدهای حسابِ بانکی را صریح انتخاب کند، نه کلِ ردیف'); process.exit(1);
          }
          for (const leak of ['cardNumber', 'partnerId', 'showOnIntake']) {
            if (bill.includes(leak)) {
              console.error('قلمِ ' + leak + ' نباید در پاسخِ صورت‌حساب باشد'); process.exit(1);
            }
          }
          console.log('account claim + bank scope ok');
          "

      # سایتِ عمومیِ شرکت تنها جایی است که محتوا **بیرونِ** دیوارِ لاگین منتشر
      # می‌شود. سه مرزش را هیچ تایپ‌چکی نمی‌گیرد و هر سه باگِ خاموش می‌سازند:
      # صفحه‌ای که ناخواسته منتشر شود، هویتِ مالیاتی که لو برود، و تصویری که
      # پس از خاموش‌کردنِ بخش همچنان قابلِ دانلود بماند.
      - name: Verify the tenant SEO surface reaches crawlers
        run: node scripts/verify-seo-surface.js

      - name: Verify the tenant public site stays fail-closed
        run: |
          node -e "
          const fs = require('fs');
          const read = (p) => fs.readFileSync(p, 'utf8');
          /* ⚠️ کامنت‌ها پیش از هر تطبیق برداشته می‌شوند — همان تلهٔ بندهای بالا:
             نثرِ توضیحیِ خودِ فایل بارها به‌جای کد سنجیده شده است. */
          const code = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '');
          const ctrl = code(read('server/src/site/site.controller.ts'));
          const svc  = code(read('server/src/site/site.service.ts'));
          const reg  = read('server/src/auth/access-registry.ts');

          // ① کنترلرِ عمومی باید بی‌گارد باشد و کنترلرِ ویرایش با هر سه گارد.
          const pubStart = ctrl.indexOf(\"@Controller('public/site')\");
          const pubEnd = ctrl.indexOf(\"@Controller('site')\", pubStart);
          if (pubStart < 0 || pubEnd < 0) { console.error('کنترلرهای سایت پیدا نشدند'); process.exit(1); }
          if (/UseGuards/.test(ctrl.slice(pubStart, pubEnd))) {
            console.error('کنترلرِ عمومیِ سایت نباید گارد داشته باشد — بازدیدکننده لاگین ندارد'); process.exit(1);
          }
          if (!/@UseGuards\(JwtAuthGuard, FeatureGuard, PermissionGuard\)[\s\S]{0,120}export class SiteController/.test(ctrl)) {
            console.error('کنترلرِ ویرایشِ سایت باید پشتِ هر سه گارد باشد'); process.exit(1);
          }
          for (const m of ctrl.matchAll(/RequirePermissions\('([^']+)'\)/g)) {
            if (!reg.includes(\"key: '\" + m[1] + \"'\")) {
              console.error('مجوزِ ' + m[1] + ' در access-registry نیست'); process.exit(1);
            }
          }

          /* ② ⚠️ **پیش‌فرضِ انتشار باید خاموش بماند.** این ماژول روی نصب‌هایی
             می‌نشیند که همین حالا کار می‌کنند و ریشهٔ دامنه‌شان به فرمِ ورود
             می‌رود؛ پیش‌فرضِ روشن یعنی سایتِ همهٔ شرکت‌ها با متنِ نمونه بالا
             بیاید بی‌آنکه کسی خواسته باشد. */
          const pub = svc.slice(svc.indexOf('private async published('), svc.indexOf('private async sections('));
          if (!/=== '1'/.test(pub)) {
            console.error('نبودِ ردیفِ انتشار باید «منتشرنشده» معنا شود'); process.exit(1);
          }
          const view = svc.slice(svc.indexOf('async publicView('), svc.indexOf('async adminView('));
          if (!/published \?/.test(view)) {
            console.error('publicView باید پرچمِ انتشار را اعمال کند'); process.exit(1);
          }

          /* ③ هویتِ مالیاتی مالِ فاکتورِ رسمی است، نه صفحه‌ای که هر کسی بازش
             می‌کند. \`settings.brand()\` هر دو را دارد، پس گلچین اجباری است. */
          for (const leak of ['nationalId', 'econCode']) {
            if (view.includes(leak)) { console.error('publicViewِ سایت نباید ' + leak + ' بدهد'); process.exit(1); }
          }

          /* ④ تصویرِ قلمی که غیرفعال شده یا بخشش خاموش است نباید استریم شود،
             وگرنه «خاموش‌کردن» فقط یعنی «از صفحه بردار»، نه «منتشر نکن». */
          if (!/isPubliclyVisible/.test(ctrl)) {
            console.error('استریمِ عمومیِ تصویر باید دیده‌شدنِ قلم را بسنجد'); process.exit(1);
          }
          if (!/if \(!\(await this.published\(\)\)\) return false;/.test(svc)) {
            console.error('isPubliclyVisible باید پرچمِ انتشار را هم ببیند'); process.exit(1);
          }

          /* ⑤ نشانیِ تصویر بر پایهٔ **شناسهٔ قلم** است نه sha؛ اندپوینتی که هر
             shaیی را بدهد یعنی هر فایلِ همان شرکت — از جمله مدرکِ بیمار — با
             حدسِ sha از بیرون خواندنی است. */
          if (/items\/\\\$\{id\}\/image/.test(svc) === false) {
            console.error('نشانیِ تصویر باید از شناسهٔ قلم ساخته شود'); process.exit(1);
          }

          // ⑥ صفحهٔ ویرایش پشتِ دروازه باشد تا تایپِ مستقیمِ نشانی صفحهٔ خالی ندهد.
          if (!/Gate feature=\"site\"/.test(read('src/App.jsx'))) {
            console.error('صفحهٔ سایت پشتِ Gate نیست'); process.exit(1);
          }
          console.log('tenant public site ok');
          "

      - name: Verify company operations, provisional expiry, surgeon finance and atomic inventory invoices
        run: node scripts/e2e/company-operations.mjs

      - name: Verify isolated test accounts sharing one phone
        run: node scripts/e2e/test-accounts.mjs

      - name: Verify central hospital directory and isolated tenant imports
        run: node scripts/e2e/hospital-directory.mjs

      # ⚠️ ته فایل، طبقِ بندِ ۵ خودِ AGENTS.md: هر سه بارِ قبلی که این فایل
      # کانفلیکت خورد، از نوعِ «هر دو وسط اضافه کرده‌اند» بود.
      - name: Verify agent claims do not overlap
        run: node scripts/verify-claims.js

      # هر صفحهٔ lazy باید CSSِ کلاس‌هایی که استفاده می‌کند خودش بیاورد —
      # فرمِ عمومیِ بیمار یک‌بار بی‌صدا بی‌استایل شد (قانون ۲۱).
      - name: Verify every lazy chunk ships the CSS it uses
        run: node scripts/verify-css-chunks.js

      # یک وضعیت، یک برچسب: کلاینت نگاشتِ فارسیِ وضعیت ندارد. یک بیمار در میزِ
      # پذیرش «در مطب» بود و در میزِ پزشک «رسید» — هیچ تستی نمی‌گرفتش چون هر
      # صفحه به‌تنهایی درست بود (بازخوردِ مالک ۱۴۰۵/۰۶/۳۱).
      - name: Verify one status has one label
        run: node scripts/verify-status-labels.js

      # و خواهرش: یک **ماشینِ** وضعیت. تقویم قاعدهٔ «شروعِ ویزیت» را خودش
      # نوشته بود و برای نوبتِ پول‌نداده و نوبتِ هفتهٔ آینده هم دکمه می‌داد —
      # و مسیرِ سرورش هم شرط نداشت، پس آن دکمه واقعاً کار می‌کرد.
      - name: Verify one appointment state machine
        run: node scripts/verify-state-machine.js

      # «امروز» به وقتِ مطب، نه کانتینر: سرورِ UTC و کاربرِ تهران هر شب
      # ۳:۳۰ ساعت یک روز اختلاف داشتند و دکمهٔ «شروع» از کلِ میزِ پذیرش
      # غیب می‌شد، بی‌هیچ خطایی.
      - name: Verify one definition of today
        run: node scripts/e2e/clinic-day-local.mjs

      - name: Verify atomic clinical order answers and review lifecycle (W1.2)
        run: node scripts/e2e/w1-2-order-review-local.mjs

      - name: Verify atomic intake approval, idempotency and committed SMS queue (W1.4)
        run: node scripts/e2e/w1-4-approve-local.mjs

      # ⚠️ W1.1/D01: the follow-up row is created when the VISIT is registered,
      # which for a planned operation is BEFORE its opDate. Matching answers by
      # patientId + createdAt therefore reported every planned operation as
      # unfollowed, and let one answer cover two operations. The exact key was
      # in the same JSON all along (data.followUpVisitId / followUpDay).
      - name: Verify follow-up matching by exact key, per due date and cap notice (W1.1)
        run: node scripts/e2e/w1-1-unfollowed-local.mjs

      # ⚠️ W1.7/D07: post-op care and the follow-up form are planted for an
      # operation nobody has confirmed happened — opStatus stays 'pending'
      # until someone records it, so a postponed patient got after-care
      # instructions. Per DECISIONS #1 the message still goes, with hedged
      # wording, and is re-planted with the normal text the moment the
      # surgeon marks it done. Messages sent BEFORE the op are never hedged.
      - name: Verify hedged after-care text until the operation is confirmed (W1.7)
        run: node scripts/e2e/w1-7-postop-local.mjs

      # ⚠️ W1.3/D03a: a free record-scope form is approved inline by fill(),
      # which skipped syncLinkDocuments entirely, so the patient's MRI link
      # never became a record document. approve() only accepts
      # pending_approval rows, so such a row could never be repaired. Both
      # paths now go through one commitAnswers step.
      - name: Verify both approval paths turn form links into documents (W1.3)
        run: node scripts/e2e/w1-3-approve-local.mjs

      # ⚠️ W1.8/D09: the only way to store a patient's answers was fill(),
      # which advances status — so a half-filled multi-page form could not be
      # saved at all and a refresh (or a dropped mobile connection) lost every
      # typed word. draft() merges into data and never touches status.
      - name: Verify the public form draft never advances status (W1.8)
        run: node scripts/e2e/w1-8-draft-local.mjs

      # The UI half of the same contract (§6): resume on the saved page, show
      # the save state, and keep nothing in browser storage — the form holds
      # medical answers and is filled on shared phones.
      # The runner has no browser and playwright-core ships none, so this is
      # the first browser suite this workflow can actually run. Pinned to the
      # playwright-core version in package.json so the protocol matches.
      # ⚠️ خودِ مرورگر کش می‌شود، ولی بسته‌های سیستمی نه — آن‌ها روی رانرِ تازه
      # باید هر بار نصب شوند. پس در hit فقط `install-deps` می‌رود (چند ثانیه)
      # و دانلودِ ~۱۲۰ مگابایتیِ chromium (۲۵ ثانیه در هر جاب، پنج جاب) می‌افتد.
      # کلید نسخهٔ playwright را دارد؛ با بالابردنِ نسخه خودش باطل می‌شود.
      - name: Cache the playwright browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.61.1-${{ runner.os }}
      - name: Install chromium for the browser suite
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx --yes playwright@1.61.1 install --with-deps chromium
      - name: System deps for the cached chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx --yes playwright@1.61.1 install-deps chromium

      # ⚠️ ۳۱ سوییت `executablePath: '/opt/pw-browsers/chromium'` را هاردکد
      # کرده‌اند و ۱۴ تای دیگر آن را پیش‌فرضِ `E2E_CHROME` گرفته‌اند — مسیرِ
      # کانتینرِ توسعه، که روی رانر نیست. به‌جای دست‌زدن به ۵۸ فایلِ سه لِین،
      # همان مسیرها را به chromiumِ نصب‌شدهٔ playwright سیم‌لینک می‌کنیم.
      - name: Expose chromium where the suites expect it
        run: |
          CHROME="$(find ~/.cache/ms-playwright -type f -name chrome -path '*chromium-*' | head -1)"
          test -x "$CHROME" || { echo "chromium پیدا نشد"; exit 1; }
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          sudo ln -sfn "$CHROME" /opt/pw-browsers/chromium
          sudo ln -sfn "$CHROME" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          sudo ln -sfn "$CHROME" /tmp/chromium
          echo "E2E_CHROME=$CHROME" >> "$GITHUB_ENV"

