      # old data is W1.10" was written into STATUS five times. The repair must
      # re-run the SAME forward functions (syncLinkDocuments, answerDocuments,
      # upsertWork), which are all idempotent, rather than bespoke UPDATEs that
      # would drift from the real path. And what cannot be repaired without
      # guessing -- which operation an old follow-up answer belongs to -- is
      # queued for a human, never guessed into the data as if it were fact.
      - name: Verify the historical-data scan repairs, queues and never guesses (W1.10)
        run: node scripts/e2e/w1-10-repair-local.mjs

      # ⚠️ W0.5: a lab result is usually just a photo of a sheet, and the
      # patient's order page had no way to send one -- and its submit button
      # refused an answer with no text or link. Two separate defects met here:
      # .od-send carried `flex: 1 1 220px`, a rule written for the staff action
