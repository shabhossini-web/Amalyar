name: security-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/security-permissions-hardening]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend install
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Backend install
        working-directory: server
        run: npm ci
      - name: Validate tenant schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/tenant_ci
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Validate control schema
        working-directory: server
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control_ci
        run: npx prisma validate --schema prisma/control/schema.prisma
      - name: Backend build
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/tenant_ci
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control_ci
          TENANT_DATABASE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
        run: npm run build
      - name: Verify startup does not require tenant context
        working-directory: server
        run: node -e "require('reflect-metadata'); const { PrismaService } = require('./dist/prisma/prisma.service'); const p = new PrismaService({ require() { throw new Error('tenant context accessed during startup'); } }); if (p.then !== undefined) process.exit(1); Promise.resolve(p.onModuleDestroy()).catch(() => process.exit(1));"
      - name: Verify generated control client
        working-directory: server
        run: test -f src/generated/control/index.js
