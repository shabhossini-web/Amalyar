name: security-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/security-permissions-hardening]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend install
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Backend install
        working-directory: server
        run: npm ci
      - name: Validate tenant schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/tenant_ci
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Validate control schema
        working-directory: server
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control_ci
        run: npx prisma validate --schema prisma/control/schema.prisma
      - name: Backend build
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/tenant_ci
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control_ci
          TENANT_DATABASE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
        run: npm run build
      - name: Verify stripped API prefix restoration
        working-directory: server
        run: node -e "const { restoreApiPrefix } = require('./dist/common/api-prefix'); const cases = [['/auth/setup-status','/api/auth/setup-status'],['/auth/setup-status?x=1','/api/auth/setup-status?x=1'],['/api/auth/setup-status','/api/auth/setup-status'],['/api?x=1','/api?x=1'],['/','/api/']]; for (const [input, expected] of cases) { const actual = restoreApiPrefix(input); if (actual !== expected) { console.error({ input, expected, actual }); process.exit(1); } }"

      - name: Verify SMS production fallback fails closed
        working-directory: server
        run: node -e "const { SmsService } = require('./dist/sms/sms.service'); process.env.NODE_ENV='production'; delete process.env.MELI_API_KEY; delete process.env.MELI_FROM; new SmsService().sendOtp('09120000000','000000').then(() => process.exit(1)).catch((e) => { if (e?.getStatus?.() !== 503) { console.error('expected HTTP 503'); process.exit(1); } });"
      - name: Verify startup does not require tenant context
        working-directory: server
        run: node -e "require('reflect-metadata'); const { PrismaService } = require('./dist/prisma/prisma.service'); const p = new PrismaService({ require() { throw new Error('tenant context accessed during startup'); } }); if (p.then !== undefined) process.exit(1); Promise.resolve(p.onModuleDestroy()).catch(() => process.exit(1));"
      - name: Verify tenant isolation boundaries
        working-directory: server
        run: node scripts/verify-tenant-isolation.js
      - name: Verify Platform Admin configuration fails closed
        working-directory: server
        run: node -e "const { platformAdminConfig, normalizePlatformPhone, normalizeWebOtpHost, platformPhoneRef, resolvePlatformPhoneRef } = require('./dist/platform/platform.config'); process.env.NODE_ENV='production'; process.env.PLATFORM_ADMIN_ENABLED='false'; delete process.env.PLATFORM_ADMIN_SECRET; delete process.env.PLATFORM_ADMIN_PHONES; delete process.env.PLATFORM_ADMIN_WEBOTP_HOST; if (platformAdminConfig().enabled) process.exit(1); process.env.PLATFORM_ADMIN_ENABLED='true'; let failed=false; try { platformAdminConfig(); } catch { failed=true; } if (!failed) { console.error('expected missing Platform Admin secrets to fail'); process.exit(1); } process.env.PLATFORM_ADMIN_SECRET='ci-only-platform-secret-with-32-characters'; process.env.PLATFORM_ADMIN_PHONES='09000000000'; process.env.PLATFORM_ADMIN_WEBOTP_HOST='admin-staging.amalyar.com'; const cfg=platformAdminConfig(); const ref=platformPhoneRef(cfg.secret,'09000000000'); if (!cfg.enabled || !cfg.phones.has('09000000000') || cfg.webOtpHost !== 'admin-staging.amalyar.com' || normalizeWebOtpHost('ADMIN-STAGING.AMALYAR.COM.') !== 'admin-staging.amalyar.com' || normalizePlatformPhone('+989000000000') !== '09000000000' || ref.includes('09000000000') || resolvePlatformPhoneRef(cfg,ref) !== '09000000000' || resolvePlatformPhoneRef(cfg,'invalid') !== null) process.exit(1);"

      - name: Verify Platform Admin SMS uses origin-bound WebOTP
        working-directory: server
        run: |
          node -e "const { SmsService } = require('./dist/sms/sms.service'); process.env.NODE_ENV='test'; process.env.MELI_API_KEY='ci-key'; process.env.MELI_FROM='ci-line'; let payload; global.fetch=async (_url,init) => { payload=JSON.parse(init.body); return { ok:true, json:async()=>({recIds:[1]}) }; }; new SmsService().sendOtp('09000000000','123456','admin-staging.amalyar.com').then((result) => { if (!result.sent || !payload?.text?.endsWith('@admin-staging.amalyar.com #123456')) process.exit(1); }).catch(() => process.exit(1));"
      - name: Verify generated control client
        working-directory: server
        run: test -f src/generated/control/index.js

      # «هر کد ملی، یک بیمار، یک پرونده» قاعده‌ای داده‌ای است، نه تصمیمی در UI:
      # اگر ایندکسِ یکتا یا آزمونِ رقمِ کنترلی برگردد، پرونده‌های تکراری بی‌سروصدا
      # ساخته می‌شوند و ادغامشان بعداً دستی و پرخطاست.
      - name: Verify patient identity rule (unique national ID + checksum)
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          if (!/nationalId\s+String\?\s+@unique/.test(schema)) { console.error('Patient.nationalId باید @unique بماند'); process.exit(1); }
          const mig = fs.readFileSync('prisma/migrations/20260728090000_patient_national_id_unique/migration.sql', 'utf8');
          if (!mig.includes('patients_national_id_key') || !mig.includes('RAISE EXCEPTION')) { console.error('مهاجرتِ یکتاییِ کد ملی دست‌کاری شده'); process.exit(1); }
          const { isValidNationalId, toEnDigits } = require('./dist/common/identity');
          const cases = [['0084575646', true], ['۰۰۸۴۵۷۵۶۴۶', true], ['1234567890', false], ['0000000000', false], ['12345', false]];
          for (const [value, expected] of cases) {
            if (isValidNationalId(value) !== expected) { console.error({ value, expected }); process.exit(1); }
          }
          if (toEnDigits('۰۹۱۲۱۲۳۴۵۶۷') !== '09121234567') process.exit(1);
          "

      # پروندهٔ بیمار دو مرزِ حساس دارد که هیچ‌کدام را تایپ‌چک نمی‌گیرد:
      # جداییِ فیلدهای بالینی از هویتی، و ساخته‌شدنِ مسیرِ فایل از tenantId.
      - name: Verify patient record boundaries
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('src/patients/record.service.ts', 'utf8');
          // فیلدهای حساس نباید به نمای عمومی سُر بخورند.
          const pub = svc.split('const PUBLIC_FIELDS')[1].split('} as const')[0];
          for (const leaked of ['allergies', 'insurer', 'chronicConditions', 'medications', 'emergencyPhone']) {
            if (pub.includes(leaked)) { console.error('فیلدِ بالینی در PUBLIC_FIELDS: ' + leaked); process.exit(1); }
          }
          const store = fs.readFileSync('src/storage/storage.service.ts', 'utf8');
          if (!store.includes('tenantContext.require()')) { console.error('مسیرِ ذخیره‌سازی باید از TenantContext بیاید'); process.exit(1); }
          if (!/\\\$\\{tenantId\\}|tenantId/.test(store) || !store.includes('createHash')) { console.error('نامِ فایل باید hash محتوا باشد'); process.exit(1); }
          // شرحِ بالینی باید تغییرناپذیر بماند: هیچ update ای روی body.
          if (/clinicalNote\.update\([^)]*body/s.test(svc)) { console.error('شرحِ بالینی نباید UPDATE شود؛ نسخهٔ تازه بسازید'); process.exit(1); }
          console.log('patient record boundaries ok');
          "

      # نوعِ ملاقات باید فهرستِ بسته بماند. اگر روزی متنِ آزاد شود، همان مشکلِ
      # opType برمی‌گردد: «ویزیت» و «ویزیت مطب» و «clinic» سه چیزِ متفاوت می‌شوند
      # و گزارش‌گیری بی‌معنی می‌گردد.
      - name: Verify visit kind stays a closed set
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const dto = fs.readFileSync('src/patients/dto/visit.dto.ts', 'utf8');
          const m = dto.match(/VISIT_KINDS = \[([^\]]+)\]/);
          if (!m) { console.error('VISIT_KINDS تعریف نشده است'); process.exit(1); }
          const kinds = m[1].split(',').map((s) => s.trim().replace(/['\\\"]/g, '')).filter(Boolean);
          if (!kinds.includes('surgery')) { console.error('surgery باید در فهرست بماند'); process.exit(1); }
          if (!/@IsIn\(VISIT_KINDS/.test(dto)) { console.error('kind باید با IsIn اعتبارسنجی شود'); process.exit(1); }
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          if (!/kind\s+String\s+@default\(\"surgery\"\)/.test(schema)) { console.error('پیش‌فرضِ kind باید surgery بماند'); process.exit(1); }
          // برچسب‌های فارسی باید برای همهٔ مقادیر وجود داشته باشند، وگرنه UI خالی نشان می‌دهد.
          const ui = fs.readFileSync('../src/app/Dashboard.jsx', 'utf8');
          for (const k of kinds) {
            if (!new RegExp('\\\\b' + k + '\\\\s*:').test(ui)) { console.error('برچسبِ UI برای ' + k + ' نیست'); process.exit(1); }
          }
          console.log('visit kinds ok:', kinds.join(', '));
          "

      # مالیِ مراجعه باید از ردیف‌ها مشتق شود، نه از ستونِ سرجمع. یک ستونِ
      # cache شده دیر یا زود از ردیف‌ها عقب می‌ماند و آن‌وقت معلوم نیست کدام درست است.
      - name: Verify billing derives from rows, not cached columns
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const visit = schema.split('model Visit {')[1].split(/\n}/)[0];
          for (const dead of ['amount', 'paid']) {
            if (new RegExp('^\\\\s*' + dead + '\\\\s', 'm').test(visit)) {
              console.error('ستونِ سرجمعِ ' + dead + ' نباید به Visit برگردد'); process.exit(1);
            }
          }
          const { summarize } = require('./dist/patients/billing.service');
          const cases = [
            [[], [], 0, 0, 0],
            [[{amount: 12000000}, {amount: 14000000}, {amount: -2000000}], [{amount: 15000000}], 24000000, 15000000, 9000000],
            [[{amount: 100}], [{amount: 300}], 100, 300, -200],
          ];
          for (const [c, p, total, paid, due] of cases) {
            const r = summarize(c, p);
            if (r.total !== total || r.paid !== paid || r.due !== due) { console.error({ r, total, paid, due }); process.exit(1); }
          }
          console.log('billing summarize ok');
          "

      # حوزهٔ کاری «همان یک تغییرِ کوچک» است: اگر کلیدهای سرور و دیکشنریِ واژگانِ
      # فرانت از هم جدا بیفتند، نصبِ یک مشتری با واژه‌های نصفه بالا می‌آید.
      - name: Verify vertical presets match UI terminology
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const { VERTICALS, DEFAULT_VERTICAL, featurePlanFor } = require('./dist/config/verticals');
          const keys = Object.keys(VERTICALS);
          if (!keys.includes(DEFAULT_VERTICAL)) { console.error('حوزهٔ پیش‌فرض در فهرست نیست'); process.exit(1); }
          const terms = fs.readFileSync('../src/lib/terms.js', 'utf8');
          for (const k of keys) {
            if (!new RegExp('(^|\\\\s)' + k + '\\\\s*:').test(terms)) {
              console.error('واژگانِ فرانت برای حوزهٔ ' + k + ' تعریف نشده'); process.exit(1);
            }
          }
          // هر حوزه باید داشبورد و کاربران را داشته باشد، وگرنه نصب بی‌استفاده است.
          for (const k of keys) {
            const plan = featurePlanFor(k);
            for (const must of ['dashboard', 'users']) {
              if (!plan[must]) { console.error('حوزهٔ ' + k + ' ماژولِ ' + must + ' را ندارد'); process.exit(1); }
            }
          }
          console.log('verticals ok:', keys.join(', '));
          "

      # کتابِ ارزش نسبی مرجعِ صورت‌حساب و بیمه است: ثابتِ «کل = حرفه‌ای + فنی»
      # باید برقرار بماند و ارزش‌ها عددِ صحیحِ هزارم‌واحد، وگرنه جمعِ فاکتور
      # خطای شناور می‌گیرد و با صورت‌حسابِ بیمه نمی‌خواند.
      - name: Verify service-code catalog integrity
        working-directory: server
        run: |
          node -e "
          const seed = require('./prisma/seed-data/service-codes.json');
          const i = Object.fromEntries(seed.fields.map((f, n) => [f, n]));
          if (!seed.rows.length) { console.error('کتابِ خالی'); process.exit(1); }
          const codes = new Set();
          for (const r of seed.rows) {
            const code = r[i.code];
            if (!/^[0-9]{6}\$/.test(code)) { console.error('کدِ نامعتبر: ' + code); process.exit(1); }
            if (codes.has(code)) { console.error('کدِ تکراری: ' + code); process.exit(1); }
            codes.add(code);
            if (!r[i.title]) { console.error('کدِ بدونِ شرح: ' + code); process.exit(1); }
            for (const f of ['rvuTotal', 'rvuProfessional', 'rvuTechnical', 'rvuAnesthesia']) {
              const v = r[i[f]];
              if (v !== null && !Number.isInteger(v)) { console.error(code + ': ' + f + ' صحیح نیست'); process.exit(1); }
            }
            const [t, pro, tech] = [r[i.rvuTotal], r[i.rvuProfessional], r[i.rvuTechnical]];
            if ([t, pro, tech].every((v) => v !== null) && t !== pro + tech) {
              console.error(code + ': کل ≠ حرفه‌ای + فنی'); process.exit(1);
            }
          }
          // محاسبهٔ فی: هر جزء جدا ضرب و گرد می‌شود، نه ارزشِ کل در یک ضریب.
          const part = (rvu, factor) => (rvu ? Math.round((rvu * factor) / 1000) : 0);
          if (part(15000, 320000) + part(7300, 160000) !== 5968000) { console.error('فرمولِ فی غلط است'); process.exit(1); }
          console.log('service codes ok:', seed.rows.length, 'نسخهٔ', seed.version);
          "

      # دو مرزی که تایپ‌چک نمی‌گیرد: کاتالوگ باید خودش seed شود (وگرنه شرکتِ تازه
      # جستجوی بی‌نتیجه می‌بیند بدونِ هیچ نشانه‌ای)، و Item باید کاتالوگ بماند
      # نه انبار — ستونِ موجودی اینجا یعنی یک ردیف همزمان تعریف و موجودی است.
      - name: Verify catalog self-seeds and Item stays catalog-only
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('src/patients/service-codes.service.ts', 'utf8');
          for (const entry of ['async search', 'async priceOf', 'async count']) {
            const body = svc.split(entry)[1]?.split('\n  }')[0] ?? '';
            if (!body.includes('ensureImported')) { console.error(entry + ' باید کاتالوگ را seed کند'); process.exit(1); }
          }
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          // خطوطِ رابطه کنار گذاشته می‌شوند: \`lots StockLot[]\` مجاز است، ستونِ اسکالر نه.
          const item = schema.split('model Item {')[1].split(/\n}/)[0]
            .split('\n').filter((l) => !/\[\]|StockLot|Charge/.test(l)).join('\n');
          for (const stock of ['quantity', 'stock', 'onHand', 'lot', 'serial', 'expiry']) {
            if (new RegExp('^\\\\s*' + stock + '\\\\s', 'mi').test(item)) {
              console.error('Item کاتالوگ است نه انبار؛ ' + stock + ' جدولِ خودش را می‌خواهد'); process.exit(1);
            }
          }
          console.log('catalog boundaries ok');
          "

      - name: Verify stock balance is derived from an append-only ledger
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const lot = schema.split('model StockLot {')[1].split(/\n}/)[0];
          // موجودیِ ذخیره‌شده کنارِ دفتر، دیر یا زود از دفتر جدا می‌افتد.
          for (const cached of ['quantity', 'balance', 'onHand', 'count']) {
            if (new RegExp('^\\\\s*' + cached + '\\\\s', 'mi').test(lot)) {
              console.error('موجودی باید از دفتر مشتق شود؛ StockLot.' + cached + ' ممنوع است'); process.exit(1);
            }
          }
          const svc = fs.readFileSync('src/patients/inventory.service.ts', 'utf8');
          if (!/export function balanceOf/.test(svc)) { console.error('balanceOf باید یک فرمولِ مشترک باشد'); process.exit(1); }
          // دفتر فقط اضافه می‌شود؛ اصلاح با حرکتِ جبرانی است نه با حذف/ویرایش.
          if (/stockMovement\\.(delete|deleteMany|update|updateMany)/.test(svc)) {
            console.error('دفترِ انبار فقط append است — حذف/ویرایشِ حرکت ممنوع'); process.exit(1);
          }
          const move = svc.split('private async move')[1].split(/\n  }/)[0];
          for (const rule of ['FOR UPDATE', 'expires_at', 'next < 0', 'serial_no']) {
            if (!move.includes(rule)) { console.error('قاعدهٔ انبار در move غایب است: ' + rule); process.exit(1); }
          }
          const bill = fs.readFileSync('src/patients/billing.service.ts', 'utf8');
          if (!/returnToStock/.test(bill)) { console.error('حذفِ قلمِ فاکتور باید کالا را با حرکتِ جبرانی برگرداند'); process.exit(1); }
          console.log('stock ledger ok');
          "

      - name: Verify op duration is derived, never stored
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const visit = schema.split('model Visit {')[1].split(/\n}/)[0];
          for (const cached of ['duration', 'durationMin', 'opMinutes']) {
            if (new RegExp('^\\\\s*' + cached + '\\\\s', 'mi').test(visit)) {
              console.error('مدتِ عمل مشتق است؛ Visit.' + cached + ' ممنوع است'); process.exit(1);
            }
          }
          // ساعت‌ها رشته‌اند نه DateTime — وگرنه عملِ ۲۳:۳۰ با منطقهٔ زمانی به روزِ بعد می‌پرد.
          for (const col of ['opStartTime', 'opEndTime', 'techArriveTime']) {
            const line = visit.split('\n').find((l) => l.trim().startsWith(col));
            if (!line || !/String\\?/.test(line)) { console.error(col + ' باید String? باشد'); process.exit(1); }
          }
          const svc = fs.readFileSync('src/patients/patients.service.ts', 'utf8');
          if (!/export function durationOf/.test(svc)) { console.error('durationOf باید یک فرمولِ مشترک باشد'); process.exit(1); }
          if (!/durationMin: durationOf\\(/.test(svc)) { console.error('enrich باید مدت را از durationOf بگیرد'); process.exit(1); }
          // گذشتن از نیمه‌شب باید صریح هندل شده باشد، نه عددِ منفی.
          const body = svc.split('export function durationOf')[1].split(/\n}/)[0];
          if (!body.includes('24 * 60')) { console.error('عملِ نیمه‌شب‌گذر در durationOf هندل نشده'); process.exit(1); }
          const ui = fs.readFileSync('../src/app/Dashboard.jsx', 'utf8');
          // input[type=time] قالبِ نمایشش را مرورگر تعیین می‌کند (۱۲ساعته در کرومیوم)
          // و بین اندروید/سافاری/ویندوز فرق می‌کند — قانونِ سازگاریِ چندپلتفرمی.
          if (/type=\"time\"/.test(ui)) { console.error('input[type=time] قالبش را مرورگر تعیین می‌کند؛ ورودیِ متنیِ نرمال‌شده لازم است'); process.exit(1); }
          console.log('op duration ok');
          "

      - name: Verify Jalali conversion matches reference dates
        run: |
          # هستهٔ سرور و فرانت باید یکی باشند. یک‌بار سمتِ سرور از روی حافظه
          # بازنویسی شد، جدولِ breaks فرق کرد و همهٔ تاریخ‌های وارد‌شده یک سال
          # عقب افتادند — بدونِ هیچ خطایی. این گارد همان را می‌گیرد.
          server/node_modules/.bin/tsc server/src/common/jalali.ts --outDir /tmp/jal --module commonjs --target es2020
          node -e "
          const fs = require('fs');
          const srv = fs.readFileSync('server/src/common/jalali.ts', 'utf8');
          const web = fs.readFileSync('src/lib/jalali.js', 'utf8');
          const breaksOf = (t) => (t.match(/breaks = \\[[^\\]]+\\]/) || [''])[0].replace(/\\s+/g, '');
          if (!breaksOf(srv) || breaksOf(srv) !== breaksOf(web)) {
            console.error('جدولِ breaks سرور و فرانت یکی نیست'); process.exit(1);
          }
          if (!srv.includes('~~(a / b)')) { console.error('تقسیم باید truncation باشد (~~) نه Math.floor'); process.exit(1); }
          const { jalaliStrToDate } = require('/tmp/jal/jalali.js');
          const cases = { '1403/01/01': '2024-03-20', '1404/12/29': '2026-03-20', '1405/04/10': '2026-07-01', '1405/05/07': '2026-07-29' };
          for (const [j, g] of Object.entries(cases)) {
            const got = jalaliStrToDate(j);
            const iso = got && got.toISOString().slice(0, 10);
            if (iso !== g) { console.error(j + ' → ' + iso + ' ولی باید ' + g + ' باشد'); process.exit(1); }
          }
          if (jalaliStrToDate('چرت') !== null) { console.error('ورودیِ نامعتبر باید null بدهد'); process.exit(1); }
          console.log('jalali ok');
          "

      - name: Verify tenant databases migrate before serving traffic
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const main = fs.readFileSync('src/main.ts', 'utf8');
          // migration باید *پیش از* listen اجرا شود، وگرنه اولین درخواست به
          // دیتابیسِ نیمه‌مهاجرت‌یافته می‌خورد.
          const iMigrate = main.indexOf('TenantMigratorService');
          const iListen = main.indexOf('app.listen');
          if (iMigrate < 0 || iListen < 0 || iMigrate > iListen) {
            console.error('migrationِ شرکت‌ها باید پیش از app.listen اجرا شود'); process.exit(1);
          }
          const svc = fs.readFileSync('src/tenant/tenant-migrator.service.ts', 'utf8');
          // قفلِ مشورتی: دو نمونه در دیپلویِ چرخشی نباید همزمان migrate کنند.
          if (!/pg_try_advisory_lock/.test(svc)) { console.error('قفلِ مشورتی لازم است'); process.exit(1); }
          // شرکتِ خراب نباید جلوی بقیه را بگیرد (برخلافِ ابزارِ دستی که break می‌زند).
          const loop = svc.split('for (const t of tenants)')[1].split('\\n    }')[0];
          if (/\\bbreak\\b/.test(loop)) { console.error('حلقهٔ fleet نباید با اولین خطا متوقف شود'); process.exit(1); }
          // خرابی باید دیده شود: هم در /health هم به‌شکلِ ۵۰۳ برای همان شرکت.
          const health = fs.readFileSync('src/app.controller.ts', 'utf8');
          if (!/migrations/.test(health)) { console.error('/health باید وضعیتِ migration را بدهد'); process.exit(1); }
          const mw = fs.readFileSync('src/tenant/tenant.middleware.ts', 'utf8');
          if (!/isBroken/.test(mw)) { console.error('شرکتِ عقب‌مانده باید پیامِ روشن بگیرد نه ۵۰۰های پراکنده'); process.exit(1); }
          console.log('tenant migration ok');
          "

      - name: Verify export reuses the list filter and never truncates silently
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('server/src/patients/patients.service.ts', 'utf8');
          // فیلتر یک جا ساخته می‌شود؛ وگرنه خروجی و فهرست از هم جدا می‌افتند.
          for (const m of ['async listVisits', 'async exportVisits']) {
            const body = svc.split(m)[1].split(/\\n  }/)[0];
            if (!/this\\.visitWhere\\(/.test(body)) { console.error(m + ' باید از visitWhere استفاده کند'); process.exit(1); }
          }
          // آمار نباید شرطِ فراخوان را بازنویسی کند (باگِ واقعی: فیلترِ وضعیت نادیده می‌شد).
          const strip = (t) => t.replace(/\\/\\*[\\s\\S]*?\\*\\//g, '').replace(/\\/\\/.*\$/gm, '');
          const stats = strip(svc.split('private async visitStats')[1].split(/\\n  }/)[0]);
          if (/\\.\\.\\.scoped, opStatus:/.test(stats)) {
            console.error('visitStats نباید opStatus فراخوان را بازنویسی کند؛ با AND ترکیب کن'); process.exit(1);
          }
          if (!/AND:/.test(stats)) { console.error('visitStats باید شرط‌ها را با AND ترکیب کند'); process.exit(1); }
          // بریدنِ بی‌صدا ممنوع.
          if (!/truncated/.test(svc)) { console.error('خروجی باید بریده‌شدن را اعلام کند'); process.exit(1); }
          const exp = fs.readFileSync('src/app/exports.js', 'utf8');
          if (!/\\uFEFF/.test(exp) && !exp.includes('BOM')) { console.error('CSV باید BOM داشته باشد وگرنه Excel فارسی را خراب می‌کند'); process.exit(1); }
          // نامِ فایل باید ASCII باشد: کرومیوم نامِ غیر-ASCII را دور می‌ریزد.
          const dl = exp.split('export function downloadCsv')[1].split(/\\n}/)[0];
          if (/[^\\x00-\\x7F]/.test((dl.match(/const name = \`[^\`]*\`/) || [''])[0])) {
            console.error('نامِ فایلِ CSV باید ASCII باشد'); process.exit(1);
          }
          console.log('export ok');
          "
