      - name: Verify the patient intake form stays public but never leaks
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');
          const ctl = read('server/src/patients/intake.controller.ts');

          // ① کنترلرِ عمومی نباید هیچ گاردی داشته باشد و کنترلرِ ادمین باید
          //    همه را داشته باشد. مرزِ این دو تنها چیزی است که بینِ نشانیِ
          //    بی‌ورود و کلِ دادهٔ شرکت ایستاده.
          // ⚠️ برش از خطِ **دکوراتور** است نه از export class: گاردهای کلاسِ
          //    ادمین بالای خطِ export می‌نشینند و نسخهٔ اولِ این نگهبان آن‌ها را
          //    داخلِ بلوکِ عمومی می‌دید و روی کدِ سالم قرمز می‌شد.
          const pubStart = ctl.indexOf(\"@Controller('public/intake')\");
          const admStart = ctl.indexOf(\"@Controller('intake')\");
          if (pubStart < 0 || admStart < 0) { console.error('کنترلرهای intake پیدا نشدند'); process.exit(1); }
          if (pubStart > admStart) { console.error('ترتیبِ کلاس‌ها عوض شده — این نگهبان را به‌روز کنید'); process.exit(1); }
          const pubBlock = ctl.slice(pubStart, admStart);
          const admBlock = ctl.slice(admStart);

          if (/@UseGuards|@RequirePermissions|@Feature\(/.test(pubBlock)) {
            console.error('کنترلرِ عمومی گارد گرفته — بیمار دیگر نمی‌تواند فرم را باز کند'); process.exit(1);
          }
          for (const need of ['JwtAuthGuard', 'FeatureGuard', 'PermissionGuard']) {
            if (!new RegExp(need).test(admBlock.split('\n').slice(0, 6).join('\n'))) {
              console.error('کنترلرِ ادمینِ intake بدونِ ' + need + ' است'); process.exit(1);
            }
          }
          // هر متدِ ادمین باید مجوزِ صریح داشته باشد؛ متدِ بی‌مجوز یعنی هرکه
          // ماژول را دارد می‌تواند تأیید کند.
          const admMethods = (admBlock.match(/@(Get|Post|Patch|Delete)\(/g) ?? []).length;
          const admPerms = (admBlock.match(/@RequirePermissions\(/g) ?? []).length;
          if (admPerms < admMethods) {
            console.error('متدِ بی‌مجوز در کنترلرِ ادمینِ intake: ' + admPerms + '/' + admMethods); process.exit(1);
          }

          const svc = read('server/src/patients/intake.service.ts');

          // ② کپچا روی **سرور** سنجیده شود — این نشانی عمومی است و اعتبارسنجیِ
          //    کلاینت جلوی یک اسکریپت را نمی‌گیرد.
          if (!/if \(Number\(dto\.captchaAnswer\) !== Number\(dto\.captchaA\)/.test(svc)) {
            console.error('کپچا روی سرور سنجیده نمی‌شود'); process.exit(1);
          }
          // ③ نوعِ فایلِ فیش هم روی سرور. ⚠️ لنگر روی خودِ «if (» است نه فقط
          //    نامِ ثابت: با «false &&» رشته می‌ماند ولی شرط اجرا نمی‌شود و
          //    نسخهٔ اولِ نگهبان همان را قبول کرد. — «accept»ِ HTML فقط پنجرهٔ انتخاب را
          //    محدود می‌کند، نه درخواست را.
          if (!/if \(!RECEIPT_MIME\.test\(/.test(svc)) {
            console.error('نوعِ فایلِ فیش روی سرور سنجیده نمی‌شود'); process.exit(1);
          }

          // ④ نمای عمومی نباید دادهٔ پرونده بدهد: توکنِ فرم در پیامک می‌رود و
          //    پیامک فوروارد می‌شود.
          // ⚠️ پایانِ برش با «متدِ بعدی» گرفته می‌شود نه با یک کامنتِ خاص.
          //    لنگرِ قبلی یک رشتهٔ کامنت بود که **در فایل وجود نداشت**، پس
          //    indexOf منفی‌یک می‌داد و slice تا تهِ فایل می‌رفت: نگهبان به‌جای
          //    publicView کلِ سرویس را می‌دید و روی هر کدِ سالمی قرمز می‌شد.
          //    چون گامِ قبلی‌اش زودتر می‌ترکید، این خطا هیچ‌وقت دیده نشد.
          const vStart = svc.indexOf('async publicView');
          const vNext = svc.indexOf('\n  async ', vStart + 1);
          const view = svc.slice(vStart, vNext === -1 ? svc.length : vNext);
          for (const leak of ['patient:', 'nationalId:', 'visit:', 'reviewedById']) {
            if (view.includes(leak)) { console.error('publicView دارد ' + leak + ' را لو می‌دهد'); process.exit(1); }
          }

          // ⑤ تأیید باید از همان createVisitِ موجود بگذرد. مسیرِ دومِ ساختِ
          //    مراجعه یعنی روزی یکی‌شان seq یا audit را جا می‌اندازد.
          if (!/this\.patients\.createVisit\(/.test(svc)) {
            console.error('تأیید باید از createVisitِ موجود مراجعه بسازد'); process.exit(1);
          }
          if (/prisma\.visit\.create\(/.test(svc)) {
            console.error('intake نباید مستقیم Visit بسازد'); process.exit(1);
          }

          // ⑥ تولیدِ کدِ بیمار **یک** جا بماند. کپی‌اش در intake یعنی دو تعریف
          //    از «همان بیمار» و روزی یک نفر دو پرونده می‌گیرد.
          if (/AM-\\\${/.test(svc) || /AM-PENDING/.test(svc)) {
            console.error('intake نباید خودش کدِ بیمار بسازد — resolveOrCreatePatient'); process.exit(1);
          }
          if (!/resolveOrCreatePatient/.test(svc)) {
            console.error('intake باید از resolveOrCreatePatientِ مشترک استفاده کند'); process.exit(1);
          }

          // ⑦ صفحهٔ بیمار بیرونِ Protected بماند — بیمار حساب ندارد.
          const app = read('src/App.jsx');
          for (const m of app.matchAll(/<Route path=\"(\/[rf])\/:token\" element=\{([^}]*)\}/g)) {
            if (m[2].includes('Protected')) {
              console.error('صفحهٔ عمومیِ بیمار پشتِ Protected رفته: ' + m[1]); process.exit(1);
            }
          }
          console.log('intake ok');
          "

      - name: Verify intake money is one unit, lands in the ledger, and is server-computed
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          // ① **یک واحدِ پول در کلِ سامانه.** عمل‌یار تومان است؛ نسخهٔ اولِ
          //    intake قراردادِ ریالیِ سامانهٔ قبلی را آورده بود و کلاینت بر ۱۰
          //    تقسیم می‌کرد — یعنی بیمار یک‌دهمِ مبلغ را می‌دید.
          const schema = read('server/prisma/schema.prisma');
          const intakeBlock = schema.slice(schema.indexOf('model IntakeLink'), schema.indexOf('model DiscountCode'));
          // ⚠️ لنگر روی **اعلامِ واحد** است (\«**ریال**\») نه هر ذکرِ کلمه: خودِ
          //    توضیحِ «اولین نسخه ریال بود» باید مجاز بماند، وگرنه نگهبان
          //    درسِ ثبت‌شده را پاک می‌کند.
          if (/\*\*ریال\*\*/.test(intakeBlock)) { console.error('ستونِ مبلغِ intake به ریال اعلام شده'); process.exit(1); }
          for (const f of ['src/pages/Intake.jsx', 'src/app/Intake.jsx']) {
            const src = read(f);
            if (/amount[^\n]*[/*]\s*10\b/.test(src) || /\/ 10\)/.test(src)) {
              console.error(f + ': تبدیلِ واحدِ پول در کلاینت — همه‌جا تومان است'); process.exit(1);
            }
          }

          const svc = read('server/src/patients/intake.service.ts');

          // ② مبلغِ تخفیف **روی سرور** حساب می‌شود. اگر کلاینت مبلغ می‌فرستاد،
          //    هر کسی با یک درخواستِ دستی صفر تومان می‌پرداخت.
          const ctl = read('server/src/patients/intake.controller.ts');
          const dtoBlock = ctl.slice(ctl.indexOf('class DiscountApplyDto'), ctl.indexOf('class CodeCreateDto'));
          if (/amount|discount/i.test(dtoBlock.replace('DiscountApplyDto', ''))) {
            console.error('DTOی اعمالِ تخفیف نباید مبلغ بگیرد — فقط کد'); process.exit(1);
          }
          if (!/Math\.round\(\(row\.amount \*/.test(svc)) {
            console.error('تخفیفِ درصدی باید روی سرور از روی مبلغِ ذخیره‌شده حساب شود'); process.exit(1);
          }
          // تخفیف هرگز از خودِ مبلغ بیشتر نشود، وگرنه فاکتورِ منفی می‌سازد.
          if (!/Math\.max\(0, Math\.min\(off, row\.amount\)\)/.test(svc)) {
            console.error('تخفیف باید به خودِ مبلغ سقف بخورد'); process.exit(1);
          }

          // ③ مبلغ باید وارد **دفتر** شود. تا دیروز amountِ ثبت‌نام هیچ‌جا
          //    نمی‌رفت و مراجعهٔ تأییدشده صفر تومان بود.
          // ⚠️ وجودِ **قلمِ خدمت با خودِ مبلغ** سنجیده می‌شود، نه صرفِ وجودِ
          //    addCharge: قلمِ تخفیف هم همان تابع را صدا می‌زند و نسخهٔ اولِ
          //    نگهبان با حذفِ قلمِ خدمت هم سبز می‌ماند.
          if (!/kind: 'service'[\s\S]{0,200}unitPrice: row\.amount/.test(svc)) {
            console.error('تأیید باید مبلغِ ثبت‌نام را به‌شکلِ قلمِ خدمت در فاکتور بنشاند'); process.exit(1);
          }
          // ④ تخفیف **قلمِ جدا** بماند؛ خالص‌کردنِ عدد یعنی گم‌شدنِ اطلاعات.
          if (!/kind: 'discount'/.test(svc)) {
            console.error('تخفیف باید قلمِ جدا باشد نه کسر از مبلغِ خدمت'); process.exit(1);
          }
          if (/unitPrice: row\.amount - row\.discountAmount/.test(svc)) {
            console.error('مبلغِ خدمت نباید از پیش خالص شود'); process.exit(1);
          }
          /* ⑤ ⚠️ **این بند یک‌بار برعکس بود و مالکِ محصول ردش کرد.**
             نسخهٔ اول می‌گفت «intake هرگز پرداخت ثبت نکند»، چون Paymentِ
             بی‌حساب خزانه را آلوده می‌کند. نتیجه‌اش این شد که مراجعهٔ
             تأییدشده — با فیشی که ادمین همان لحظه دیده بود — کلِ مبلغش
             «مانده» می‌ماند. ترس درست بود، درمان غلط: راهِ حل **پرسیدنِ
             حسابِ مقصد از ادمین** است، نه ثبت‌نکردنِ پول.
             پس آن‌چه ممنوع می‌ماند فقط حدسِ حسابِ مقصد است. */
          const payBlock = svc.slice(svc.indexOf('addPayment('), svc.indexOf('addPayment(') + 400);
          if (svc.includes('addPayment(') && !/bankAccountId: dto\.bankAccountId/.test(payBlock)) {
            console.error('حسابِ مقصدِ پرداخت باید از ادمین بیاید، نه حدس زده شود'); process.exit(1);
          }
          // تنها نویسندهٔ جدولِ پرداخت، سرویسِ حسابداری است.
          if (/payment\.create\(/.test(svc)) {
            console.error('intake نباید مستقیم در جدولِ پرداخت بنویسد — از billing برود'); process.exit(1);
          }

          /* ⑤-ب ⚠️ **بیمار باید بداند به کجا واریز کند.** فرم مبلغ را نشان
             می‌داد و فیش می‌خواست ولی هیچ شمارهٔ حسابی نمی‌داد — یعنی فیشی
             که آپلود می‌شد به حسابِ ما نبود.
             ولی «همهٔ حساب‌های فعال» هم غلط است: این تنها نقطه‌ای است که
             شمارهٔ حساب از نشانیِ **بی‌احراز** خوانده می‌شود، و حسابِ شخصیِ
             شریک نباید سرِ اینترنت برود. پس فقط حسابِ علامت‌خوردهٔ ادمین. */
          if (!svc.includes('private async payTo(')) {
            console.error('نمای عمومیِ فرم باید حسابِ واریز بدهد'); process.exit(1);
          }
          // ⚠️ مرزِ برش «متدِ بعدی» است نه ۶۰۰ کاراکترِ ثابت. پنجرهٔ ثابت با
          //    بلندشدنِ متد از رویِ بندِ select رد می‌شد و نگهبان روی کدِ
          //    کاملاً امن قرمز می‌شد — دقیقاً همان چیزی که رخ داد.
          const pStart = svc.indexOf('private async payTo(');
          const pNext = svc.indexOf('\n  private ', pStart + 1);
          const payTo = svc.slice(pStart, pNext === -1 ? svc.length : pNext);
          if (!/showOnIntake: true/.test(payTo) || !/active: true/.test(payTo)) {
            console.error('فهرستِ واریز فقط حسابِ فعالِ علامت‌خورده باشد'); process.exit(1);
          }
          // ⚠️ **select**ِ صریح، نه شیِ کامل: بدونِ آن یادداشتِ داخلی و شریکِ
          //    صاحبِ حساب هم با یک GETِ بی‌احراز بیرون می‌رفت.
          //    ⚠️ ادعا روی **هر** findMany است، نه صرفاً بودنِ رشتهٔ 'select: {'.
          //    شکلِ درستِ دیگری هم هست: فهرستِ فیلدها یک‌بار در متغیر و بعد
          //    'select' کوتاه‌نویسی شود — که بهتر هم هست، چون دو نسخهٔ فهرست
          //    نمی‌سازد که روزی از هم جدا بیفتند. نسخهٔ قبلیِ نگهبان همان را
          //    رد می‌کرد و آدم را به تکرارِ فهرست هل می‌داد.
          const finds = payTo.match(/findMany\(\{[^;]*?\}\)/gs) || [];
          if (finds.length === 0) { console.error('payTo باید findMany بزند'); process.exit(1); }
          if (!finds.every((f) => /select\s*[,:}]/.test(f))) {
            console.error('حسابِ واریز باید select صریح داشته باشد'); process.exit(1);
          }
          for (const leak of ['partnerId', 'notes', 'balance']) {
            if (new RegExp(leak + ': true').test(payTo)) {
              console.error('فیلدِ ' + leak + ' نباید به فرمِ عمومی برود'); process.exit(1);
            }
          }
          // پیش‌فرضِ ستون **خاموش**: عمومی‌شدن باید تصمیمِ صریحِ ادمین باشد.
          // ⚠️ تا خطِ پایانِ خودِ مدل، نه ۹۰۰ کاراکترِ ثابت: مدل که بلندتر
          //    شد، ستون از پنجره بیرون افتاد و نگهبان روی schemaِ درست قرمز
          //    شد. هر برشِ با طولِ ثابت همین سرنوشت را دارد.
          const bStart = schema.indexOf('model BankAccount');
          const bank = schema.slice(bStart, schema.indexOf('\n}', bStart));
          if (!/showOnIntake\s+Boolean\s+@default\(false\)/.test(bank)) {
            console.error('showOnIntake باید پیش‌فرض false باشد'); process.exit(1);
          }
          // تغییرش هم مثلِ هر تغییرِ مالیِ دیگر باید ردّ ممیزی بگذارد.
          const setPub = (() => {
            const led = read('server/src/patients/ledger.service.ts');
            const i = led.indexOf('async setAccountPublic(');
            return i < 0 ? '' : led.slice(i, i + 700);
          })();
          // ⚠️ لنگر روی **فراخوانی** است نه کلمهٔ audit: کامنتِ بالای همین تابع
          //    خودش این کلمه را دارد و نگهبانِ کلمه‌ای با حذفِ فراخوانی هم سبز می‌ماند.
          if (!/this\.audit\.record\(/.test(setPub)) {
            console.error('عمومی‌کردنِ حساب باید ممیزی شود'); process.exit(1);
          }
          // ⑥ ⚠️ **ادمین نباید فیشِ ندیده را تأیید کند.** تأیید یعنی «پول
          //    رسیده»؛ اگر مدرک در همان شیت نباشد، تأیید امضای نادیده است.
          //    مبلغ و تخفیف هم باید همان‌جا باشند تا با فیش مقایسه شوند.
          const ui = read('src/app/Intake.jsx');
          const sheet = ui.slice(ui.indexOf('function ApproveSheet'), ui.indexOf('function LinkSheet'));
          if (!/<Receipt\s/.test(sheet)) {
            console.error('شیتِ تأیید باید فیش را نشان دهد'); process.exit(1);
          }
          if (!/ia-money/.test(sheet)) {
            console.error('مبلغ و تخفیف باید کنارِ فیش در شیتِ تأیید باشند'); process.exit(1);
          }
          // تخفیف باید در پاسخِ صفِ ادمین هم بیاید، وگرنه «قابلِ پرداخت» برابرِ
          // مبلغِ کامل می‌شود و با فیشِ جلوی چشمِ ادمین نمی‌خواند.
          const listBlock = svc.slice(svc.indexOf('async list('), svc.indexOf('async approve('));
          for (const f of ['discountAmount', 'payable']) {
            if (!listBlock.includes(f)) { console.error('صفِ ادمین باید ' + f + ' بدهد'); process.exit(1); }
          }
          // ⑦ فیش با URLِ عمومیِ ثابت سرو نشود — لینکِ فوروارد‌شده یعنی نشتِ مدرکِ مالی.
          if (/<img[^>]*src=\{\`\$\{[^}]*\}\/patients/.test(ui)) {
            console.error('فیش باید با blobِ پشتِ احراز باز شود، نه URLِ مستقیم'); process.exit(1);
          }
          if (!/apiBlobUrl\(/.test(ui)) {
            console.error('فیش باید از apiBlobUrl بیاید تا هدرِ احراز برود'); process.exit(1);
          }
          console.log('intake money ok');
          "

      - name: Verify the public survey never leaks the patient
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const svc  = fs.readFileSync('server/src/patients/survey.service.ts', 'utf8');
          const ctrl = fs.readFileSync('server/src/patients/survey.controller.ts', 'utf8');
          const reg  = fs.readFileSync('server/src/auth/access-registry.ts', 'utf8');
          const css  = fs.readFileSync('src/app/definitions.css', 'utf8');

          /* ⚠️ کامنت‌ها قبل از هر تطبیق برداشته می‌شوند. بندِ اول همین‌جا **گاز
             دروغین** داد: کامنتِ خودِ کنترلر توضیح می‌داد چرا \`@UseGuards\`
             این‌جا نیست و نگهبان همان نثر را کدِ واقعی خواند. دومین بار است که
             این تله را می‌بینم. */
          const code = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*\$/gm, '');
          const sCode = code(svc);
          const cCode = code(ctrl);

          /* ① ⚠️ **صفحه‌ی عمومیِ نظرسنجی نباید چیزی از بیمار بدهد.** لینک با
             پیامک می‌رود و فوروارد می‌شود؛ اگر نام یا کدِ پرونده برگردد،
             نظرسنجی به پنجره‌ای به پروندهٔ بیمار تبدیل می‌شود. */
          const pv = sCode.slice(sCode.indexOf('async publicView('), sCode.indexOf('async submit('));
          for (const leak of ['firstName', 'lastName', 'patient:', 'code', 'phone', 'nationalId']) {
            /* زیررشته‌ی ساده — \`\b\` در زنجیره‌ی YAML→bash→node به نویسه‌ی
               backspace تبدیل می‌شد و هرگز match نمی‌کرد. */
            if (pv.includes(leak)) {
              console.error('publicViewِ نظرسنجی نباید ' + leak + ' بدهد'); process.exit(1);
            }
          }
          // ② کنترلرِ عمومی باید **بدونِ گارد** باشد و کنترلرِ ادمین **با گارد**.
          /* ⚠️ مرزِ برش روی **دکوراتور** است نه روی \`export class\`: دکوراتورها
             پیش از تعریفِ کلاس می‌آیند، پس بریدن تا \`export class
             SurveyController\` دکوراتورِ کنترلرِ ادمین را داخلِ سهمِ کنترلرِ
             عمومی می‌گذاشت و نگهبان گاردِ آن یکی را به این یکی نسبت می‌داد. */
          const pubStart = cCode.indexOf(\"@Controller('public')\");
          const pubEnd = cCode.indexOf('@Controller()', pubStart);
          const pubCtrl = cCode.slice(pubStart, pubEnd > 0 ? pubEnd : cCode.length);
          if (/UseGuards/.test(pubCtrl)) {
            console.error('کنترلرِ عمومی نباید گارد داشته باشد — بیمار لاگین ندارد'); process.exit(1);
          }
          if (!/@UseGuards\(JwtAuthGuard, PermissionGuard\)[\s\S]{0,80}export class SurveyController/.test(cCode)) {
            console.error('کنترلرِ ادمین باید پشتِ گارد باشد'); process.exit(1);
          }
          // ③ فهرستِ عمومیِ کانال‌ها نباید شمارنده‌ی بیمار بدهد.
          /* ⚠️ سنجه **وجودِ projectionِ صریح** است، نه نبودِ واژه‌ی
             \`patientCount\`. بندِ اول دنبالِ آن واژه می‌گشت و وقتی کسی کلِ ردیف
             را برمی‌گرداند (\`return rows;\`) هیچ واژه‌ای نبود تا ببیند —
             نگهبان سبز می‌ماند در حالی که همه‌چیز لو می‌رفت. */
          const src = pubCtrl.slice(pubCtrl.indexOf('async sources('), pubCtrl.indexOf('view(@Param'));
          if (!src.includes('asksWho: r.asksWho') || src.includes('patientCount')) {
            console.error('فهرستِ عمومیِ کانال‌ها باید فیلدها را صریح انتخاب کند، نه کلِ ردیف را'); process.exit(1);
          }
          // ④ پاسخ یک‌بار مصرف است — نظرسنجیِ بازنویسی‌شدنی داده نیست.
          if (!/answered.*قبلاً ثبت شده/s.test(svc)) {
            console.error('پاسخِ دوباره باید رد شود'); process.exit(1);
          }
          /* ⑤ کلیدهای مجوز باید در رجیستری **وجود داشته باشند**. کلیدِ اختراعی
             را گارد با پیش‌فرضِ سوپرادمین می‌بندد و ادمین ۴۰۳ می‌گیرد بی‌آنکه
             در ماتریسِ دسترسی چیزی برای روشن‌کردن ببیند. */
          for (const m of cCode.matchAll(/RequirePermissions\('([^']+)'\)/g)) {
            if (!reg.includes(\"key: '\" + m[1] + \"'\")) {
              console.error('مجوزِ ' + m[1] + ' در access-registry نیست'); process.exit(1);
            }
          }
          /* ⑥ ⚠️ کنترل‌های \`<span>\`ی فرمِ داده‌محور باید با پیشوندِ \`.dyn\`
             نوشته شوند: \`.pf-field > span { display: block }\` وزنش بیشتر است
             و بدونِ پیشوند، ستاره‌های امتیاز **زیرِ هم** می‌افتند. هیچ آزمونِ
             APIای این را نمی‌گیرد. */
          for (const k of ['dyn-rate', 'dyn-bool', 'dyn-multi']) {
            /* ⚠️ زیررشته‌ی ساده و نه regex — زنجیره‌ی YAML→bash→node یک لایه
               بک‌اسلش می‌خورد و \`\\.\` به نویسه‌ی نقطه‌ی معمولی تبدیل می‌شد؛
               الگو دیگر match نمی‌کرد و نگهبان دروغین قرمز می‌شد. */
            if (!css.includes('.dyn .' + k + ' {')) {
              console.error('.' + k + ' باید با پیشوندِ .dyn نوشته شود وگرنه display اش بازنویسی می‌شود'); process.exit(1);
            }
          }
          console.log('survey ok');
          "

      - name: Verify the form engine keeps one definition of "required"
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          const presets = read('server/src/patients/form-presets.ts');
          const service = read('server/src/patients/forms.service.ts');
          const dyn     = read('src/ui/DynForm.jsx');

          /* ① ⚠️ **قرارِ کلیدِ هسته‌ای.** \`split()\` هر کلیدی را که در
             BUILTIN_VISIT_KEYS نباشد به \`Visit.extra\` می‌فرستد — بی‌صدا و
             بدونِ خطا. پس فیلدی که در قالبِ یک فرمِ **مراجعه** builtin علامت
             خورده ولی از فهرست جا مانده، مقدارش در JSON دفن می‌شود و ستونش
             خالی می‌ماند. هیچ آزمونی این را نمی‌گیرد چون هیچ‌چیز خطا نمی‌دهد. */
          const setBody = presets.match(/BUILTIN_VISIT_KEYS = new Set\(\[([^\]]*)\]/s);
          if (!setBody) { console.error('BUILTIN_VISIT_KEYS پیدا نشد'); process.exit(1); }
          const declared = new Set(
            setBody[1].split(',').map((x) => x.trim().replace(/^'|'\$/g, '')).filter(Boolean),
          );

          /* فقط قالب‌های scope=visit سنجیده می‌شوند: فیلدهای builtinِ فرمِ
             ثبت‌نام ستونِ Patient هستند و مسیرِ ذخیره‌شان IntakeService است،
             نه split(). */
          const visitBlocks = presets.split(/const [A-Z_]+: PresetForm = \{/).slice(1)
            .filter((b) => /scope: 'visit'/.test(b));
          const missing = [];
          for (const b of visitBlocks) {
            for (const m of b.matchAll(/key: '([a-zA-Z0-9_]+)'[^}]*builtin: true/g)) {
              if (!declared.has(m[1])) missing.push(m[1]);
            }
          }
          /* فیلدهای CORE با spread می‌آیند، پس جدا هم سنجیده می‌شوند. */
          const coreBlock = presets.match(/const CORE = \{(.*?)\} as const;/s);
          if (coreBlock) {
            for (const m of coreBlock[1].matchAll(/key: '([a-zA-Z0-9_]+)'/g)) {
              if (!declared.has(m[1])) missing.push(m[1]);
            }
          }
          if (missing.length) {
            console.error('کلیدِ هسته‌ایِ فرمِ مراجعه که در BUILTIN_VISIT_KEYS نیست: ' + [...new Set(missing)].join('، '));
            process.exit(1);
          }

          /* ② نوعِ فیلد باید در **هر دو** طرف شناخته شود. نوعی که فقط سرور
             بشناسد، فیلدی می‌سازد که کاربر ساخته و هیچ‌جا دیده نمی‌شود؛ نوعی
             که فقط کلاینت بشناسد، فرمی می‌سازد که در مرورگر درست به‌نظر
             می‌رسد و روی سرور رد می‌شود. */
          const serverTypes = new Set(
            (service.match(/FIELD_TYPES = \[([^\]]*)\]/s)?.[1] ?? '')
              .split(',').map((x) => x.trim().replace(/^'|'\$/g, '')).filter(Boolean),
          );
          if (serverTypes.size < 5) { console.error('FIELD_TYPES خوانده نشد'); process.exit(1); }
          for (const t of serverTypes) {
            /* 'text' شاخه‌ی default است و case ندارد. */
            if (t === 'text') continue;
            if (!new RegExp(\"case '\" + t + \"'\").test(dyn)) {
              console.error('نوعِ ' + t + ' در سرور هست ولی DynForm رندرش نمی‌کند'); process.exit(1);
            }
          }

          /* ③ اجباری‌بودن باید **یک** منبع داشته باشد. */
          if (!/required\s+Boolean/.test(read('server/prisma/schema.prisma'))) {
            console.error('ستونِ required روی FormField لازم است'); process.exit(1);
          }
          /* ⚠️ کامنت‌ها قبل از سنجش برداشته می‌شوند. بندِ اول همین‌جا **گاز
             دروغین** داد: کامنتِ خودِ DynForm الگوی ضدِ‌نمونه را توضیح می‌داد
             (\"label.includes('*')\") و نگهبان همان نثر را کدِ واقعی خواند. */
          const code = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*\$/gm, '');
          const dynCode = code(dyn);
          if (!/f\.required/.test(dynCode) || /label[^\n]*includes\(\s*['\\\"]\\*['\\\"]\s*\)/.test(dynCode)) {
            console.error('ستاره باید از required بیاید، نه از متنِ برچسب'); process.exit(1);
          }
          /* ④ اعتبارسنجیِ سرور هم از همان ستون بخواند، نه از فهرستی در کد. */
          if (!/f\.required/.test(code(service)) || !/async validate\(/.test(service)) {
            console.error('اعتبارسنجیِ سرور باید از تعریفِ فرم بخواند'); process.exit(1);
          }
          /* ⑤ کلیدِ رزروشده نباید به‌عنوان فیلدِ دلخواه پذیرفته شود. */
          if (!/BUILTIN_VISIT_KEYS\.has\(key\)/.test(service)) {
            console.error('addField باید کلیدهای رزروشده را رد کند'); process.exit(1);
          }
          console.log('forms ok');
          "

      - name: Verify no undefined identifiers reach the browser
        run: npm run lint

      - name: Verify revenue is recognized only when the work is done
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          /* ⚠️ **پول رسیده ≠ درآمد.** تا دیروز درآمد جمعِ Charge بود، بی‌هیچ
             توجهی به انجامِ عمل: لحظه‌ای که ادمین فرم را تأیید می‌کرد، کلِ مبلغ
             در سود می‌نشست — برای عملی که هفتهٔ بعد بود. و چون تقسیمِ سهم روی
             همان عدد کار می‌کند، سهمِ شرکا و جراح هم روی پولِ نشناخته تقسیم
             می‌شد؛ اگر عمل لغو می‌شد باید از جیبِ شریک پس گرفته می‌شد. */
          const rev = read('server/src/patients/revenue.ts');
          if (!/export function recognize/.test(rev) || !/export const isEarned/.test(rev)) {
            console.error('قرارِ شناسایی باید یک تعریفِ مشترک باشد'); process.exit(1);
          }

          // ① گزارش قاعده را **مصرف** کند، نه بازتعریف.
          const rep = read('server/src/patients/reports.service.ts');
          if (!/from '\.\/revenue'/.test(rep) || !/recognize\(/.test(rep)) {
            console.error('گزارشِ مالی باید از قرارِ مشترک بخواند'); process.exit(1);
          }
          // ⚠️ لنگر روی **نبودِ بازتعریف** هم هست: اگر گزارش خودش opStatus را
          //    با done مقایسه کند، فردا یکی‌شان عوض می‌شود و دیگری نه.
          if (/opStatus === '/.test(rep)) {
            console.error('گزارش نباید خودش وضعیت را تفسیر کند — isEarned'); process.exit(1);
          }
          // ② سود از **شناسایی‌شده** حساب شود، نه از فاکتور و نه از وصولی.
          if (!/profit: revenue - expenseTotal/.test(rep)) {
            console.error('سود باید بر مبنای درآمدِ شناسایی‌شده باشد'); process.exit(1);
          }
          for (const f of ['deferred', 'contracted']) {
            if (!new RegExp(f + ',').test(rep)) {
              console.error('گزارش باید ' + f + ' را جدا بدهد'); process.exit(1);
            }
          }

          /* ③ ⚠️ **تسویه فقط روی عملِ انجام‌شده** — و این گاردِ سرور است، نه
             پیامِ UI: پولِ تقسیم‌شدهٔ عملِ لغوشده باید از جیبِ شریک برگردد. */
          const st = read('server/src/patients/settlement.service.ts');
          const compute = st.slice(st.indexOf('async compute('), st.indexOf('async finalize('));
          /* ⚠️ لنگر روی **شکلِ شرط** است نه صرفِ حضورِ نام: بندِ اول فقط
             \`isEarned(\` را می‌دید و با \`if (false && !isEarned(...))\` سبز
             می‌ماند. همین اشتباه پیش‌تر سه بار تکرار شده بود. */
          if (!/if \(!isEarned\(/.test(compute)) {
            console.error('نوشتنِ تسویه باید به انجامِ عمل مشروط باشد'); process.exit(1);
          }
          if (/if \(false/.test(compute)) {
            console.error('شرطِ تسویه خنثی شده است'); process.exit(1);
          }
          // پیش‌نمایش عمداً باز است — دیدن اشکالی ندارد، نوشتن دارد.
          const preview = st.slice(st.indexOf('async preview('), st.indexOf('async compute('));
          if (/isEarned\(/.test(preview)) {
            console.error('پیش‌نمایش نباید بسته شود — فقط نوشتن مشروط است'); process.exit(1);
          }

          /* ④ هیچ ستونِ ذخیره‌شده‌ای. \`opStatus\` یک‌بار عوض می‌شود و همهٔ
             گزارش‌ها باید همان لحظه درست شوند؛ ستونِ ذخیره‌شده جا می‌ماند. */
          const schema = read('server/prisma/schema.prisma');
          for (const col of ['recognizedRevenue', 'deferredRevenue', 'recognized_revenue']) {
            if (schema.includes(col)) {
              console.error('درآمدِ شناسایی‌شده باید مشتق بماند، نه ستونِ ' + col); process.exit(1);
            }
          }

          // ⑤ کاربر باید هر سه عدد را ببیند، وگرنه فکر می‌کند درآمدش پریده.
          /* ⚠️ لنگر روی **رندرِ خودِ عدد** است نه وجودِ کلمه: نسخهٔ اول دنبالِ
             واژهٔ «پیش‌دریافت» می‌گشت و چون همان واژه در پاراگرافِ راهنما هم
             بود، حذفِ کاشیِ عدد را نمی‌گرفت. */
          const ui = read('src/app/Accounting.jsx');
          for (const field of ['t.deferred', 't.contracted', 't.revenue']) {
            if (!ui.includes(field)) {
              console.error('صفحهٔ حسابداری باید ' + field + ' را نشان دهد'); process.exit(1);
            }
          }
          if (!/درآمدِ شناسایی‌شده/.test(ui) || !/پیش‌دریافت/.test(ui)) {
            console.error('اعداد باید برچسبِ روشن داشته باشند'); process.exit(1);
          }
          console.log('revenue ok');
          "

      - name: Verify money reaches the ledger and portals follow permissions
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          // ① مراجعهٔ تازه باید بتواند مبلغ بگیرد و آن مبلغ **قلمِ فاکتور**
          //    بشود، نه ستونی روی مراجعه: جمعِ فاکتور از قلم‌ها مشتق می‌شود و
          //    ستونِ موازی یعنی دو منبعِ حقیقت برای «مبلغِ این عمل».
          const pvc = read('server/src/patients/patients.service.ts');
          const from = pvc.indexOf('async createVisit(');
          const create = pvc.slice(from, pvc.indexOf('async setTimes(', from));
          if (!/tx\\.charge\\.create\\(/.test(create) || !/dto\\.amount/.test(create)) {
            console.error('ثبتِ مراجعه باید از مبلغ قلمِ خدمت بسازد'); process.exit(1);
          }
          if (/visit.*amount.*Int/.test(read('server/prisma/schema.prisma').slice(
                read('server/prisma/schema.prisma').indexOf('model Visit'),
                read('server/prisma/schema.prisma').indexOf('model Charge')))) {
            console.error('مبلغ نباید ستونی روی Visit شود'); process.exit(1);
          }

          // ② ⚠️ مراجعهٔ تأییدشده نباید بدهکار بماند: تأیید یعنی ادمین فیش را
          //    دیده. پرداخت ثبت می‌شود ولی **حسابِ مقصد را ادمین می‌گوید**.
          const isvc = read('server/src/patients/intake.service.ts');
          if (!/this\\.billing\\.addPayment\\(/.test(isvc)) {
            console.error('تأیید باید پرداخت را هم ثبت کند وگرنه مراجعه بدهکار می‌ماند'); process.exit(1);
          }
          if (!/dto\\.registerPayment !== false/.test(isvc)) {
            console.error('ثبتِ پرداخت باید پیش‌فرض روشن و قابلِ خاموش‌کردن باشد'); process.exit(1);
          }
          if (!/bankAccountId: dto\\.bankAccountId/.test(isvc)) {
            console.error('حسابِ مقصد باید از ادمین بیاید، نه حدس زده شود'); process.exit(1);
          }

          // ③ اعتبارسنجیِ کدِ ملی در **درِ عمومی** نباید سست‌تر از مسیرِ ادمین
          //    باشد؛ وگرنه پرونده‌ای ساخته می‌شود که ادمین هرگز نمی‌توانست.
          if (!/isValidNationalId\\(nationalId\\)/.test(isvc)) {
            console.error('فرمِ عمومی باید همان اعتبارسنجیِ کدِ ملی را داشته باشد'); process.exit(1);
          }

          // ④ ⚠️ «چه چیزی را می‌بینم» **یک** منبع دارد و آن سرور است. تا دیروز
          //    لانچر خودش level >= minLevel حساب می‌کرد و صلاحیتِ نقش را
          //    نمی‌دانست: رانندهٔ سطح ۲ کاشیِ پنلِ کارشناسی را می‌دید.
          const fsvc = read('server/src/features/features.service.ts');
          if (!/async forUser\\(/.test(fsvc) || !/allowed:/.test(fsvc)) {
            console.error('سرور باید allowed را به‌ازای کاربر بدهد'); process.exit(1);
          }
          /**
           * ⚠️ کامنت‌ها پیش از سنجش حذف می‌شوند.
           *
           * نسخهٔ اولِ این بند **توضیحِ خودِ کد** را خطا گرفت: جمله‌ای که
           * می‌گفت «تا دیروز این‌جا سطح حساب می‌شد» عیناً همان الگو را
           * داشت. نگهبانی که درسِ ثبت‌شده را پاک کند بدتر از نداشتنش
           * است — همان اشتباه یک‌بار سرِ «ریال» هم رخ داد.
           */
          const code = (src) => src.replace(/\\/\\*[\\s\\S]*?\\*\\//g, '').replace(/\\/\\/[^\\n]*/g, '');
