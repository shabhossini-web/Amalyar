name: security-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/security-permissions-hardening]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend install
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Backend install
        working-directory: server
        run: npm ci
      - name: Validate tenant schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/tenant_ci
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Validate control schema
        working-directory: server
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control_ci
        run: npx prisma validate --schema prisma/control/schema.prisma
      - name: Backend build
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/tenant_ci
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control_ci
          TENANT_DATABASE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
        run: npm run build
      - name: Verify stripped API prefix restoration
        working-directory: server
        run: node -e "const { restoreApiPrefix } = require('./dist/common/api-prefix'); const cases = [['/auth/setup-status','/api/auth/setup-status'],['/auth/setup-status?x=1','/api/auth/setup-status?x=1'],['/api/auth/setup-status','/api/auth/setup-status'],['/api?x=1','/api?x=1'],['/','/api/']]; for (const [input, expected] of cases) { const actual = restoreApiPrefix(input); if (actual !== expected) { console.error({ input, expected, actual }); process.exit(1); } }"

      - name: Verify SMS production fallback fails closed
        working-directory: server
        run: node -e "const { SmsService } = require('./dist/sms/sms.service'); process.env.NODE_ENV='production'; delete process.env.MELI_API_KEY; delete process.env.MELI_FROM; new SmsService().sendOtp('09120000000','000000').then(() => process.exit(1)).catch((e) => { if (e?.getStatus?.() !== 503) { console.error('expected HTTP 503'); process.exit(1); } });"
      - name: Verify startup does not require tenant context
        working-directory: server
        run: node -e "require('reflect-metadata'); const { PrismaService } = require('./dist/prisma/prisma.service'); const p = new PrismaService({ require() { throw new Error('tenant context accessed during startup'); } }); if (p.then !== undefined) process.exit(1); Promise.resolve(p.onModuleDestroy()).catch(() => process.exit(1));"
      - name: Verify tenant isolation boundaries
        working-directory: server
        run: node scripts/verify-tenant-isolation.js
      - name: Verify the platform panel hides no tenant domain
        working-directory: server
        run: node scripts/verify-platform-domains.js
      - name: Verify Platform Admin configuration fails closed
        working-directory: server
        run: node -e "const { platformAdminConfig, normalizePlatformPhone, normalizeWebOtpHost, platformPhoneRef, resolvePlatformPhoneRef } = require('./dist/platform/platform.config'); process.env.NODE_ENV='production'; process.env.PLATFORM_ADMIN_ENABLED='false'; delete process.env.PLATFORM_ADMIN_SECRET; delete process.env.PLATFORM_ADMIN_PHONES; delete process.env.PLATFORM_ADMIN_WEBOTP_HOST; if (platformAdminConfig().enabled) process.exit(1); process.env.PLATFORM_ADMIN_ENABLED='true'; let failed=false; try { platformAdminConfig(); } catch { failed=true; } if (!failed) { console.error('expected missing Platform Admin secrets to fail'); process.exit(1); } process.env.PLATFORM_ADMIN_SECRET='ci-only-platform-secret-with-32-characters'; process.env.PLATFORM_ADMIN_PHONES='09000000000'; process.env.PLATFORM_ADMIN_WEBOTP_HOST='admin-staging.amalyar.com'; const cfg=platformAdminConfig(); const ref=platformPhoneRef(cfg.secret,'09000000000'); if (!cfg.enabled || !cfg.phones.has('09000000000') || cfg.webOtpHost !== 'admin-staging.amalyar.com' || normalizeWebOtpHost('ADMIN-STAGING.AMALYAR.COM.') !== 'admin-staging.amalyar.com' || normalizePlatformPhone('+989000000000') !== '09000000000' || ref.includes('09000000000') || resolvePlatformPhoneRef(cfg,ref) !== '09000000000' || resolvePlatformPhoneRef(cfg,'invalid') !== null) process.exit(1);"

      - name: Verify Platform Admin SMS uses origin-bound WebOTP
        working-directory: server
        run: |
          node -e "const { SmsService } = require('./dist/sms/sms.service'); process.env.NODE_ENV='test'; process.env.MELI_API_KEY='ci-key'; process.env.MELI_FROM='ci-line'; let payload; global.fetch=async (_url,init) => { payload=JSON.parse(init.body); return { ok:true, json:async()=>({recIds:[1]}) }; }; new SmsService().sendOtp('09000000000','123456','admin-staging.amalyar.com').then((result) => { if (!result.sent || !payload?.text?.endsWith('@admin-staging.amalyar.com #123456')) process.exit(1); }).catch(() => process.exit(1));"
      - name: Verify generated control client
        working-directory: server
        run: test -f src/generated/control/index.js

      # «هر کد ملی، یک بیمار، یک پرونده» قاعده‌ای داده‌ای است، نه تصمیمی در UI:
      # اگر ایندکسِ یکتا یا آزمونِ رقمِ کنترلی برگردد، پرونده‌های تکراری بی‌سروصدا
      # ساخته می‌شوند و ادغامشان بعداً دستی و پرخطاست.
      - name: Verify patient identity rule (unique national ID + checksum)
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          if (!/nationalId\s+String\?\s+@unique/.test(schema)) { console.error('Patient.nationalId باید @unique بماند'); process.exit(1); }
          const mig = fs.readFileSync('prisma/migrations/20260728090000_patient_national_id_unique/migration.sql', 'utf8');
          if (!mig.includes('patients_national_id_key') || !mig.includes('RAISE EXCEPTION')) { console.error('مهاجرتِ یکتاییِ کد ملی دست‌کاری شده'); process.exit(1); }
          const { isValidNationalId, toEnDigits } = require('./dist/common/identity');
          const cases = [['0084575646', true], ['۰۰۸۴۵۷۵۶۴۶', true], ['1234567890', false], ['0000000000', false], ['12345', false]];
          for (const [value, expected] of cases) {
            if (isValidNationalId(value) !== expected) { console.error({ value, expected }); process.exit(1); }
          }
          if (toEnDigits('۰۹۱۲۱۲۳۴۵۶۷') !== '09121234567') process.exit(1);
          "

      # پروندهٔ بیمار دو مرزِ حساس دارد که هیچ‌کدام را تایپ‌چک نمی‌گیرد:
      # جداییِ فیلدهای بالینی از هویتی، و ساخته‌شدنِ مسیرِ فایل از tenantId.
      - name: Verify patient record boundaries
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('src/patients/record.service.ts', 'utf8');
          // فیلدهای حساس نباید به نمای عمومی سُر بخورند.
          const pub = svc.split('const PUBLIC_FIELDS')[1].split('} as const')[0];
          for (const leaked of ['allergies', 'insurer', 'chronicConditions', 'medications', 'emergencyPhone']) {
            if (pub.includes(leaked)) { console.error('فیلدِ بالینی در PUBLIC_FIELDS: ' + leaked); process.exit(1); }
          }
          const store = fs.readFileSync('src/storage/storage.service.ts', 'utf8');
          if (!store.includes('tenantContext.require()')) { console.error('مسیرِ ذخیره‌سازی باید از TenantContext بیاید'); process.exit(1); }
          if (!/\\\$\\{tenantId\\}|tenantId/.test(store) || !store.includes('createHash')) { console.error('نامِ فایل باید hash محتوا باشد'); process.exit(1); }
          // شرحِ بالینی باید تغییرناپذیر بماند: هیچ update ای روی body.
          if (/clinicalNote\.update\([^)]*body/s.test(svc)) { console.error('شرحِ بالینی نباید UPDATE شود؛ نسخهٔ تازه بسازید'); process.exit(1); }
          console.log('patient record boundaries ok');
          "

      # نوعِ ملاقات باید فهرستِ بسته بماند. اگر روزی متنِ آزاد شود، همان مشکلِ
      # opType برمی‌گردد: «ویزیت» و «ویزیت مطب» و «clinic» سه چیزِ متفاوت می‌شوند
      # و گزارش‌گیری بی‌معنی می‌گردد.
      - name: Verify visit kind is open but never unvalidated
        working-directory: server
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const dto     = fs.readFileSync('src/patients/dto/visit.dto.ts', 'utf8');
          const forms   = fs.readFileSync('src/patients/forms.service.ts', 'utf8');
          const patients= fs.readFileSync('src/patients/patients.service.ts', 'utf8');
          const record  = fs.readFileSync('src/patients/record.service.ts', 'utf8');
          const schema  = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const ui      = fs.readFileSync('../src/app/Dashboard.jsx', 'utf8');

          /* ⚠️ این نگهبان **جای نگهبانِ قبلی** نشسته که فهرستِ نوع‌ها را بسته
             نگه می‌داشت. آن قاعده عمداً کنار گذاشته شد: مسیرِ درمان جایگشتِ
             زیادی دارد (ویزیت→درمان→پیگیری، ویزیت→جراحی→ادامه→پیگیری، مطبِ
             داخلی بدونِ جراحی) و فهرستِ بسته دستِ‌کم یکی را غلط می‌کرد.
             ولی «باز» یعنی «تعریف‌شدنی»، نه «هرچه بادا باد» — و این‌جا همان
             مرز نگه داشته می‌شود. */

          // ① فهرستِ بسته نباید برگردد.
          if (/@IsIn\(VISIT_KINDS/.test(dto)) {
            console.error('kind نباید با فهرستِ ثابت بسته شود — نوع‌ها را کاربر می‌سازد'); process.exit(1);
          }
          // ② ولی بی‌اعتبارسنجی هم نباید بماند: نوعِ بی‌فرم یعنی مراجعه‌ای که
          //    هیچ فرمی ندارد و در هر فهرستی بی‌نام است.
          if (!/assertKind\(/.test(patients) || !/isValidKind\(/.test(forms)) {
            console.error('kind باید در برابرِ تعریفِ فرم‌ها سنجیده شود'); process.exit(1);
          }
          if (!/await this\.assertKind\(/.test(patients)) {
            console.error('assertKind باید در مسیرِ ساختِ مراجعه صدا زده شود'); process.exit(1);
          }
          // ③ نصبِ بدونِ فرم نباید قفل شود — وگرنه شرکتِ تازه اصلاً نمی‌تواند
          //    مراجعه ثبت کند و دادهٔ وارد‌شده از سامانهٔ قبلی رد می‌شود.
          if (!/kinds\.length === 0/.test(forms)) {
            console.error('نصبِ بدونِ فرمِ مراجعه باید همه‌چیز را بپذیرد'); process.exit(1);
          }
          // ④ پیش‌فرضِ ستون همان surgery بماند — دادهٔ موجود رویش حساب کرده.
          if (!/kind\s+String\s+@default\(\"surgery\"\)/.test(schema)) {
            console.error('پیش‌فرضِ kind باید surgery بماند'); process.exit(1);
          }
          // ⑤ برچسبِ پشتیبان برای نوع‌های قدیمی باید بماند، وگرنه مراجعاتِ
          //    قبلی بی‌نام می‌شوند. ولی نوعِ ناشناخته نباید به «عمل» ترجمه شود.
          for (const k of ['surgery', 'clinic', 'followup', 'consult']) {
            /* ⚠️ زیررشته‌ی ساده و نه regex: زنجیره‌ی YAML→bash→node یک لایه
               بک‌اسلش می‌خورد و «\\b» به نویسه‌ی backspace تبدیل می‌شد —
               الگویی که هرگز match نمی‌کند و نگهبان را دروغین قرمز می‌کند. */
            if (!ui.includes(k + ':')) {
              console.error('برچسبِ پشتیبانِ ' + k + ' نیست'); process.exit(1);
            }
          }
          if (/KINDS\[k\] \?\? KINDS\.surgery/.test(ui)) {
            console.error('نوعِ ناشناخته نباید «عمل» خوانده شود — برچسبِ حدسی دروغ می‌گوید'); process.exit(1);
          }
          // ⑥ مسیرِ درمان باید **مشتق** بماند. ستونِ گرهِ والد یعنی کاربری که
          //    گره‌زدن را فراموش کند، مسیرش تکه‌تکه می‌شود.
          for (const col of ['parentVisitId', 'parent_visit_id', 'journeyId']) {
            if (schema.includes(col)) {
              console.error('مسیر باید از توالیِ مراجعات خوانده شود، نه از ستونِ ' + col); process.exit(1);
            }
          }
          /* ⚠️ کلیدِ دقیق سنجیده می‌شود نه زیررشته: «journeyX» هم شاملِ
             «journey» است و نگهبان را بی‌خود سبز می‌کرد. */
          if (!/\bjourney:/.test(record)) {
            console.error('پرونده باید مسیرِ مشتق‌شده را بدهد'); process.exit(1);
          }
          console.log('visit kinds ok');
          "

      - name: Verify billing derives from rows, not cached columns
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const visit = schema.split('model Visit {')[1].split(/\n}/)[0];
          for (const dead of ['amount', 'paid']) {
            if (new RegExp('^\\\\s*' + dead + '\\\\s', 'm').test(visit)) {
              console.error('ستونِ سرجمعِ ' + dead + ' نباید به Visit برگردد'); process.exit(1);
            }
          }
          const { summarize } = require('./dist/patients/billing.service');
          const cases = [
            [[], [], 0, 0, 0],
            [[{amount: 12000000}, {amount: 14000000}, {amount: -2000000}], [{amount: 15000000}], 24000000, 15000000, 9000000],
            [[{amount: 100}], [{amount: 300}], 100, 300, -200],
          ];
          for (const [c, p, total, paid, due] of cases) {
            const r = summarize(c, p);
            if (r.total !== total || r.paid !== paid || r.due !== due) { console.error({ r, total, paid, due }); process.exit(1); }
          }
          console.log('billing summarize ok');
          "

      # حوزهٔ کاری «همان یک تغییرِ کوچک» است: اگر کلیدهای سرور و دیکشنریِ واژگانِ
      # فرانت از هم جدا بیفتند، نصبِ یک مشتری با واژه‌های نصفه بالا می‌آید.
      - name: Verify vertical presets match UI terminology
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const { VERTICALS, DEFAULT_VERTICAL, featurePlanFor } = require('./dist/config/verticals');
          const keys = Object.keys(VERTICALS);
          if (!keys.includes(DEFAULT_VERTICAL)) { console.error('حوزهٔ پیش‌فرض در فهرست نیست'); process.exit(1); }
          const terms = fs.readFileSync('../src/lib/terms.js', 'utf8');
          for (const k of keys) {
            if (!new RegExp('(^|\\\\s)' + k + '\\\\s*:').test(terms)) {
              console.error('واژگانِ فرانت برای حوزهٔ ' + k + ' تعریف نشده'); process.exit(1);
            }
          }
          // هر حوزه باید داشبورد و کاربران را داشته باشد، وگرنه نصب بی‌استفاده است.
          for (const k of keys) {
            const plan = featurePlanFor(k);
            for (const must of ['dashboard', 'users']) {
              if (!plan[must]) { console.error('حوزهٔ ' + k + ' ماژولِ ' + must + ' را ندارد'); process.exit(1); }
            }
          }
          console.log('verticals ok:', keys.join(', '));
          "

      # کتابِ ارزش نسبی مرجعِ صورت‌حساب و بیمه است: ثابتِ «کل = حرفه‌ای + فنی»
      # باید برقرار بماند و ارزش‌ها عددِ صحیحِ هزارم‌واحد، وگرنه جمعِ فاکتور
      # خطای شناور می‌گیرد و با صورت‌حسابِ بیمه نمی‌خواند.
      - name: Verify service-code catalog integrity
        working-directory: server
        run: |
          node -e "
          const seed = require('./prisma/seed-data/service-codes.json');
          const i = Object.fromEntries(seed.fields.map((f, n) => [f, n]));
          if (!seed.rows.length) { console.error('کتابِ خالی'); process.exit(1); }
          const codes = new Set();
          for (const r of seed.rows) {
            const code = r[i.code];
            if (!/^[0-9]{6}\$/.test(code)) { console.error('کدِ نامعتبر: ' + code); process.exit(1); }
            if (codes.has(code)) { console.error('کدِ تکراری: ' + code); process.exit(1); }
            codes.add(code);
            if (!r[i.title]) { console.error('کدِ بدونِ شرح: ' + code); process.exit(1); }
            for (const f of ['rvuTotal', 'rvuProfessional', 'rvuTechnical', 'rvuAnesthesia']) {
              const v = r[i[f]];
              if (v !== null && !Number.isInteger(v)) { console.error(code + ': ' + f + ' صحیح نیست'); process.exit(1); }
            }
            const [t, pro, tech] = [r[i.rvuTotal], r[i.rvuProfessional], r[i.rvuTechnical]];
            if ([t, pro, tech].every((v) => v !== null) && t !== pro + tech) {
              console.error(code + ': کل ≠ حرفه‌ای + فنی'); process.exit(1);
            }
          }
          // محاسبهٔ فی: هر جزء جدا ضرب و گرد می‌شود، نه ارزشِ کل در یک ضریب.
          const part = (rvu, factor) => (rvu ? Math.round((rvu * factor) / 1000) : 0);
          if (part(15000, 320000) + part(7300, 160000) !== 5968000) { console.error('فرمولِ فی غلط است'); process.exit(1); }
          console.log('service codes ok:', seed.rows.length, 'نسخهٔ', seed.version);
          "

      # دو مرزی که تایپ‌چک نمی‌گیرد: کاتالوگ باید خودش seed شود (وگرنه شرکتِ تازه
      # جستجوی بی‌نتیجه می‌بیند بدونِ هیچ نشانه‌ای)، و Item باید کاتالوگ بماند
      # نه انبار — ستونِ موجودی اینجا یعنی یک ردیف همزمان تعریف و موجودی است.
      - name: Verify catalog self-seeds and Item stays catalog-only
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('src/patients/service-codes.service.ts', 'utf8');
          for (const entry of ['async search', 'async priceOf', 'async count']) {
            const body = svc.split(entry)[1]?.split('\n  }')[0] ?? '';
            if (!body.includes('ensureImported')) { console.error(entry + ' باید کاتالوگ را seed کند'); process.exit(1); }
          }
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          // خطوطِ رابطه کنار گذاشته می‌شوند: \«lots StockLot[]\» مجاز است، ستونِ اسکالر نه.
          const item = schema.split('model Item {')[1].split(/\n}/)[0]
            .split('\n').filter((l) => !/\[\]|StockLot|Charge/.test(l)).join('\n');
          for (const stock of ['quantity', 'stock', 'onHand', 'lot', 'serial', 'expiry']) {
            if (new RegExp('^\\\\s*' + stock + '\\\\s', 'mi').test(item)) {
              console.error('Item کاتالوگ است نه انبار؛ ' + stock + ' جدولِ خودش را می‌خواهد'); process.exit(1);
            }
          }
          console.log('catalog boundaries ok');
          "

      - name: Verify stock balance is derived from an append-only ledger
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const lot = schema.split('model StockLot {')[1].split(/\n}/)[0];
          // موجودیِ ذخیره‌شده کنارِ دفتر، دیر یا زود از دفتر جدا می‌افتد.
          for (const cached of ['quantity', 'balance', 'onHand', 'count']) {
            if (new RegExp('^\\\\s*' + cached + '\\\\s', 'mi').test(lot)) {
              console.error('موجودی باید از دفتر مشتق شود؛ StockLot.' + cached + ' ممنوع است'); process.exit(1);
            }
          }
          const svc = fs.readFileSync('src/patients/inventory.service.ts', 'utf8');
          /* ⚠️ لنگر روی **جای تعریف** نیست، روی «یک تعریف». فرمول بعداً به
             \`stock-math.ts\` رفت تا انبار و دارایی بدونِ حلقهٔ وابستگی از یک
             جا بخوانند — چیدمانِ سفت‌تری بود، ولی نگهبانی که به فایلِ قبلی
             چسبیده بود قرمز شد و CI را بابتِ یک بهبود قفل کرد. */
          const math = fs.readFileSync('src/patients/stock-math.ts', 'utf8');
          if (!/export function balanceOf/.test(math)) { console.error('balanceOf باید یک فرمولِ مشترک باشد'); process.exit(1); }
          // و هیچ‌کس دوباره تعریفش نکند — بازتعریف یعنی دو حقیقت از «موجودی».
          const dupes = execSync(\"grep -rln 'function balanceOf' src || true\", { encoding: 'utf8' })
            .split('\\n').filter((f) => f && f !== 'src/patients/stock-math.ts');
          if (dupes.length) { console.error('balanceOf دوباره تعریف شده در: ' + dupes.join('، ')); process.exit(1); }
          // دفتر فقط اضافه می‌شود؛ اصلاح با حرکتِ جبرانی است نه با حذف/ویرایش.
          if (/stockMovement\\.(delete|deleteMany|update|updateMany)/.test(svc)) {
            console.error('دفترِ انبار فقط append است — حذف/ویرایشِ حرکت ممنوع'); process.exit(1);
          }
          const move = svc.split('private async move')[1].split(/\n  }/)[0];
          /* ⚠️ لنگر روی **قاعده** است نه املای متغیر: بندِ «موجودی منفی نشود»
             زمانی \`next < 0\` نوشته شده بود و بعد به \`total < 0\` تغییر نام داد.
             نگهبانی که به اسمِ متغیر بچسبد، با هر بازآراییِ بی‌ضرر قرمز
             می‌شود و اعتبارِ خودش را خرج می‌کند. */
          for (const rule of ['FOR UPDATE', 'expires_at', 'serial_no']) {
            if (!move.includes(rule)) { console.error('قاعدهٔ انبار در move غایب است: ' + rule); process.exit(1); }
          }
          if (!/\w+ < 0\) (throw|\{)/.test(move)) {
            console.error('move باید جلوی منفی‌شدنِ موجودی را بگیرد'); process.exit(1);
          }
          const bill = fs.readFileSync('src/patients/billing.service.ts', 'utf8');
          // برگشت باید با حرکتِ جبرانی باشد، نه با حذفِ حرکتِ مصرف.
          if (!/returnToStock/.test(bill)) { console.error('برگشتِ کالا باید با حرکتِ جبرانی باشد'); process.exit(1); }
          console.log('stock ledger ok');
          "

      - name: Verify share split is one formula and the ledger is append-only
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('src/patients/settlement.service.ts', 'utf8');
          if (!/export function computeShares/.test(svc)) {
            console.error('تقسیمِ سهم باید یک فرمولِ خالصِ مشترک باشد'); process.exit(1);
          }
          // ثابتِ نگهبان: جمعِ ردیف‌ها همیشه برابرِ درآمد. با هزینهٔ منفی می‌شکست.
          if (!/checksum/.test(svc)) { console.error('checksum لازم است'); process.exit(1); }
          const compute = svc.split('export function computeShares')[1].split(/\n}/)[0];
          if (/amount: -input.cost/.test(compute)) {
            console.error('قلمِ هزینه نباید منفی باشد — checksum را برابرِ revenue-2×cost می‌کند'); process.exit(1);
          }
          if (!/remainder - given/.test(compute)) {
            console.error('باقی‌ماندهٔ گِردکردن باید به آخرین شریک برسد وگرنه ریال گم می‌شود'); process.exit(1);
          }
          // تسویه نسخه‌دار است: محاسبهٔ دوباره نسخهٔ تازه می‌سازد، نه ویرایش.
          if (/settlement\.update\(\{ where: \{ id: [a-z.]+ \}, data: \{ (revenue|entries)/.test(svc)) {
            console.error('تسویه نباید در جای خودش بازنویسی شود'); process.exit(1);
          }
          if (/shareEntry\.(update|delete)/.test(svc)) { console.error('دفترِ سهم فقط‌افزودنی است'); process.exit(1); }
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const entry = schema.split('model ShareEntry {')[1].split(/\n}/)[0];
          // نام و مبنا عکس‌اند نه رابطه: حذفِ جراح نباید سابقهٔ مالی را ببرد.
          for (const f of ['partyName', 'basis']) {
            if (!new RegExp(f).test(entry)) { console.error('ShareEntry.' + f + ' لازم است'); process.exit(1); }
          }
          if (/partyId\s+Int\?\s+@relation/.test(entry)) {
            console.error('partyId نباید رابطهٔ FK باشد — حذفِ طرف سابقهٔ مالی را پاک می‌کند'); process.exit(1);
          }
          // قرارداد تاریخ‌دار است و «آخرین» نیست، «معتبر در آن تاریخ» است.
          if (!/effectiveFrom: \{ lte: when \}/.test(svc)) {
            console.error('قرارداد باید بر اساسِ تاریخِ عمل انتخاب شود نه آخرین ردیف'); process.exit(1);
          }
          if (!/!== 100/.test(svc)) { console.error('جمعِ درصدِ شرکا باید کنترل شود'); process.exit(1); }
          const stats = fs.readFileSync('src/patients/patients.service.ts', 'utf8');
          if (!/byPayer/.test(stats)) { console.error('ماندهٔ per-counterparty لازم است'); process.exit(1); }

          // دفترِ حسابِ جاریِ شرکا — «چه کسی به چه کسی بدهکار است».
          const led = fs.readFileSync('src/patients/ledger.service.ts', 'utf8');
          if (!/export function pairDebts/.test(led)) {
            console.error('تبدیلِ اختلاف به بدهی باید یک تابعِ خالصِ مشترک باشد'); process.exit(1);
          }
          if (/partnerLedger\.delete/.test(led)) { console.error('دفترِ شرکا فقط‌افزودنی است — حذف ممنوع'); process.exit(1); }
          // ابطال با voidedAt، نه پاک‌کردن — همان الگوی supersededAt.
          if (!/voidedAt: new Date\(\)/.test(led)) { console.error('ابطال باید با voidedAt باشد'); process.exit(1); }
          // بدهی فقط با نهایی‌شدنِ تسویه ساخته می‌شود، نه با هر محاسبهٔ پیش‌نویس.
          const st = fs.readFileSync('src/patients/settlement.service.ts', 'utf8');
          const fin = st.split('async finalize')[1].split(/\n  \/\/\/|\n  async /)[0];
          if (!/ledgerForSettlement/.test(fin)) {
            console.error('بدهیِ بینِ شرکا باید هنگام نهایی‌شدن ساخته شود'); process.exit(1);
          }
          const reo = st.split('async reopen')[1].split(/\n  async /)[0];
          if (!/voidForSettlement/.test(reo)) { console.error('باطل‌کردنِ تسویه باید ردیف‌های دفتر را باطل کند'); process.exit(1); }
          // نقدی که به حسابِ مشترک رفته نباید بدهیِ بینِ شرکا بسازد.
          if (!/if \(!personal\) return \[\];/.test(led)) {
            console.error('نقدِ حسابِ مشترک نباید بدهیِ بینِ شرکا بسازد'); process.exit(1);
          }
          // ایمپورت: سه جدولِ حسابداری دیگر رد نمی‌شوند و تکرارناپذیرند.
          const imp = fs.readFileSync('src/import/import.service.ts', 'utf8');
          for (const t of ['bank_accounts', 'expenses', 'partner_ledger']) {
            if (!new RegExp(\"'\" + t + \"'\").test(imp.split('const IMPORTED')[1].split(';')[0])) {
              console.error('ایمپورت باید ' + t + ' را وارد کند'); process.exit(1);
            }
          }
          if (!/malekteb:expenses:/.test(imp)) { console.error('ایمپورتِ هزینه باید ارجاعِ منبع بگذارد وگرنه تکرار می‌شود'); process.exit(1); }
          console.log('share split ok');
          "

      - name: Verify the Jalali month grid is shared and boundary-correct
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const cal = fs.readFileSync('src/patients/calendar.service.ts', 'utf8');
          // بازهٔ ماه باید شمسی بریده شود، وگرنه چند روزِ ابتدا/انتها می‌افتند.
          if (!/jalaliMonthRange/.test(cal)) { console.error('بازهٔ تقویم باید شمسی باشد'); process.exit(1); }
          // گروه‌بندی سمتِ سرور بماند تا تقویم و چینش یک تعریف داشته باشند.
          if (!/toJalali/.test(cal)) { console.error('گروه‌بندیِ روز باید سمتِ سرور و شمسی باشد'); process.exit(1); }
          if (!/LEVEL.SUPERVISOR/.test(cal)) { console.error('تقویم باید scope کارشناس را رعایت کند'); process.exit(1); }
          const jal = fs.readFileSync('src/common/jalali.ts', 'utf8');
          const rng = jal.split('export function jalaliMonthRange')[1].split(/\n}/)[0];
          // طولِ ماه دوباره محاسبه نشود؛ «اولِ ماهِ بعد» کبیسه را خودش هندل می‌کند.
          if (/jMonthDays|29|30|31/.test(rng)) {
            console.error('بازهٔ ماه نباید طولِ ماه را دوباره حساب کند — تقویمِ دوم می‌سازد'); process.exit(1);
          }
          const grid = fs.readFileSync('../src/app/JGrid.jsx', 'utf8');
          // هفته شنبه‌محور است؛ getDay() یکشنبه‌محور ستون‌ها را می‌چرخاند.
          // ادعای مثبت، تا متنِ توضیحات گارد را نلغزاند (یک‌بار همین‌جا افتاد).
          if (!/const lead = jDayOfWeek\(/.test(grid)) {
            console.error('شمارِ ابتدای ماه باید از jDayOfWeek بیاید نه Date.getDay'); process.exit(1);
          }
          // گرید باید بی‌طرف بماند تا چینش (فازِ ۳) همان را دوباره استفاده کند.
          for (const leaked of ['/calendar', 'visits', 'opStatus']) {
            if (grid.includes(leaked)) { console.error('JGrid نباید از محتوای تقویم بداند: ' + leaked); process.exit(1); }
          }
          console.log('calendar grid ok');
          "

      - name: Verify financial reports reuse existing definitions
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const rep = fs.readFileSync('src/patients/reports.service.ts', 'utf8');
          // گزارش نباید تعریفِ خودش را از درآمد/وصولی بسازد.
          // نکته: این متن داخلِ node -e است و bash اول آن را می‌خوانَد، پس
          // دلار باید سه‌بار بک‌اسلش بگیرد. با دوتا، bash نامِ متغیر را بسط
          // می‌داد (خالی) و JS یک regexِ بی‌پایان می‌دید: SyntaxError. کلِ این
          // گام از همان روز می‌ترکید و هیچ‌کدام از نگهبان‌های بعدی‌اش اجرا
          // نمی‌شد؛ چون از آن به بعد CIای اجرا نشده بود، کسی ندید. الگوی
          // درست همان است که خطوطِ ۱۰۸ و ۷۶۴ دارند.
          if (/prisma\.\\\$queryRaw/.test(rep)) { console.error('گزارش نباید SQLِ خام بزند؛ تعریفِ موازی می‌سازد'); process.exit(1); }
          // درآمد و وصولی باید جدا بمانند.
          for (const k of ['revenue', 'collected', 'profit']) {
            if (!new RegExp(k).test(rep)) { console.error('گزارش باید ' + k + ' را جدا بدهد'); process.exit(1); }
          }
          if (!/revenue - expenseTotal/.test(rep)) {
            console.error('سود باید بر مبنای درآمدِ شناسایی‌شده باشد نه وصولی'); process.exit(1);
          }
          // ماهِ نمودار باید شمسی باشد وگرنه با تقویمِ کاربر نمی‌خواند.
          if (!/toJalali/.test(rep)) { console.error('گروه‌بندیِ ماه باید شمسی باشد'); process.exit(1); }
          const jal = fs.readFileSync('src/common/jalali.ts', 'utf8');
          if (!/getUTCFullYear/.test(jal)) {
            console.error('تبدیلِ میلادی→شمسی باید UTC بخواند، وگرنه سرور یک روز جابه‌جا می‌شود'); process.exit(1);
          }
          // سورتِ مالی نباید به ستونِ ذخیره‌شده تبدیل شود.
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const visit = schema.split('model Visit {')[1].split(/\n}/)[0];
          for (const cached of ['due', 'total', 'paid']) {
            if (new RegExp('^\\s*' + cached + '\\s+Int', 'mi').test(visit)) {
              console.error('Visit.' + cached + ' ممنوع است — مشتق بماند (قانونِ computeVisit)'); process.exit(1);
            }
          }
          const svc = fs.readFileSync('src/patients/patients.service.ts', 'utf8');
          if (!/moneyOrderedIds/.test(svc)) { console.error('سورتِ مالی باید از aggregate بیاید'); process.exit(1); }
          // خروجی باید همان مسیرِ مالی را برود وگرنه CSV با فهرست نمی‌خواند.
          const exp = svc.split('async exportVisits')[1].split(/\n  \/\*\*/)[0];
          if (!/moneyOrderedIds/.test(exp)) {
            console.error('خروجی باید فیلتر و سورتِ مالی را هم بفهمد'); process.exit(1);
          }
          console.log('financial reports ok');
          "

      - name: Verify lot location is a ledger, not a column
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const mv = schema.split('model StockMovement {')[1].split(/\n}/)[0];
          if (!/location/.test(mv)) { console.error('StockMovement.location لازم است'); process.exit(1); }
          if (!/model StockTransfer/.test(schema)) { console.error('سندِ حواله لازم است'); process.exit(1); }
          const svc = fs.readFileSync('src/patients/inventory.service.ts', 'utf8');
          // محلِ فعلی مثلِ موجودی مشتق است، نه ستونِ ذخیره‌شده.
          // ⚠️ همان درسِ balanceOf: لنگر روی «یک تعریف» است، نه روی فایلی که
          //    آن روز تعریف در آن بود.
          if (!/export function balanceByLocation/.test(fs.readFileSync('src/patients/stock-math.ts', 'utf8'))) {
            console.error('موجودیِ هر محل باید از یک فرمولِ مشترک بیاید'); process.exit(1);
          }
          const tr = schema.split('model StockTransfer {')[1].split(/\n}/)[0];
          for (const cached of ['quantity', 'sentQty', 'remaining']) {
            if (new RegExp('^\\\\s*' + cached + '\\\\s', 'mi').test(tr)) {
              console.error('تعدادِ حواله باید از دفتر بیاید؛ StockTransfer.' + cached + ' ممنوع است'); process.exit(1);
            }
          }
          // کنترلِ per-location وگرنه می‌شود از انبار «سرِ عملِ بیمارستان» مصرف زد.
          const move = svc.split('private async move')[1].split(/\n  }/)[0];
          if (!/here < 0/.test(move)) { console.error('move باید موجودیِ همان محل را کنترل کند'); process.exit(1); }
          // ⚠️ «مصرف» نباید از تفریقِ ارسال و مانده بیاید: پس از برگشتِ مانده،
          // آن تفریق کلِ ارسال را مصرف می‌شمارد.
          const detail = svc.split('async transfer(')[1].split(/\n  async /)[0];
          // ⚠️ همان درسِ بالا: شرطِ kind بعداً «{ in: ['out', 'return'] }» شد تا
          //    برگشت هم دیده شود. آنچه باید بماند **گره‌خوردن به همان حواله**
          //    است، نه شکلِ نوشتنِ kind.
          if (!/transferId: t\.id/.test(detail)) {
            console.error('مصرفِ حواله باید از حرکت‌های گره‌خورده به همان حواله بیاید'); process.exit(1);
          }
          // تعدادِ برگشتی از دفتر می‌آید نه از کاربر.
          const back = svc.split('async returnTransfer')[1].split(/\n  async /)[0];
          if (/dto\./.test(back)) { console.error('برگشتِ مانده نباید تعداد از کاربر بگیرد'); process.exit(1); }
          const ui = fs.readFileSync('../src/app/Inventory.jsx', 'utf8');
          if (!/lot.available/.test(ui)) { console.error('UI باید «در دسترس» را از «کل» جدا نشان دهد'); process.exit(1); }

          // برگهٔ مصرف: کارِ کارشناسِ سرِ عمل، با مجوز و ماژولِ سبک‌ترِ خودش.
          /* ⚠️ باز هم همان درس: فهرستِ مجوزها از \`permission.guard.ts\` به
             \`access-registry.ts\` رفت تا هر کلید **برچسبِ فارسی** بگیرد و
             مدیر بتواند ببیند و عوضش کند — تغییری در جهتِ بهتر. نگهبانِ
             چسبیده به فایلِ قدیمی همان بهبود را خطا گرفت. */
          const perms = fs.readFileSync('src/auth/access-registry.ts', 'utf8');
          if (!/key: 'stock\.consume'[\s\S]{0,400}defaultLevel: LEVEL\.TECH/.test(perms)) {
            console.error('ثبتِ مصرف باید مجوزِ جدا در سطحِ کارشناس داشته باشد، نه inventory.write'); process.exit(1);
          }
          const ctrl = fs.readFileSync('src/patients/inventory.controller.ts', 'utf8');
          const usage = ctrl.split('usage(@Param')[0].split('@RequirePermissions').pop();
          if (!/Feature\('tech'\)/.test(ctrl.split(\"@RequirePermissions('stock.consume')\")[0].split('/**').pop())) {
            console.error('برگهٔ مصرف باید زیرِ ماژولِ tech باشد وگرنه کارشناسِ سطح ۲ به آن نمی‌رسد'); process.exit(1);
          }
          // ورودی «جمعِ مصرف‌شده» است نه دلتا — همان قاعدهٔ انبارگردانی.
          const rec = svc.split('async recordUsage')[1].split(/\n  \/\*\*/)[0];
          if (!/const delta = target - already/.test(rec)) {
            console.error('برگهٔ مصرف باید جمع بگیرد و اختلاف را خودش حساب کند'); process.exit(1);
          }
          if (!/kind: \{ in: \['out', 'return'\] \}/.test(rec)) {
            console.error('مصرفِ ثبت‌شده باید خالص باشد (out و return)'); process.exit(1);
          }
          console.log('lot journey ok');
          "

      - name: Verify the invoice line is decoupled from stock consumption
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const charge = schema.split('model Charge {')[1].split(/\n}/)[0];
          // نیتِ قلم باید ثبت شود، وگرنه «مجازیِ عمدی» و «یادم رفت لات بزنم» یک شکل‌اند.
          if (!/stockEffect/.test(charge)) { console.error('Charge.stockEffect لازم است'); process.exit(1); }
          const bill = fs.readFileSync('src/patients/billing.service.ts', 'utf8');
          for (const v of ['consumed', 'virtual', 'hospital']) {
            if (!bill.includes(\"'\" + v + \"'\")) { console.error('اثرِ انبار غایب: ' + v); process.exit(1); }
          }
          const rm = bill.split('async removeCharge')[1].split(/\n  async /)[0];
          // ⚠️ باگی که این گارد جلویش را می‌گیرد: حذفِ قلمِ فاکتور، پیچِ کارگذاشته‌شده
          // را به موجودی برمی‌گرداند. برگشت فقط با پرچمِ صریحِ کاربر مجاز است.
          if (!/if \(returnStock\)/.test(rm)) {
            console.error('حذفِ قلم نباید خودکار کالا را برگرداند — باید پشتِ returnStock باشد'); process.exit(1);
          }
          if (/returnStock\s*=\s*true/.test(bill)) { console.error('returnStock نباید پیش‌فرضِ روشن باشد'); process.exit(1); }
          // مصرفِ بدونِ فاکتور نباید از نما حذف شود: پرس‌وجوی حرکت‌ها باید کلِ
          // مراجعه را بخواند. (ادعای مثبت، تا متنِ توضیحات گارد را نلغزاند.)
          const get = bill.split('async get(')[1].split(/\n  async /)[0];
          const mv = get.split('stockMovement.findMany')[1] || '';
          if (!/where: \{ visitId \}/.test(mv.split('}),')[0])) {
            console.error('نمای صورت‌حساب باید همهٔ حرکت‌های مراجعه را بخواند، نه فقط قلم‌دارها'); process.exit(1);
          }
          if (!/export function reconcile/.test(bill)) { console.error('تطبیقِ فاکتور/مصرف باید یک تابعِ مشترک باشد'); process.exit(1); }
          // تطبیق باید خالص باشد وگرنه قلمِ برگشت‌خورده مغایرتِ جعلی می‌سازد.
          if (!/net < 0/.test(bill.split('export function reconcile')[1])) {
            console.error('تطبیق باید بر مبنای خالص باشد نه شمارشِ خام'); process.exit(1);
          }
          const ui = fs.readFileSync('../src/app/BillingSheet.jsx', 'utf8');
          if (!/returnStock=1/.test(ui)) { console.error('UI باید سؤالِ برگشتِ کالا را بپرسد'); process.exit(1); }
          console.log('billing/stock decoupling ok');
          "

      - name: Verify op duration is derived, never stored
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const visit = schema.split('model Visit {')[1].split(/\n}/)[0];
          for (const cached of ['duration', 'durationMin', 'opMinutes']) {
            if (new RegExp('^\\\\s*' + cached + '\\\\s', 'mi').test(visit)) {
              console.error('مدتِ عمل مشتق است؛ Visit.' + cached + ' ممنوع است'); process.exit(1);
            }
          }
          // ساعت‌ها رشته‌اند نه DateTime — وگرنه عملِ ۲۳:۳۰ با منطقهٔ زمانی به روزِ بعد می‌پرد.
          for (const col of ['opStartTime', 'opEndTime', 'techArriveTime']) {
            const line = visit.split('\n').find((l) => l.trim().startsWith(col));
            if (!line || !/String\\?/.test(line)) { console.error(col + ' باید String? باشد'); process.exit(1); }
          }
          const svc = fs.readFileSync('src/patients/patients.service.ts', 'utf8');
          if (!/export function durationOf/.test(svc)) { console.error('durationOf باید یک فرمولِ مشترک باشد'); process.exit(1); }
          if (!/durationMin: durationOf\\(/.test(svc)) { console.error('enrich باید مدت را از durationOf بگیرد'); process.exit(1); }
          // گذشتن از نیمه‌شب باید صریح هندل شده باشد، نه عددِ منفی.
          const body = svc.split('export function durationOf')[1].split(/\n}/)[0];
          if (!body.includes('24 * 60')) { console.error('عملِ نیمه‌شب‌گذر در durationOf هندل نشده'); process.exit(1); }
          const ui = fs.readFileSync('../src/app/Dashboard.jsx', 'utf8');
          // input[type=time] قالبِ نمایشش را مرورگر تعیین می‌کند (۱۲ساعته در کرومیوم)
          // و بین اندروید/سافاری/ویندوز فرق می‌کند — قانونِ سازگاریِ چندپلتفرمی.
          if (/type=\"time\"/.test(ui)) { console.error('input[type=time] قالبش را مرورگر تعیین می‌کند؛ ورودیِ متنیِ نرمال‌شده لازم است'); process.exit(1); }
          console.log('op duration ok');
          "

      - name: Verify Jalali conversion matches reference dates
        run: |
          # هستهٔ سرور و فرانت باید یکی باشند. یک‌بار سمتِ سرور از روی حافظه
          # بازنویسی شد، جدولِ breaks فرق کرد و همهٔ تاریخ‌های وارد‌شده یک سال
          # عقب افتادند — بدونِ هیچ خطایی. این گارد همان را می‌گیرد.
          server/node_modules/.bin/tsc server/src/common/jalali.ts --outDir /tmp/jal --module commonjs --target es2020
          node -e "
          const fs = require('fs');
          const srv = fs.readFileSync('server/src/common/jalali.ts', 'utf8');
          const web = fs.readFileSync('src/lib/jalali.js', 'utf8');
          const breaksOf = (t) => (t.match(/breaks = \\[[^\\]]+\\]/) || [''])[0].replace(/\\s+/g, '');
          if (!breaksOf(srv) || breaksOf(srv) !== breaksOf(web)) {
            console.error('جدولِ breaks سرور و فرانت یکی نیست'); process.exit(1);
          }
          if (!srv.includes('~~(a / b)')) { console.error('تقسیم باید truncation باشد (~~) نه Math.floor'); process.exit(1); }
          const { jalaliStrToDate } = require('/tmp/jal/jalali.js');
          const cases = { '1403/01/01': '2024-03-20', '1404/12/29': '2026-03-20', '1405/04/10': '2026-07-01', '1405/05/07': '2026-07-29' };
          for (const [j, g] of Object.entries(cases)) {
            const got = jalaliStrToDate(j);
            const iso = got && got.toISOString().slice(0, 10);
            if (iso !== g) { console.error(j + ' → ' + iso + ' ولی باید ' + g + ' باشد'); process.exit(1); }
          }
          if (jalaliStrToDate('چرت') !== null) { console.error('ورودیِ نامعتبر باید null بدهد'); process.exit(1); }

          /* ── تورِ تاریخ ───────────────────────────────────────────────
             ⚠️ **این اشکال خطا نمی‌داد و همان بدترین حالتش بود.** فرمِ عمومیِ
             بیمار مقدارِ تقویمِ شمسی را خام می‌فرستاد؛ سرور
             \`new Date('1405/05/14')\` می‌ساخت و آن را سالِ ۱۴۰۵ **میلادی**
             می‌فهمید. مراجعه با موفقیت ثبت می‌شد و بعد از تقویم و هر گزارشِ
             بازه‌ای غیب بود. */
          const { toDateValue } = require('/tmp/jal/jalali.js');
          if (typeof toDateValue !== 'function') {
            console.error('تبدیلِ تاریخ باید یک تابعِ مشترک باشد'); process.exit(1);
          }
          const y = (v) => (v ? v.toISOString().slice(0, 10) : String(v));
          // شمسی → میلادیِ درست، نه سالِ ۱۴۰۵ میلادی
          if (y(toDateValue('1405/05/14')) !== '2026-08-05') {
            console.error('رشتهٔ شمسی باید درست تبدیل شود، شد: ' + y(toDateValue('1405/05/14'))); process.exit(1);
          }
          if (toDateValue('1405/05/14').getUTCFullYear() < 1700) {
            console.error('سالِ کمتر از ۱۷۰۰ یعنی شمسی به‌جای میلادی خوانده شده'); process.exit(1);
          }
          // ISOِ سالم دست‌نخورده
          if (y(toDateValue('2026-08-05')) !== '2026-08-05') { console.error('ISO نباید دست بخورد'); process.exit(1); }
          // آشغال باید undefinedِ صریح بدهد، نه Invalid Date که بی‌صدا بنشیند
          if (toDateValue('فردا') !== undefined) { console.error('متنِ بی‌معنا باید undefined بدهد'); process.exit(1); }
          if (toDateValue(null) !== null || toDateValue('') !== undefined) {
            console.error('خالی و null باید از هم جدا بمانند'); process.exit(1);
          }

          /* هیچ‌کس دیگر \`new Date()\` را روی تاریخِ ورودی صدا نزند — تکِ‌نقطهٔ
             تبدیل همین است. (یک بار سه ستون از یک قاعده جدا افتادند.) */
          const pvc = fs.readFileSync('server/src/patients/patients.service.ts', 'utf8');
          if (/new Date\(dto\.(opDate|birthDate)/.test(pvc)) {
            console.error('تاریخِ ورودی باید از toDateValue بگذرد، نه new Date'); process.exit(1);
          }

          /* و کلاینت **شمسی خام نفرستد**: تور برای دادهٔ قدیمی است، نه مجوزِ
             تنبلیِ کلاینتِ تازه. هر فرمی که JDate دارد باید jStrToIso بزند. */
          for (const f of ['src/pages/Intake.jsx', 'src/app/Intake.jsx']) {
            const src = fs.readFileSync(f, 'utf8');
            if (!/jStrToIso\(/.test(src)) {
              console.error(f + ' مقدارِ تقویمِ شمسی را بدونِ تبدیل می‌فرستد'); process.exit(1);
            }
            if (!/isoToJStr\(/.test(src)) {
              console.error(f + ' تاریخِ ISOِ سرور را بدونِ تبدیل در تقویم می‌گذارد'); process.exit(1);
            }
          }
          console.log('jalali ok');
          "

      - name: Verify tenant databases migrate before serving traffic
        working-directory: server
        run: |
          node -e "
          const fs = require('fs');
          const main = fs.readFileSync('src/main.ts', 'utf8');
          // migration باید *پیش از* listen اجرا شود، وگرنه اولین درخواست به
          // دیتابیسِ نیمه‌مهاجرت‌یافته می‌خورد.
          const iMigrate = main.indexOf('TenantMigratorService');
          const iListen = main.indexOf('app.listen');
          if (iMigrate < 0 || iListen < 0 || iMigrate > iListen) {
            console.error('migrationِ شرکت‌ها باید پیش از app.listen اجرا شود'); process.exit(1);
          }
          const svc = fs.readFileSync('src/tenant/tenant-migrator.service.ts', 'utf8');
          // قفلِ مشورتی: دو نمونه در دیپلویِ چرخشی نباید همزمان migrate کنند.
          if (!/pg_try_advisory_lock/.test(svc)) { console.error('قفلِ مشورتی لازم است'); process.exit(1); }
          // شرکتِ خراب نباید جلوی بقیه را بگیرد (برخلافِ ابزارِ دستی که break می‌زند).
          const loop = svc.split('for (const t of tenants)')[1].split('\\n    }')[0];
          if (/\\bbreak\\b/.test(loop)) { console.error('حلقهٔ fleet نباید با اولین خطا متوقف شود'); process.exit(1); }
          // خرابی باید دیده شود: هم در /health هم به‌شکلِ ۵۰۳ برای همان شرکت.
          const health = fs.readFileSync('src/app.controller.ts', 'utf8');
          if (!/migrations/.test(health)) { console.error('/health باید وضعیتِ migration را بدهد'); process.exit(1); }
          const mw = fs.readFileSync('src/tenant/tenant.middleware.ts', 'utf8');
          if (!/isBroken/.test(mw)) { console.error('شرکتِ عقب‌مانده باید پیامِ روشن بگیرد نه ۵۰۰های پراکنده'); process.exit(1); }
          console.log('tenant migration ok');
          "

      - name: Verify export reuses the list filter and never truncates silently
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('server/src/patients/patients.service.ts', 'utf8');
          // فیلتر یک جا ساخته می‌شود؛ وگرنه خروجی و فهرست از هم جدا می‌افتند.
          for (const m of ['async listVisits', 'async exportVisits']) {
            const body = svc.split(m)[1].split(/\\n  }/)[0];
            if (!/this\\.visitWhere\\(/.test(body)) { console.error(m + ' باید از visitWhere استفاده کند'); process.exit(1); }
          }
          // آمار نباید شرطِ فراخوان را بازنویسی کند (باگِ واقعی: فیلترِ وضعیت نادیده می‌شد).
          const strip = (t) => t.replace(/\\/\\*[\\s\\S]*?\\*\\//g, '').replace(/\\/\\/.*\$/gm, '');
          const stats = strip(svc.split('private async visitStats')[1].split(/\\n  }/)[0]);
          if (/\\.\\.\\.scoped, opStatus:/.test(stats)) {
            console.error('visitStats نباید opStatus فراخوان را بازنویسی کند؛ با AND ترکیب کن'); process.exit(1);
          }
          if (!/AND:/.test(stats)) { console.error('visitStats باید شرط‌ها را با AND ترکیب کند'); process.exit(1); }
          // بریدنِ بی‌صدا ممنوع.
          if (!/truncated/.test(svc)) { console.error('خروجی باید بریده‌شدن را اعلام کند'); process.exit(1); }
          const exp = fs.readFileSync('src/app/exports.js', 'utf8');
          if (!/\\uFEFF/.test(exp) && !exp.includes('BOM')) { console.error('CSV باید BOM داشته باشد وگرنه Excel فارسی را خراب می‌کند'); process.exit(1); }
          // نامِ فایل باید ASCII باشد: کرومیوم نامِ غیر-ASCII را دور می‌ریزد.
          const dl = exp.split('export function downloadCsv')[1].split(/\\n}/)[0];
          if (/[^\\x00-\\x7F]/.test((dl.match(/const name = \`[^\`]*\`/) || [''])[0])) {
            console.error('نامِ فایلِ CSV باید ASCII باشد'); process.exit(1);
          }
          console.log('export ok');
          "

      - name: Verify dispatch never leaks patient data to drivers and couriers
        run: |
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('server/src/patients/dispatch.service.ts', 'utf8');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');

          // ⚠️ همیشه *گزاره‌ی مثبت* بسنج، نه نبودِ یک رشته: دو بار پیش آمده که
          // نگهبان با متنِ خودِ کامنت مچ شد. برای همین متن‌ها اول strip می‌شوند.
          const src = strip(svc);

          // ① نقشِ تخصیص فقط راننده و پیک — کارشناس روی خودِ Visit می‌ماند.
          const roles = (src.match(/ASSIGN_ROLES = \[([^\]]*)\]/) || [])[1] || '';
          if (!/'driver'/.test(roles) || !/'courier'/.test(roles)) {
            console.error('ASSIGN_ROLES باید راننده و پیک را داشته باشد'); process.exit(1);
          }
          if (/'tech'/.test(roles)) {
            console.error('کارشناس نباید از مسیرِ تخصیص بیاید — روی خودِ Visit است'); process.exit(1);
          }

          // ①ب ولی *باید* از پنلِ چینش قابلِ انتخاب باشد. پنلی که کارشناس نمی‌چیند
          //     اسمش چینش نیست؛ فقط ستونِ دومی نمی‌سازد.
          const ui = fs.readFileSync('src/app/Dispatch.jsx', 'utf8');
          if (!/techId:/.test(ui)) { console.error('تبِ کارشناس باید Visit.techId را بنویسد'); process.exit(1); }
          // تبِ حمل‌ونقل حالا مسیر می‌چیند، نه تخصیصِ per-visit.
          if (!/routes\/\\\${runId}\/stops/.test(ui)) { console.error('تبِ حمل‌ونقل باید توقفِ مسیر بسازد'); process.exit(1); }

          // ② متنِ ابلاغ در *سرویس* ساخته می‌شود نه در UI، وگرنه کانالِ بعدی
          //    (بله/پیامک) فیلترِ حریمِ خصوصی را دور می‌زند.
          if (!/export function briefingText/.test(src)) {
            console.error('briefingText باید تابعِ خالصِ سرویس باشد'); process.exit(1);
          }
          if (!/briefing\?role=/.test(ui)) { console.error('UI باید متن را از سرور بگیرد نه بسازد'); process.exit(1); }

          // ③ آزمونِ رفتاری: راننده و پیک هیچ فیلدِ بیمار نمی‌گیرند، کارشناس می‌گیرد.
          const body = src.split('export function briefingText')[1];
          const guard = body.split('if (role === ')[1] || '';
          if (!/v\.fullName/.test(guard.split('} else {')[0] || '')) {
            console.error('نامِ بیمار فقط باید داخلِ شاخهٔ کارشناس باشد'); process.exit(1);
          }
          for (const f of ['v.fullName', 'v.code', 'v.surgeonName', 'v.procedureName']) {
            const after = body.split('} else {')[1] || '';
            const tail = after.split('L.push(\`بیمارستان')[0];
            if (tail.includes(f)) { console.error('شاخهٔ غیرکارشناس نباید ' + f + ' داشته باشد'); process.exit(1); }
          }
          // ساعتِ حضورِ کارشناس دادهٔ او است نه حمل‌کننده — هرکس ساعتِ خودش.
          const times = body.split('L.push(\`زمان:')[1] || '';
          if (!/techArriveTime/.test(times) || !/cargoDueTime/.test(times)) {
            console.error('کارشناس ساعتِ حضور و حمل‌کننده ساعتِ تحویلِ بار می‌گیرد'); process.exit(1);
          }
          const drvTime = times.split('} else if')[1] || '';
          if (/techArriveTime/.test(drvTime)) { console.error('حمل‌کننده نباید ساعتِ حضورِ کارشناس را بگیرد'); process.exit(1); }
          // ④ «بی‌راننده» یعنی حواله‌ای که هنوز روی هیچ مسیری ننشسته. عملِ
          //    بی‌حواله راننده نمی‌خواهد و علامت‌زدنش هشدارِ دروغ در کلِ ماه است.
          const month = src.split('async month(')[1].split(/\n  }/)[0];
          if (!/!t\.stopId/.test(month)) {
            console.error('«بی‌راننده» یعنی حواله‌ای که هنوز روی هیچ مسیری نیست');
            process.exit(1);
          }

          // ⑤ راننده و پیک حسابِ کاربری ندارند: اگر حمل به Account گره بخورد،
          //    تعریفِ هر راننده یک ثبت‌نامِ OTP لازم دارد و در عمل انجام نمی‌شود.
          //    (اینکه حمل از «مسیر» می‌آید نه از تخصیصِ per-visit، نگهبانِ
          //    «transport is planned by route» را دارد.)
          const schema = fs.readFileSync('server/prisma/schema.prisma', 'utf8');
          const run = schema.split('model TransportRun')[1].split('}')[0];
          if (!/TransportStaff/.test(run) || /Account/.test(run)) {
            console.error('مسیر باید به TransportStaff گره بخورد نه به Account'); process.exit(1);
          }
          const defs = fs.readFileSync('server/src/patients/definitions.service.ts', 'utf8');
          if (!/createTransportStaff/.test(defs)) {
            console.error('راننده و پیک باید در تعاریفِ پایه تعریف شوند'); process.exit(1);
          }
          // نیرویی که مسیر داشته حذفِ سخت نمی‌شود وگرنه چینشِ گذشته بی‌راننده می‌ماند.
          const del = defs.split('async deleteTransportStaff')[1].split(/\n  \}/)[0];
          if (!/_count\.runs > 0/.test(del) || !/active: false/.test(del)) {
            console.error('نیروی دارای مسیر باید غیرفعال شود نه حذف'); process.exit(1);
          }
          console.log('dispatch ok');
          "

      - name: Verify returnable assets separate commitment from stock movement
        run: |
          node -e "
          const fs = require('fs');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');
          const inv = strip(fs.readFileSync('server/src/patients/inventory.service.ts', 'utf8'));
          const ast = strip(fs.readFileSync('server/src/patients/assets.service.ts', 'utf8'));

          // ① رزرو ≠ حرکت: حوالهٔ روزِ آینده نباید دفترِ انبار را بزند، وگرنه
          //    برنامه‌ریزیِ فردا با «موجود نیست» رد می‌شود چون دستگاه هنوز بیرون است.
          const send = inv.split('async sendTransfer(')[1].split('async shipTransfer')[0];
          if (!/const future =/.test(send) || !/status = future \?/.test(send)) {
            console.error('حوالهٔ روزِ آینده باید planned شود'); process.exit(1);
          }
          if (!/if \(future\) \{[\s\S]*?plannedLines/.test(send)) {
            console.error('قلم‌های حوالهٔ برنامه‌ریزی‌شده باید در plannedLines بمانند'); process.exit(1);
          }
          const moveIdx = send.indexOf('this.move(');
          const elseIdx = send.indexOf('} else {');
          if (moveIdx < 0 || elseIdx < 0 || moveIdx < elseIdx) {
            console.error('حرکتِ انبار فقط در شاخهٔ «امروز» مجاز است'); process.exit(1);
          }

          // ② موجودی موقعِ *ارسال* بررسی می‌شود نه موقعِ برنامه‌ریزی.
          const ship = inv.split('async shipTransfer(')[1].split(/\n  \}/)[0];
          if (!/status !== 'planned'/.test(ship)) { console.error('ارسالِ دوباره باید مسدود شود'); process.exit(1); }
          if (!/this\.move\(/.test(ship)) { console.error('ارسال باید دفتر را بزند'); process.exit(1); }

          // ③ تعارضِ رزرو پیش از ساختِ حواله بررسی می‌شود — سندِ صادرشده پس‌گرفتنی نیست.
          const guardIdx = send.indexOf('this.assets.conflicts(');
          const createIdx = send.indexOf('stockTransfer.create(');
          if (guardIdx < 0 || createIdx < 0 || guardIdx > createIdx) {
            console.error('تعارض باید پیش از ساختِ حواله بررسی شود'); process.exit(1);
          }
          if (!/dto\.force/.test(send)) { console.error('عبور از تعارض باید صریح باشد'); process.exit(1); }

          // ④ فقط داراییِ برگشتی تعارض دارد: از یک لاتِ مصرفیِ ۱۰۰تایی می‌شود
          //    همزمان به دو بیمارستان داد.
          const conf = ast.split('async conflicts(')[1].split(/\n  \}/)[0];
          if (!/assetKind: \{ in: RETURNABLE \}/.test(conf)) {
            console.error('تعارض باید فقط روی داراییِ برگشتی باشد'); process.exit(1);
          }
          // ⚠️ «همان روز» غلط بود: یک دستگاه در یک روز بینِ چند بیمارستان
          //    می‌چرخد. تعارض هم‌پوشانیِ **بازه** است.
          if (!/overlaps\(want, have\)/.test(conf)) {
            console.error('تعارض باید هم‌پوشانیِ بازه باشد نه اشتراکِ روز'); process.exit(1);
          }
          if (/dayKey\(/.test(conf)) {
            console.error('مقایسهٔ روز در تعارض باقی مانده'); process.exit(1);
          }

          // ⑤ حوالهٔ planned هیچ حرکتی ندارد، پس تقویم باید قلم‌هایش را از
          //    plannedLines بخواند وگرنه تعهدِ فردا نامرئی می‌شود.
          if (!/function lotsOf/.test(ast) || !/plannedLines/.test(ast)) {
            console.error('تقویم باید تعهدِ برنامه‌ریزی‌شده را هم ببیند'); process.exit(1);
          }
          for (const fn of ['async assets(', 'async conflicts(', 'async month(']) {
            const body = ast.split(fn)[1].split(/\n  \}/)[0];
            if (!/lotsOf\(/.test(body)) { console.error(fn + ' باید از lotsOf استفاده کند'); process.exit(1); }
          }

          // ⑥ کمبود باید دیده شود، نه اینکه ردیف بی‌صدا خالی بماند.
          const sug = ast.split('async suggestFor(')[1];
          if (!/shortBy/.test(sug) || !/picked\.length < want/.test(sug)) {
            console.error('پیشنهاد باید کمبود را صریح اعلام کند'); process.exit(1);
          }
          console.log('assets ok');
          "

      - name: Verify transport is planned by route, not per visit
        run: |
          node -e "
          const fs = require('fs');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');
          const routes = strip(fs.readFileSync('server/src/patients/routes.service.ts', 'utf8'));
          const dis = strip(fs.readFileSync('server/src/patients/dispatch.service.ts', 'utf8'));
          const schema = fs.readFileSync('server/prisma/schema.prisma', 'utf8');

          // ① دانهٔ حمل «مسیر» است نه «عمل»: راننده چند بیمارستان را به ترتیب
          //    می‌رود، پس تخصیصِ per-visit جوابِ غلط می‌داد.
          if (/model VisitAssignment/.test(schema)) {
            console.error('تخصیصِ per-visit باید حذف شده باشد؛ حمل از مسیر می‌آید'); process.exit(1);
          }
          if (!/model TransportRun/.test(schema) || !/model TransportStop/.test(schema)) {
            console.error('مسیر و توقف باید در schema باشند'); process.exit(1);
          }
          if (!/stopId/.test(schema)) { console.error('حواله باید به توقف گره بخورد'); process.exit(1); }

          // ② «رانندهٔ این عمل» مشتق است، نه ستونِ ذخیره‌شده.
          if (!/function carriersOf/.test(dis)) { console.error('حمل‌کننده باید مشتق شود'); process.exit(1); }
          const carriers = dis.split('function carriersOf')[1].split(/\n\}/)[0];
          if (!/t\.stop\?\.run/.test(carriers)) {
            console.error('حمل‌کننده باید از مسیرِ توقف بیاید'); process.exit(1);
          }

          // ③ ترتیبِ توقف در دو مرحله نوشته می‌شود — (runId, seq) یکتاست و
          //    نوشتنِ مستقیم وسطِ جابه‌جایی به تصادمِ کلید می‌خورد.
          const re = routes.split('async reorder(')[1].split(/\n  \}/)[0];
          if ((re.match(/transportStop\.update/g) || []).length < 2 || !/-\(i \+ 1\)/.test(re)) {
            console.error('جابه‌جاییِ ترتیب باید دومرحله‌ای باشد'); process.exit(1);
          }

          // ④ حذفِ مسیر نباید حواله را ببرد — حواله سند است، مسیر برنامه.
          const del = routes.split('async deleteRun(')[1].split(/\n  \}/)[0];
          if (!/stockTransfer\.updateMany/.test(del) || !/stopId: null/.test(del)) {
            console.error('حذفِ مسیر باید حواله را آزاد کند نه حذف'); process.exit(1);
          }

          // ⑤ ابلاغِ مسیر یک پیام است و همان قاعدهٔ حریمِ خصوصی را دارد:
          //    راننده «چه چیزی، کجا، ساعتِ چند» می‌گیرد، نه «برای کیست».
          if (!/export function runBriefing/.test(routes)) {
            console.error('متنِ ابلاغِ مسیر باید تابعِ خالصِ سرویس باشد'); process.exit(1);
          }
          const rb = routes.split('export function runBriefing')[1];
          for (const f of ['fullName', 'patient', 'surgeonName', 'visitCode', 'procedureName']) {
            if (rb.includes(f)) { console.error('ابلاغِ مسیر نباید ' + f + ' داشته باشد'); process.exit(1); }
          }
          // ابلاغِ per-visit فقط برای کارشناس می‌ماند؛ راننده ابلاغِ مسیر می‌گیرد.
          const brief = (dis.match(/BRIEF_ROLES = \[([^\]]*)\]/) || [])[1] || '';
          if (!/'tech'/.test(brief) || /'driver'/.test(brief)) {
            console.error('ابلاغِ per-visit فقط برای کارشناس است'); process.exit(1);
          }

          // ⑥ نامِ کالای حوالهٔ برنامه‌ریزی‌شده باید resolve شود، وگرنه بارِ
          //    مسیرِ فردا بی‌نام دیده می‌شود — همان مسیری که باید چیده شود.
          for (const fn of ['async day(', 'async run(']) {
            const body = routes.split(fn)[1].split(/\n  \}/)[0];
            if (!/withPlannedLots/.test(body)) { console.error(fn + ' باید نامِ قلم‌ها را resolve کند'); process.exit(1); }
          }
          console.log('routes ok');
          "

      - name: Verify name unification never merges silently
        run: |
          rm -rf /tmp/nm && mkdir -p /tmp/nm
          npx --yes esbuild server/src/common/name-match.ts --bundle --platform=node --outfile=/tmp/nm/name-match.js --log-level=error
          node -e "
          const fs = require('fs');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');
          const svc = strip(fs.readFileSync('server/src/patients/name-merge.service.ts', 'utf8'));
          const { normalizeName, similarity, SUGGEST_MIN } = require('/tmp/nm/name-match.js');

          // ① رفتارِ واقعیِ نرمال‌سازی — نه اینکه فقط تابع وجود دارد.
          const same = ['لقمان حکیم', 'بیمارستان لقمان حکیم', 'بيمارستان لقمان حكيم', 'بیمارستانِ  لقمان  حکیم'];
          const keys = new Set(same.map(normalizeName));
          if (keys.size !== 1) {
            console.error('این‌ها باید یک کلید بدهند: ' + [...keys].join(' | ')); process.exit(1);
          }
          // نامِ متفاوت نباید تصادفاً یکی شود.
          if (normalizeName('بیمارستان میلاد') === normalizeName('بیمارستان لقمان')) {
            console.error('دو نامِ متفاوت یک کلید گرفتند'); process.exit(1);
          }
          if (similarity('بیمارستان میلاد', 'بیمارستان لقمان حکیم') >= SUGGEST_MIN) {
            console.error('نامِ بی‌ربط نباید پیشنهاد شود'); process.exit(1);
          }
          // نامی که فقط از واژه‌های عمومی ساخته شده نباید کلیدِ خالی بگیرد،
          // وگرنه با هر نامِ خالیِ دیگری یکی می‌شود.
          if (!normalizeName('بیمارستان امام')) { console.error('کلیدِ خالی ممنوع'); process.exit(1); }

          // ② ادغام هرگز خودکار نیست: resolve فقط پیشنهاد می‌دهد و چیزی نمی‌نویسد.
          const resolve = svc.split('async resolve(')[1].split(/\n  \}/)[0];
          if (/\.update|\.create|\.updateMany/.test(resolve)) {
            console.error('resolve نباید چیزی بنویسد — تصمیم با آدم است'); process.exit(1);
          }

          // ③ تأیید هم back-fill می‌کند هم حافظه می‌سازد؛ بدونِ دومی هر ایمپورت
          //    همان سؤال را دوباره می‌پرسد.
          const link = svc.split('async link(')[1].split(/\n  \}/)[0];
          if (!/hospitalAlias\.create/.test(link) || !/visit\.updateMany/.test(link)) {
            console.error('تأیید باید هم نامِ مستعار بسازد هم مراجعات را وصل کند'); process.exit(1);
          }
          // یک نام نباید به دو بیمارستان نگاشت شود.
          if (!/clash\.hospitalId !== h\.id/.test(link)) {
            console.error('نگاشتِ متناقض باید مسدود شود'); process.exit(1);
          }
          const schema = fs.readFileSync('server/prisma/schema.prisma', 'utf8');
          if (!/aliasNorm  String   @unique/.test(schema)) {
            console.error('aliasNorm باید یکتا باشد'); process.exit(1);
          }

          // ④ ایمپورت باید همان تصمیم را دوباره اعمال کند، نه رکوردِ تکراری بسازد.
          const imp = strip(fs.readFileSync('server/src/import/import.service.ts', 'utf8'));
          const up = imp.split('private async upsertByName(')[1].split(/\n  \}/)[0];
          if (!/canon\.get\(normalizeName\(name\)\)/.test(up) || !/hospitalAlias\.findMany/.test(up)) {
            console.error('ایمپورت باید نام را با شکلِ کانونی و نام‌های مستعار تطبیق دهد'); process.exit(1);
          }
          // تطبیق باید *پیش از* ساختِ رکوردِ تازه باشد، وگرنه بی‌اثر است.
          if (up.indexOf('canon.get(') > up.indexOf('.create({ data: { name } })')) {
            console.error('تطبیق باید پیش از ساختِ بیمارستانِ تازه انجام شود'); process.exit(1);
          }
          console.log('name-merge ok');
          "

      - name: Verify asset commitment is a time window released by the tech
        run: |
          rm -rf /tmp/win && mkdir -p /tmp/win
          npx --yes esbuild server/src/common/asset-window.ts --bundle --platform=node --outfile=/tmp/win/assets.js --log-level=error
          node -e "
          const fs = require('fs');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');
          const { windowOf, overlaps } = require('/tmp/win/assets.js');
          const day = new Date('2026-11-10T00:00:00.000Z');
          const w = (due, end, turn) => windowOf({ plannedFor: day, visit: { cargoDueTime: due, opEndTime: end } }, turn);

          // ① چرخشِ روزانه نباید مسدود شود: صبح لقمان، بعدازظهر میلاد.
          if (overlaps(w('06:00','10:00',0), w('13:00','17:00',0))) {
            console.error('چرخشِ صبح/عصرِ یک دستگاه نباید تعارض بدهد'); process.exit(1);
          }
          // ② ولی عملِ هم‌پوش باید تعارض بدهد.
          if (!overlaps(w('06:00','10:00',0), w('09:00','12:00',0))) {
            console.error('دو عملِ هم‌پوش باید تعارض بدهند'); process.exit(1);
          }
          // ③ ساعتِ آماده‌سازی باید بازه را کش بدهد، وگرنه ستِ استریل‌نشده اعزام می‌شود.
          if (!overlaps(w('06:00','10:00',6), w('13:00','17:00',0))) {
            console.error('turnaroundHours باید در بازه اثر کند'); process.exit(1);
          }
          // ④ ندانستنِ ساعت به «آزاد» ترجمه نمی‌شود — کلِ روز تعهد است.
          const blind = windowOf({ plannedFor: day, visit: {} }, 0);
          if (blind[1] - blind[0] < 23 * 3600e3) {
            console.error('بدونِ ساعت باید کلِ روز تعهد شود'); process.exit(1);
          }
          // ⑤ آزادسازیِ کارشناس بر ساعتِ برنامه مقدم است — واقعیت بر حدس.
          const rel = new Date('2026-11-10T09:40:00.000Z');
          const got = windowOf({ plannedFor: day, releasedAt: rel, visit: { cargoDueTime: '06:00', opEndTime: '10:00' } }, 0);
          if (+got[1] !== +rel) { console.error('آزادسازیِ کارشناس باید پایانِ بازه را تعیین کند'); process.exit(1); }

          // ⑥ آزادسازی کارِ کارشناسِ سرِ عمل است، نه دفتر.
          const ctl = fs.readFileSync('server/src/patients/inventory.controller.ts', 'utf8');
          const rl = ctl.split(\"@Post('transfers/:id/release')\")[0].split('@RequirePermissions').pop();
          if (!/stock\.consume/.test(rl)) {
            console.error('اعلامِ پایان باید با مجوزِ کارشناس باشد'); process.exit(1);
          }
          const svc = strip(fs.readFileSync('server/src/patients/inventory.service.ts', 'utf8'));
          const body = svc.split('async releaseTransfer(')[1].split(/\n  \}/)[0];
          if (!/windowTo: now/.test(body)) { console.error('آزادسازی باید بازه را ببندد'); process.exit(1); }
          if (!/releasedAt\) throw/.test(body)) { console.error('آزادسازیِ دوباره باید مسدود شود'); process.exit(1); }

          // ⑦ صفِ جمع‌آوری به روز مقید نیست: ستی که دیروز آزاد شد و جمع نشد
          //    باید امروز هم دیده شود.
          const routes = strip(fs.readFileSync('server/src/patients/routes.service.ts', 'utf8'));
          const q = routes.split('async pickupQueue(')[1].split(/\n  \}/)[0];
          if (/runDate|gte:/.test(q)) { console.error('صفِ جمع‌آوری نباید به روز مقید باشد'); process.exit(1); }
          if (!/NOT: \{ releasedAt: null \}/.test(q)) { console.error('صف باید فقط آزادشده‌ها را بدهد'); process.exit(1); }

          // ⑧ کارشناس همکار است نه بیمار: نامش در ابلاغِ راننده مجاز و لازم است،
          //    ولی نامِ بیمار همچنان ممنوع.
          const rb = routes.split('export function runBriefing')[1];
          if (!/کارشناسِ حاضر/.test(rb)) { console.error('ابلاغِ راننده باید کارشناس را بگوید'); process.exit(1); }
          if (!/ساعتِ تحویل/.test(rb)) { console.error('ابلاغِ راننده باید ساعتِ تحویل را بگوید'); process.exit(1); }
          for (const f of ['fullName', 'patient.', 'surgeonName']) {
            if (rb.includes(f)) { console.error('ابلاغِ مسیر نباید ' + f + ' داشته باشد'); process.exit(1); }
          }
          console.log('window ok');
          "

      - name: Verify delivery proof stays operational and shortages stay visible
        run: |
          node -e "
          const fs = require('fs');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');
          const routes = strip(fs.readFileSync('server/src/patients/routes.service.ts', 'utf8'));
          const assets = strip(fs.readFileSync('server/src/patients/assets.service.ts', 'utf8'));
          const schema = fs.readFileSync('server/prisma/schema.prisma', 'utf8');
          const ctl = fs.readFileSync('server/src/patients/routes.controller.ts', 'utf8');

          // ① رسیدِ تحویل سندِ عملیاتی است نه بالینی: در پروندهٔ بیمار نمی‌نشیند.
          //    راننده هیچ زمینهٔ بیماری ندارد و عکسِ امضای CSR مدرکِ پزشکی نیست.
          if (!/model StopProof/.test(schema)) { console.error('رسیدِ تحویل باید مدلِ خودش را داشته باشد'); process.exit(1); }
          const proof = schema.split('model StopProof')[1].split('}')[0];
          if (/patientId|Document/.test(proof)) {
            console.error('رسیدِ تحویل نباید به پروندهٔ بیمار وصل شود'); process.exit(1);
          }
          const add = routes.split('async addProof(')[1].split(/\n  \}/)[0];
          // ⚠️ روی متنِ **خام** بسنج نه strip‌شده: الگوی ^image\/ خودش دو اسلش
          //    دارد و کامنت‌زدای این نگهبان آن را می‌خورد.
          const rawRoutes = fs.readFileSync('server/src/patients/routes.service.ts', 'utf8');
          const addRaw = rawRoutes.split('async addProof(')[1].split(/\n  }/)[0];
          if (!addRaw.includes('^image')) { console.error('رسید باید عکس باشد'); process.exit(1); }

          // ② فایل مستقیم از دیسک سرو نمی‌شود — URLِ ثابتِ عمومی یعنی نشتِ سند
          //    با یک لینکِ فوروارد‌شده.
          if (!/@RequirePermissions\('patients\.read'\)[\s\S]{0,120}@Get\('proofs\/:id\/file'\)/.test(ctl)) {
            console.error('دانلودِ رسید باید پشتِ مجوز باشد'); process.exit(1);
          }
          if (!/no-store/.test(ctl)) { console.error('رسید نباید در کشِ میانی بنشیند'); process.exit(1); }

          // ③ فقط **کسری** ثبت می‌شود نه کلِ شمارش: ثبتِ ۲۰ ردیفِ «سالم» برای هر
          //    برگشت یعنی هیچ‌کس این کار را نمی‌کند و کسری هم ثبت نمی‌شود.
          const sh = schema.split('model SetShortage')[1].split('}')[0];
          if (!/missing/.test(sh) || /checked|counted|okCount/.test(sh)) {
            console.error('مدلِ کسری باید فقط کسری را ثبت کند'); process.exit(1);
          }

          // ④ محتویات فقط برای داراییِ برگشتی معنا دارد.
          const ac = assets.split('async addContent(')[1].split(/\n  \}/)[0];
          if (!/RETURNABLE\.includes\(set\.assetKind\)/.test(ac)) {
            console.error('قلمِ مصرفی نباید محتویات بگیرد'); process.exit(1);
          }

          // ⑤ چک‌لیستِ برگشت باید محتویات را از **تعریفِ ست** بیاورد، نه دستی.
          const rc = assets.split('async returnCheck(')[1].split(/\n  \}/)[0];
          if (!/itemComponent\.findMany/.test(rc)) {
            console.error('چک‌لیست باید از تعریفِ ست بیاید'); process.exit(1);
          }

          // ⑥ گزارشِ کسری باید «کدام ست» و «کدام بیمارستان» را بدهد — بدونِ این،
          //    نشتی عدد دارد ولی علت ندارد.
          const rep = assets.split('async shortageReport(')[1];
          if (!/byItem/.test(rep) || !/byHospital/.test(rep)) {
            console.error('گزارشِ کسری باید تفکیکِ ست و بیمارستان بدهد'); process.exit(1);
          }
          console.log('proof ok');
          "

      - name: Verify consigned assets stop reading as overdue and transport cost lands in the ledger
        run: |
          rm -rf /tmp/cj && mkdir -p /tmp/cj
          npx --yes esbuild server/src/common/transport-cost.ts --bundle --platform=node --outfile=/tmp/cj/cost.js --log-level=error
          npx --yes esbuild server/src/common/consignment.ts --bundle --platform=node --outfile=/tmp/cj/cons.js --log-level=error
          node -e "
          const fs = require('fs');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');
          const assets = strip(fs.readFileSync('server/src/patients/assets.service.ts', 'utf8'));
          const routes = strip(fs.readFileSync('server/src/patients/routes.service.ts', 'utf8'));
          const schema = fs.readFileSync('server/prisma/schema.prisma', 'utf8');

          // ① امانی باید بر «بیرون» مقدم باشد. اگر ترتیب برعکس شود، دستگاهِ
          //    مستقر هر روز در فهرستِ «باید برگردد» تکرار می‌شود تا کاربر کلِ
          //    فهرست را نادیده بگیرد — یعنی هشدارِ واقعی هم گم می‌شود.
          const order = ['service', 'consigned', 'out', 'booked'].map((s) => assets.indexOf(\"state = '\" + s + \"'\"));
          if (order.some((i) => i < 0) || order.some((v, i) => i && v < order[i - 1])) {
            console.error('ترتیبِ وضعیتِ دارایی باید سرویس ← امانی ← بیرون ← رزرو باشد'); process.exit(1);
          }

          // ② امانی در صفِ جمع‌آوری نمی‌آید: آن‌جا زندگی می‌کند، پس هر روز ته صف
          //    می‌ماند و صف بی‌معنا می‌شود.
          const pq = routes.split('async pickupQueue(')[1].split(/\n  \}/)[0];
          if (!/consigned\.has\(/.test(pq)) {
            console.error('صفِ جمع‌آوری باید امانی را کنار بگذارد'); process.exit(1);
          }

          // ③ سپردن حرکتِ دفتری نمی‌سازد — وگرنه یک جابه‌جایی دو بار در موجودی
          //    می‌نشیند. محلِ فیزیکی همچنان از StockMovement می‌آید.
          const cons = assets.split('async consign(')[1].split(/\n  \}/)[0];
          if (/stockMovement\.create|createMany/.test(cons)) {
            console.error('سپردنِ امانی نباید حرکتِ انبار بسازد'); process.exit(1);
          }
          if (!/RETURNABLE\.includes\(lot\.item\.assetKind\)/.test(cons)) {
            console.error('قلمِ مصرفی امانی نمی‌شود'); process.exit(1);
          }

          // ④ صورت‌برداری سه عدد دارد نه دو: تفاوتِ «مصرف» و «گم» تفاوتِ فاکتورِ
          //    فروش با زیانِ شرکت است. یک عددِ «مغایرت» هر دو را دفن می‌کند.
          const line = schema.split('model ConsignmentCountLine')[1].split('}')[0];
          for (const f of ['expected', 'counted', 'used']) {
            if (!new RegExp('\\\\b' + f + '\\\\b').test(line)) {
              console.error('قلمِ صورت‌برداری باید ' + f + ' داشته باشد'); process.exit(1);
            }
          }

          // ⑤ تطبیق تابعِ خالص است و در سرویس دوباره نوشته نمی‌شود — دو تعریف از
          //    «کسری» یعنی عددِ صفحه با عددِ گزارش فرق کند.
          // ⚠️ خلوص را با نبودِ خطِ import بسنج نه با جست‌وجوی واژهٔ prisma: خودِ
          //    کامنتِ بالای فایل کلمهٔ Prisma را دارد و نگهبان بی‌دلیل می‌ترکید.
          const rec = strip(fs.readFileSync('server/src/common/consignment.ts', 'utf8'));
          if (!/export function reconcileCount/.test(rec) || /^\s*import /m.test(rec)) {
            console.error('ریاضیِ امانی باید خالص و جدا بماند'); process.exit(1);
          }
          if (!/Math\.min\(/.test(rec)) {
            console.error('مصرفِ اعلامی باید به کسریِ واقعی سنجاق شود'); process.exit(1);
          }
          if (!/reconcileCount\(/.test(assets)) {
            console.error('سرویس باید از همان تابعِ خالص بخواند'); process.exit(1);
          }

          // ⑥ هزینهٔ حمل باید به **ردیفِ دفتر** برسد. اگر فقط روی مسیر بنشیند، در
          //    گزارشِ مالی دیده نمی‌شود و سودِ ماه بیشتر از واقعیت گزارش می‌شود.
          const cost = routes.split('async setCost(')[1].split(/\n  \}/)[0];
          if (!/ledger\.addExpense/.test(cost)) {
            console.error('هزینهٔ مسیر باید ردیفِ Expense بسازد'); process.exit(1);
          }
          if (!/removeExpense/.test(cost)) {
            console.error('ویرایشِ هزینه باید ردیفِ قبلی را ببرد، وگرنه دو بار شمرده می‌شود'); process.exit(1);
          }

          // ⑦ سرشکنِ per-visit ذخیره نمی‌شود — ذخیره‌اش یعنی هزینه دو بار در
          //    گزارشِ مالی بیاید (یک‌بار Expense، یک‌بار سهمِ عمل).
          const tc = strip(fs.readFileSync('server/src/common/transport-cost.ts', 'utf8'));
          if (/^\s*import /m.test(tc)) { console.error('سرشکنِ هزینه باید خالص بماند'); process.exit(1); }
          const stop = schema.split('model TransportStop')[1].split(/\n\}/)[0];
          if (/visitCost|costShare|allocatedCost/.test(stop)) {
            console.error('سهمِ عمل نباید روی توقف ذخیره شود'); process.exit(1);
          }

          // ⑧ باقی‌ماندهٔ تقسیم گم نمی‌شود: جمعِ سرشکن باید دقیقاً برابرِ هزینه باشد،
          //    وگرنه همان اختلافِ یک‌تومانی اعتماد به گزارش را می‌برد.
          const { allocate, allocateRun } = require('/tmp/cj/cost.js');
          for (const [total, n] of [[100000, 3], [7, 3], [1, 4], [999999, 7]]) {
            const sum = [...allocate(total, Array.from({ length: n }, (_, i) => i)).values()].reduce((a, b) => a + b, 0);
            if (sum !== total) { console.error('سرشکنِ ' + total + ' روی ' + n + ' برابرِ کل نشد: ' + sum); process.exit(1); }
          }

          // ⑨ عملی که هم تحویل دارد هم جمع‌آوری، یک‌بار شمرده می‌شود — وگرنه
          //    رفت‌وبرگشت دو برابر هزینه می‌گیرد.
          const both = allocateRun({
            fuelCost: 100, stops: [{ transfers: [{ visitId: 5 }] }, { transfers: [{ visitId: 5 }] }],
          });
          if (both.shares.length !== 1 || both.shares[0].amount !== 100) {
            console.error('عملِ رفت‌وبرگشتی نباید دو سهم بگیرد'); process.exit(1);
          }
          // توقفِ بدونِ عمل سهمی نمی‌گیرد و مبلغش صریح «سرشکن‌نشده» می‌ماند،
          // نه اینکه بی‌سروصدا به گردنِ یک بیمار بیفتد.
          const none = allocateRun({ fuelCost: 100, stops: [{ transfers: [{ visitId: null }] }] });
          if (none.unallocated !== 100) { console.error('هزینهٔ بی‌عمل باید صریح سرشکن‌نشده بماند'); process.exit(1); }

          // ⑩ سررسیدِ امانیِ هرگز‌نشمرده از **روزِ سپردن** می‌آید. اگر فقط آخرین
          //    شمارش مبنا بود، امانی‌ای که یک‌بار هم شمرده نشده هیچ‌وقت سررسید
          //    نمی‌گرفت — یعنی همانی که بیشتر از همه باید شمرده شود از فهرست
          //    می‌افتاد.
          const { countDueAt, countStatus, reconcileCount } = require('/tmp/cj/cons.js');
          const from = new Date('2026-01-01T00:00:00.000Z');
          const due = countDueAt(null, from, 30);
          if (!due || countStatus(due, new Date('2026-03-01T00:00:00.000Z')) !== 'overdue') {
            console.error('امانیِ نشمرده باید از روزِ سپردن سررسید بگیرد'); process.exit(1);
          }
          if (countDueAt(null, from, 0) !== null) { console.error('دورهٔ صفر نباید همه را عقب‌افتاده کند'); process.exit(1); }
          const r = reconcileCount([{ label: 'x', expected: 6, counted: 3, used: 99 }]);
          if (r.totals.used !== 3 || r.totals.missing !== 0) {
            console.error('مصرفِ بیش از کسری باید سنجاق شود، نه کسریِ منفی بسازد'); process.exit(1);
          }
          console.log('consignment + transport cost ok');
          "

      - name: Verify tenant settings stay declared, isolated per tenant, and actually consumed
        run: |
          rm -rf /tmp/stg && mkdir -p /tmp/stg
          npx --yes esbuild server/src/config/settings-registry.ts --bundle --platform=node --outfile=/tmp/stg/reg.js --log-level=error
          node -e "
          const fs = require('fs');
          const strip = (t) => t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*\$/gm, '');
          const svc = strip(fs.readFileSync('server/src/config/settings.service.ts', 'utf8'));
          const reg = strip(fs.readFileSync('server/src/config/settings-registry.ts', 'utf8'));
          const ctl = fs.readFileSync('server/src/config/settings.controller.ts', 'utf8');

          // ① **مهم‌ترین ادعای این بخش**: کشِ تنظیمات باید با شناسهٔ تنانت کلید
          //    بخورد. PrismaService تک‌نمونه است و تنانت از AsyncLocalStorage
          //    می‌آید؛ کشِ بی‌کلید یعنی نامِ انبارِ شرکتِ اول روی فاکتورِ شرکتِ
          //    دوم چاپ شود — و سامانه کاملاً سالم به‌نظر برسد.
          if (!/tenantKey\(\)[\s\S]{0,200}tenants\.require\(\)\.tenantId/.test(svc)) {
            console.error('کلیدِ کش باید tenantId باشد'); process.exit(1);
          }
          for (const m of ['rows', 'invalidate']) {
            const body = svc.split('private ' + m + '(')[1] ?? svc.split(m + '(')[1];
            if (!/tenantKey\(\)/.test((body ?? '').slice(0, 400))) {
              console.error('«' + m + '» باید از کلیدِ تنانت استفاده کند'); process.exit(1);
            }
          }
          // نوشتن باید کش را باطل کند، وگرنه همان replica مقدارِ کهنه می‌دهد.
          const upd = svc.split('async update(')[1].split(/\n  \}/)[0];
          if (!/this\.invalidate\(\)/.test(upd)) { console.error('ذخیره باید کش را باطل کند'); process.exit(1); }

          // ② کلیدِ نااعلام **رد** می‌شود، نه بی‌سروصدا نادیده گرفته: نادیده‌گرفتن
          //    یعنی کاربر «ذخیره شد ✓» ببیند و مقدارش هیچ‌جا نرود.
          // نگهبان باید **پرتابِ خطا** را ببیند نه صرفاً ذکرِ نام؛ وگرنه
          // \«if (false && unknown.length)\» هم از آن رد می‌شد.
          if (!/SETTING_BY_KEY\.has/.test(upd)
              || !/if \(unknown\.length\) \{[\s\S]{0,200}throw new BadRequestException/.test(upd)) {
            console.error('کلیدِ ناشناخته باید رد شود'); process.exit(1);
          }

          // ③ رجیستری خالص می‌ماند تا هم CI بسنجدش هم صفحه از رویش ساخته شود.
          if (/^\s*import /m.test(reg)) { console.error('رجیستری باید خالص بماند'); process.exit(1); }

          // ④ نوشتن مالِ سوپرادمین است، خواندن برای مدیر باز.
          if (!/MinLevel\(LEVEL\.SUPER_ADMIN\)[\s\S]{0,80}@Patch\(\)/.test(ctl)) {
            console.error('نوشتنِ تنظیمات باید سطحِ سوپرادمین بخواهد'); process.exit(1);
          }

          // ⑤ برای هر کلید فقط **یک** نویسنده باشد. مسیرِ دومِ نوشتن یعنی یکی‌شان
          //    کش را باطل نکند و صفحه مقدارِ کهنه نشان دهد.
          const cfgCtl = fs.readFileSync('server/src/config/config.controller.ts', 'utf8');
          if (/@Patch\('brand'\)/.test(cfgCtl)) {
            console.error('نامِ برند فقط از راهِ PATCH /settings نوشته می‌شود'); process.exit(1);
          }

          // ⑥ تنظیمی که کد نمی‌خواندش تنظیم نیست، یادداشت است: هر کلیدِ اعلام‌شده
          //    باید جایی در سرور یا رابط واقعاً مصرف شود.
          const { SETTINGS } = require('/tmp/stg/reg.js');
          const { execSync } = require('child_process');
          // ⚠️ خودِ رجیستری از جست‌وجو کنار گذاشته می‌شود: اعلامِ کلید مصرفِ آن
          //    نیست، و بدونِ این استثنا هر کلیدِ بی‌مصرفی خودش را تأیید می‌کرد.
          //    فیلتر در Node انجام می‌شود نه با \«grep --exclude\»: آن گزینه این‌جا
          //    بی‌اثر بود و نگهبان بی‌سروصدا همیشه سبز می‌شد. \«-I\» هم فایلِ
          //    دودوییِ Prisma را کنار می‌گذارد.
          const REG = 'server/src/config/settings-registry.ts';
          const hay = new Set(
            execSync(
              \"grep -rIHo \\\"'[a-z_]*'\\\" server/src src --include=*.ts --include=*.js --include=*.jsx\",
              { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 },
            )
              .split('\n')
              .filter((l) => l && !l.startsWith(REG + ':'))
              .map((l) => l.slice(l.indexOf(':') + 1)),
          );
          const brandKeys = new Set(['company_legal_name', 'company_national_id', 'company_econ_code', 'company_phone', 'company_address', 'brand_name']);
          for (const d of SETTINGS) {
            // کلیدهای هویت را \«SettingsService.brand()\» یک‌جا می‌خواند.
            if (brandKeys.has(d.key)) continue;
            if (!hay.has(\"'\" + d.key + \"'\")) {
              console.error('تنظیمِ «' + d.key + '» هیچ‌جا خوانده نمی‌شود'); process.exit(1);
            }
          }
          if (!/get\('company_national_id'\)|company_national_id/.test(svc)) {
            console.error('هویتِ شرکت باید در brand() خوانده شود'); process.exit(1);
          }

          // ⑦ برابرِ پیش‌فرض = **نبودِ ردیف**. اگر پیش‌فرض‌ها در دیتابیس کپی شوند،
          //    روزی که پیش‌فرضِ کد بهتر شود هیچ نصبی آن را نمی‌گیرد.
          if (!/isDefault\(def, value\)[\s\S]{0,120}deleteMany/.test(upd)) {
            console.error('مقدارِ برابرِ پیش‌فرض باید ردیف را پاک کند'); process.exit(1);
          }

          // ⑧ رفتارِ خالص: شناسه‌ها با ارقامِ انگلیسی ذخیره می‌شوند، عددِ فارسی
          //    خوانده می‌شود، و خطاها یک‌جا برمی‌گردند نه یکی‌یکی.
          const { coerce, SETTING_BY_KEY, isDefault } = require('/tmp/stg/reg.js');
          const nid = coerce(SETTING_BY_KEY.get('company_national_id'), '۱۴۰۰۳۳۳۲۲۲۱');
          if (nid.value !== '14003332221') { console.error('شناسه باید با رقمِ انگلیسی ذخیره شود: ' + nid.value); process.exit(1); }
          const days = coerce(SETTING_BY_KEY.get('consignment_default_days'), '۴۵');
          if (days.value !== 45) { console.error('عددِ فارسی باید خوانده شود'); process.exit(1); }
          if (!coerce(SETTING_BY_KEY.get('consignment_default_days'), 'خیلی').error) {
            console.error('عددِ نامعتبر باید خطا بدهد'); process.exit(1);
          }
          if (!isDefault(SETTING_BY_KEY.get('home_location'), 'انبارِ مرکزی')) {
            console.error('تشخیصِ پیش‌فرض کار نمی‌کند'); process.exit(1);
          }
          console.log('tenant settings ok');
          "

      - name: Verify icons stay in one place and no glyph is used as an icon
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');

          const jsx = execSync(\"find src -name '*.jsx' -o -name '*.js'\", { encoding: 'utf8' })
            .split('\n').filter(Boolean);

          // ① هیچ <svg> بیرونِ src/ui — وگرنه دوباره ۸۰ آیکون در ۱۸ فایل پخش
          //    می‌شود و «مداد» در دو صفحه دو شکل پیدا می‌کند بی‌آنکه کسی ببیند.
          //    استثنا: src/components (لندینگِ بازاریابی، سیستمِ دیداریِ جدا).
          const stray = jsx.filter((f) =>
            !f.startsWith('src/ui/') && !f.startsWith('src/components/') &&
            /<svg[\s>]/.test(fs.readFileSync(f, 'utf8')));
          if (stray.length) {
            console.error('SVG بیرونِ src/ui: ' + stray.join('، ')); process.exit(1);
          }

          // ② هیچ نویسهٔ متنی به‌جای آیکون. اندازه و ضخامتش کنترل‌پذیر نیست،
          //    روی سه سیستم‌عامل سه شکل دارد، و متحرک نمی‌شود.
          const GLYPH = /[✕✖✔✉◎▲▼★☆⚠]/;
          const bad = [];
          for (const f of jsx) {
            // ⚠️ کامنت‌ها اول حذف می‌شوند وگرنه نگهبان روی توضیحاتِ خودِ کد
            //    گیر می‌کند — و آن‌وقت یا کامنت‌ها بی‌معنا می‌شوند یا نگهبان
            //    خاموش. خطوط با \n جایگزین می‌شوند تا شمارهٔ خط نلغزد.
            const src = fs.readFileSync(f, 'utf8')
              .replace(/\{?\/\*[\s\S]*?\*\/\}?/g, (m) => m.replace(/[^\n]/g, ' '))
              .replace(/^\s*\/\/.*\$/gm, '');
            src.split('\n').forEach((line, i) => {
              if (GLYPH.test(line)) bad.push(f + ':' + (i + 1) + ' ' + line.trim().slice(0, 60));
            });
          }
          if (bad.length) {
            console.error('نویسه به‌جای آیکون:\n  ' + bad.join('\n  ')); process.exit(1);
          }

          // ③ هیچ ایموجی در رابط. ملک‌طب پر از 🔔📊💬 بود؛ عمل‌یار از اول نگرفت
          //    و نباید بگیرد — ایموجی نه با تم عوض می‌شود نه متحرک.
          const EMOJI = /[\u{1F300}-\u{1FAFF}\u{1F000}-\u{1F0FF}]/u;
          const emo = jsx.filter((f) => EMOJI.test(fs.readFileSync(f, 'utf8')));
          if (emo.length) { console.error('ایموجی در: ' + emo.join('، ')); process.exit(1); }

          // ④ ماژولِ آیکونِ ساده باید بی‌وابستگی بماند تا هر جا (حتی چاپ) قابلِ
          //    استفاده باشد؛ آیکونِ متحرک فایلِ خودش را دارد.
          const plain = fs.readFileSync('src/ui/icons.jsx', 'utf8');
          if (/^\s*import /m.test(plain)) {
            console.error('src/ui/icons.jsx باید بدونِ وابستگی بماند'); process.exit(1);
          }

          // ⑤ همهٔ آیکون‌ها از یک شبکه — viewBox یکسان، رنگ از currentColor.
          for (const f of ['src/ui/icons.jsx', 'src/ui/icons-motion.jsx']) {
            const t = fs.readFileSync(f, 'utf8');
            const boxes = [...t.matchAll(/viewBox: ?'([^']+)'|viewBox=\"([^\"]+)\"/g)]
              .map((m) => m[1] || m[2]);
            const odd = boxes.filter((b) => b !== '0 0 24 24');
            if (odd.length) { console.error(f + ': viewBoxِ ناهمگون → ' + odd.join('، ')); process.exit(1); }
            if (!/stroke: ?'currentColor'|stroke=\"currentColor\"/.test(t)) {
              console.error(f + ': آیکون باید رنگ را از currentColor بگیرد'); process.exit(1);
            }
          }
          console.log('icon system ok');
          "

      - name: Verify tabs come from one component and honour reduced motion
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const jsx = execSync(\"find src -name '*.jsx'\", { encoding: 'utf8' }).split('\n').filter(Boolean);
          const tabs = fs.readFileSync('src/ui/Tabs.jsx', 'utf8');

          // ① نوارِ تبِ دست‌ساز ممنوع. شش صفحه شش نوارِ جدا داشتند با شش CSS؛
          //    نتیجه‌اش سه لهجهٔ رنگیِ متفاوت بود که هیچ‌کس تصمیم نگرفته بود.
          const rogue = jsx.filter((f) => f !== 'src/ui/Tabs.jsx'
            && /role=\"tablist\"/.test(fs.readFileSync(f, 'utf8')));
          if (rogue.length) {
            console.error('نوارِ تبِ دست‌ساز در: ' + rogue.join('، ')); process.exit(1);
          }

          // ② قرصِ فعال باید **یک المان** باشد که می‌لغزد، نه پس‌زمینه‌ای که
          //    روی هر دکمه خاموش/روشن شود. حالا با اندازه‌گیریِ دکمهٔ فعال.
          if (!/animate=\{box\}/.test(tabs) || !/offsetLeft/.test(tabs)) {
            console.error('قرصِ تب باید با اندازهٔ دکمهٔ فعال جابه‌جا شود'); process.exit(1);
          }

          // ③ ⚠️ **layoutId در کلِ برنامه ممنوع** — قاعدهٔ سلیقه‌ای نیست، از یک
          //    باگِ واقعی درآمده. قرصِ تب قبلاً فقط داخلِ دکمهٔ فعال رندر می‌شد
          //    و با layoutId جابه‌جا می‌شد؛ یعنی هر بار عوض‌کردنِ تب یک المانِ
          //    shared-layout را unmount می‌کرد. داخلِ شیتی که AnimatePresence
          //    دارد، همین حسابداریِ framer را گیر می‌انداخت و **خروجِ شیت هرگز
          //    تمام نمی‌شد**: یک *-overlayِ نامرئی روی صفحه می‌ماند و همهٔ
          //    کلیک‌ها را می‌بلعید. شیت بسته به‌نظر می‌رسید و هیچ دکمه‌ای کار
          //    نمی‌کرد. نگهبانِ رفتاری‌اش: scripts/e2e/sheet-overlay.mjs
          //    (کاربردِ واقعی سنجیده می‌شود نه ذکرش در توضیح — همین توضیح‌ها
          //     جای درسِ باگ‌اند و نباید باعثِ قرمزیِ CI شوند.)
          const withLayoutId = jsx.filter((f) => /layoutId\s*[=:]/.test(fs.readFileSync(f, 'utf8')));
          if (withLayoutId.length) {
            console.error('layoutId ممنوع (خروجِ AnimatePresence را می‌شکند) در: ' + withLayoutId.join('، '));
            process.exit(1);
          }

          // ④ ⚠️ اندازه‌گیری نباید حلقهٔ رندر بسازد. اگر setBox هر بار یک شیءِ
          //    تازه بدهد، React آن را تغییرِ state می‌بیند و افکت دوباره اندازه
          //    می‌گیرد — بی‌پایان. در ظاهر دیده نمی‌شود (قرص سرِ جایش است) ولی
          //    برنامه را می‌سوزاند. پس هم مقایسهٔ مقدار لازم است، هم وابستگیِ
          //    افکت باید کلیدِ تب‌ها باشد نه خودِ آرایه — که همهٔ مصرف‌کننده‌ها
          //    inline می‌سازند و هر رندر هویتِ تازه دارد.
          if (!/setBox\(\(b\) =>/.test(tabs)) {
            console.error('setBox باید مقدار را مقایسه کند وگرنه حلقهٔ رندر می‌سازد'); process.exit(1);
          }
          if (!/const sig = items\.map/.test(tabs) || /\[measure, value, items\]/.test(tabs)) {
            console.error('وابستگیِ افکت باید کلیدِ تب‌ها باشد نه آرایهٔ items'); process.exit(1);
          }

          // ④ «حرکتِ کمتر» انتخابِ کاربر است، نه پیشنهاد. انیمیشنی که با
          //    prefers-reduced-motion خاموش نشود، برای کسی که سرگیجه می‌گیرد
          //    قابلِ استفاده نیست.
          if (!/useReducedMotion\(\)/.test(tabs) || !/duration: 0/.test(tabs)) {
            console.error('نوارِ تب باید prefers-reduced-motion را رعایت کند'); process.exit(1);
          }

          // ⑤ لهجهٔ رنگ از متغیر می‌آید نه از قاعدهٔ کپی‌شده — وگرنه لهجهٔ
          //    بعدی باز یک کپیِ کاملِ استایل می‌شود.
          const css = fs.readFileSync('src/ui/ui.css', 'utf8');
          if (!/--tab-accent/.test(css) || !/background: var\(--tab-accent\)/.test(css)) {
            console.error('رنگِ قرص باید از --tab-accent بیاید'); process.exit(1);
          }
          console.log('tabs ok');
          "

      - name: Verify sheets close with an animation, not a jump
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const jsx = execSync(\"find src -name '*.jsx'\", { encoding: 'utf8' }).split('\n').filter(Boolean);
          const ovl = fs.readFileSync('src/ui/Overlay.jsx', 'utf8');
          const read = (f) => fs.readFileSync(f, 'utf8');

          // ① پوششِ دست‌ساز ممنوع. هجده جای برنامه همان سه خط را تکرار می‌کردند
          //    و چون رندرِ شرطی بودند، هیچ‌کدام انیمیشنِ **خروج** نداشتند.
          const rogue = jsx.filter((f) => !f.startsWith('src/ui/')
            && /<div className=\"[\w\- ]*(-overlay|-modal-bg)/.test(read(f)));
          if (rogue.length) {
            console.error('پوششِ دست‌ساز در: ' + rogue.join('، ')); process.exit(1);
          }

          // ② ⚠️ AnimatePresence باید در **والد** باشد. اگر داخلِ خودِ شیت
          //    بنشیند، با unmountِ شیت خودش هم می‌رود و خروج هرگز اجرا نمی‌شود.
          //    پس هر فایلی که Overlay را رندر می‌کند باید AnimatePresence هم
          //    وارد کرده باشد.
          const users = jsx.filter((f) => !f.startsWith('src/ui/') && /<Overlay\b/.test(read(f)));
          const missing = users.filter((f) => !/AnimatePresence/.test(read(f)));
          if (missing.length) {
            console.error('Overlay بدونِ AnimatePresence در: ' + missing.join('، ')); process.exit(1);
          }
          // و هر شرطیِ درجا که مستقیم Overlay می‌سازد باید داخلِ AnimatePresence باشد.
          for (const f of users) {
            const lines = read(f).split('\n');
            lines.forEach((l, i) => {
              if (!/^\s*<Overlay\b/.test(l)) return;
              const above = lines.slice(Math.max(0, i - 3), i).join(' ');
              if (/&& \(\s*$/.test(lines[i - 1] || '') && !/<AnimatePresence>/.test(above)) {
                console.error(f + ':' + (i + 1) + ' — شرطیِ Overlay بیرونِ AnimatePresence'); process.exit(1);
              }
            });
          }

          // ③ ⚠️ بدونِ onUpdate، framer شفافیت را با Web Animations API اجرا
          //    می‌کند و در style نمی‌نویسد؛ با پایانِ خروج آن انیمیشن لغو می‌شود
          //    و شفافیت یک فریم به ۱ برمی‌گردد — چشمکِ دیدنی درست پیش از حذف.
          //    (اندازه‌گیری شده: ۰٫۱۰ → ۱٫۰۰ → حذف.)
          if ((ovl.match(/onUpdate=\{noop\}/g) || []).length < 2) {
            console.error('پس‌زمینه و پنل هر دو به onUpdate نیاز دارند وگرنه هنگامِ بسته‌شدن چشمک می‌زنند');
            process.exit(1);
          }

          // ④ «حرکتِ کمتر» انتخابِ کاربر است، نه پیشنهاد.
          if (!/useReducedMotion\(\)/.test(ovl) || !/duration: 0/.test(ovl)) {
            console.error('پوشش باید prefers-reduced-motion را رعایت کند'); process.exit(1);
          }

          // ⑤ انیمیشنِ CSS نباید برگردد: @keyframes روی transform با استایلِ
          //    inlineِ framer می‌جنگد (و CSS برنده می‌شود) — حرکت می‌پرد.
          for (const f of ['src/app/dashboard.css', 'src/app/jdate.css']) {
            const css = read(f);
            if (/\.(db|jd)-(overlay|sheet|cal)[^{]*\{[^}]*animation:/.test(css)) {
              console.error(f + ' — انیمیشنِ CSS روی پوشش/شیت ممنوع است'); process.exit(1);
            }
          }
          console.log('overlay ok');
          "

      - name: Verify list entry animates the head only and keeps CSS dimming
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const jsx = execSync(\"find src -name '*.jsx'\", { encoding: 'utf8' }).split('\n').filter(Boolean);
          const st = fs.readFileSync('src/ui/stagger.js', 'utf8');

          // ① ⚠️ محوشدنِ ردیف باید با filter باشد نه opacity. چند ردیف حالتِ
          //    CSSِ کم‌رنگ دارند (لاتِ بی‌موجودی ۰٫۵۵، حوالهٔ بسته ۰٫۷۲). استایلِ
          //    inlineِ framer آن قاعده را می‌خورَد و لاتِ صفر مثلِ لاتِ پر دیده
          //    می‌شود — یعنی انیمیشن یک دادهٔ غلط نشان می‌دهد. filter ضرب می‌شود.
          if (!/filter: 'opacity\(0\)'/.test(st) || /animate: \{ opacity:/.test(st)) {
            console.error('ورودِ ردیف باید با filter: opacity() باشد نه opacity'); process.exit(1);
          }
          const dimmed = fs.readFileSync('src/app/inventory.css', 'utf8');
          if (!/\.iv-row\.zero \{ opacity:/.test(dimmed)) {
            console.error('قاعدهٔ کم‌رنگیِ لاتِ صفر عوض شده — دلیلِ filter را دوباره بسنجید');
            process.exit(1);
          }

          // ② سرِ فهرست حرکت می‌گیرد، نه دویست ردیف. سقف باید صریح باشد.
          if (!/i > HEAD/.test(st) || !/HEAD = \d+/.test(st)) {
            console.error('ورودِ پلکانی باید سقفِ صریح داشته باشد'); process.exit(1);
          }
          const head = Number(/HEAD = (\d+)/.exec(st)[1]);
          if (head > 20) { console.error('سقفِ ورودِ پلکانی خیلی بالاست: ' + head); process.exit(1); }

          // ③ همان تلهٔ WAAPIِ Overlay: بدونِ onUpdate، مقدارِ محاسبه‌شده در
          //    پایانِ انیمیشن یک فریم به مقدارِ inline (opacity(0)) برمی‌گردد و
          //    ردیف درست در پایانِ ورودش ناپدید می‌شود. اندازه‌گیری: ۰٫۹۸ → ۰٫۰۰ → ۱٫۰۰.
          if (!/onUpdate: noop/.test(st)) {
            console.error('بدونِ onUpdate، ردیف در پایانِ ورودش یک فریم می‌پرد'); process.exit(1);
          }

          // ④ «حرکتِ کمتر» انتخابِ کاربر است، نه پیشنهاد.
          if (!/useReducedMotion\(\)/.test(st) || !/if \(still/.test(st)) {
            console.error('ورودِ پلکانی باید prefers-reduced-motion را رعایت کند'); process.exit(1);
          }

          // ⑤ هر جا ردیفِ فهرست حرکت می‌گیرد باید از همین قلاب بیاید، نه دست‌ساز.
          const rogue = jsx.filter((f) => {
            const s = fs.readFileSync(f, 'utf8');
            return /<motion\.(article|div)[^>]*className=\{?.[^>]*-(row|card)/.test(s) && !/useStagger/.test(s);
          });
          if (rogue.length) {
            console.error('ورودِ دست‌سازِ ردیف در: ' + rogue.join('، ')); process.exit(1);
          }
          console.log('stagger ok');
          "

      - name: Verify the brand colour is one setting the whole UI follows
        run: |
          set -e   # دو دستورِ node در یک مرحله — شکستِ اولی نباید بی‌صدا رد شود
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const reg = fs.readFileSync('server/src/config/settings-registry.ts', 'utf8');

          // ① رنگ یک تنظیمِ اعلام‌شده است، نه یک ثابت در کد.
          if (!/key: 'brand_color'/.test(reg) || !/type: 'color'/.test(reg)) {
            console.error('brand_color باید در رجیستری با نوعِ color اعلام شده باشد'); process.exit(1);
          }
          // ⚠️ رنگ مستقیم به CSS می‌رود؛ رشتهٔ دلخواه هم رابط را بی‌رنگ می‌کند
          //    هم یک راهِ تزریق است. پس coerce باید شکلِ hex را اجبار کند.
          if (!/\[0-9a-f\]\{3\}\|\[0-9a-f\]\{6\}/.test(reg)) {
            console.error('coerce باید فقط #rgb یا #rrggbb را بپذیرد'); process.exit(1);
          }

          // ② رنگِ خامِ بنفش نباید در CSS برگردد — هر hexِ برگشته یعنی نقطه‌ای
          //    که با رنگِ شرکت عوض نمی‌شود. استثنا فقط تعریفِ پیش‌فرض در :root.
          const css = execSync(\"find src -name '*.css'\", { encoding: 'utf8' }).split('\n').filter(Boolean);
          const PURPLE = /#(7c3aed|a855f7|8b5cf6|6d28d9|5b21b6)\b|rgba?\(\s*(124,\s*58,\s*237|168,\s*85,\s*247|139,\s*92,\s*246|109,\s*40,\s*217|91,\s*33,\s*182)\s*[,)]/i;
          const bad = [];
          for (const f of css) {
            let body = fs.readFileSync(f, 'utf8');
            if (f === 'src/index.css') body = body.replace(/^:root \{[\s\S]*?^\}/m, '');
            body.split('\n').forEach((l, i) => { if (PURPLE.test(l)) bad.push(f + ':' + (i + 1)); });
          }
          if (bad.length) { console.error('بنفشِ خام در: ' + bad.join('، ')); process.exit(1); }

          // ③ رنگ روی <html> می‌نشیند، همان‌جا که پیکربندی می‌رسد.
          const cfg = fs.readFileSync('src/app/config.jsx', 'utf8');
          if (!/applyBrand\(/.test(cfg)) {
            console.error('رنگِ شرکت باید هنگامِ رسیدنِ /config اعمال شود'); process.exit(1);
          }
          "
          # ④ ⚠️ با رنگِ پیش‌فرض، خانواده باید **دقیقاً** همان پنج بنفشِ امروز
          #    باشد. افست‌ها از روی همین رنگ‌ها درآمده‌اند؛ «مرتب‌کردن»شان ظاهرِ
          #    هر نصبِ موجود را جابه‌جا می‌کند.
          node --input-type=module -e "
          import { brandPalette } from './src/lib/brand-palette.js';
          const want = { brand: '#7c3aed', brand2: '#a855f7', soft: '#8b5cf6', mid: '#6d28d9', dark: '#5b21b6' };
          const p = brandPalette('#7c3aed');
          for (const [k, v] of Object.entries(want)) {
            if (p[k].hex !== v) { console.error(\`سایهٔ \${k}: \${p[k].hex} ≠ \${v}\`); process.exit(1); }
          }
          // سه‌تاییِ rgb باید با hex بخواند، وگرنه شفافیت‌ها رنگِ دیگری می‌گیرند.
          if (p.brand.rgb !== '124, 58, 237') { console.error('سه‌تاییِ rgb با hex نمی‌خواند'); process.exit(1); }
          // رنگِ نامعتبر نباید رابط را بی‌رنگ کند.
          if (brandPalette('لاجورد').brand.hex !== '#7c3aed') { console.error('رنگِ نامعتبر باید به پیش‌فرض برگردد'); process.exit(1); }
          // رنگِ دیگر باید واقعاً خانواده را ببرد، نه فقط پایه را.
          const q = brandPalette('#0ea5e9');
          if (q.mid.hex === p.mid.hex || q.brand2.hex === p.brand2.hex) {
            console.error('سایه‌ها از پایه مشتق نمی‌شوند'); process.exit(1);
          }
          console.log('brand ok');
          "

      - name: Verify the tech portal shows work, never money
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const svc = fs.readFileSync('server/src/patients/tech.service.ts', 'utf8');
          const ctl = fs.readFileSync('server/src/patients/tech.controller.ts', 'utf8');
          const ui = fs.readFileSync('src/app/Tech.jsx', 'utf8');

          // ① ⚠️ نمای کارشناس **پروجکشن** است نه آبجکتِ مراجعه. اگر روزی یکی از
          //    این کلیدها این‌جا select شود، رقمِ قراردادِ جراح از اولین صفحه‌ای
          //    که رندر می‌شود بیرون می‌زند.
          const MONEY = /\b(amount|paid|charges|payments|settlement|shares?|price|fee|discount|counterparty)\b/;
          const hit = svc.split('\n').filter((l) => MONEY.test(l) && !l.trim().startsWith('*') && !l.trim().startsWith('//'));
          if (hit.length) { console.error('فیلدِ مالی در نمای کارشناس: ' + hit.join(' / ')); process.exit(1); }
          if (MONEY.test(ui.replace(/\/\*[\s\S]*?\*\//g, ''))) { console.error('واژهٔ مالی در صفحهٔ کارشناسی'); process.exit(1); }

          // ② دامنه همیشه خودِ کاربر است. اگر endpoint یک techIdِ دلخواه بپذیرد،
          //    مسیرِ دومی برای خواندنِ کارِ همه ساخته می‌شود که guardش جای دیگر است.
          // هر جا techId مقدار می‌گیرد باید از خودِ توکن بیاید، نه از ورودی.
          const techIdSites = svc.match(/techId:\s*[^,\n]+/g) || [];
          const fromUser = techIdSites.filter((x) => /user\?\.id/.test(x));
          if (!techIdSites.length || fromUser.length !== techIdSites.length) {
            console.error('دامنهٔ دفترِ کار از توکن نمی‌آید: ' + techIdSites.join(' / ')); process.exit(1);
          }
          if (/Query\('techId'\)|dto\.techId|query\.techId/.test(ctl + svc)) {
            console.error('پنلِ کارشناسی نباید techIdِ ورودی بپذیرد'); process.exit(1);
          }

          // ③ ⚠️ مجوزِ درست با ماژولِ غلط یعنی درِ بسته: هر مسیری که مجوزِ
          //    stock.consume دارد (یعنی برای کارشناس نوشته شده) باید ماژولِ tech
          //    را هم اعلام کند، وگرنه ماژولِ کنترلر (انبار، سطح ۳) همان
          //    کارشناسِ سطح ۲ را بیرون می‌گذارد. این دقیقاً همان باگی بود که
          //    «اعلامِ پایانِ عمل» را یک فاز بی‌صدا از کار انداخت.
          for (const f of ['server/src/patients/inventory.controller.ts', 'server/src/patients/tech.controller.ts']) {
            const lines = fs.readFileSync(f, 'utf8').split('\n');
            const classFeature = /@Feature\('tech'\)/.test(lines.slice(0, 40).join('\n'));
            lines.forEach((l, i) => {
              if (!/RequirePermissions\('stock\.consume'\)/.test(l)) return;
              // ⚠️ فقط دکوراتورِ واقعی، نه ذکرش در کامنت — وگرنه یک توضیح
              //    جای یک guard را می‌گیرد.
              const above = lines.slice(Math.max(0, i - 12), i);
              const decorated = above.some((x) => /^\s*@Feature\('tech'\)\s*$/.test(x));
              if (!classFeature && !decorated) {
                console.error(f + ':' + (i + 1) + ' — مجوزِ کارشناس بدونِ ماژولِ tech'); process.exit(1);
              }
            });
          }
          console.log('tech ok');
          "

      - name: Verify time input is one control, typed or picked
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const jsx = execSync(\"find src -name '*.jsx'\", { encoding: 'utf8' }).split('\n').filter(Boolean);
          const lib = fs.readFileSync('src/lib/time.js', 'utf8');
          const pick = fs.readFileSync('src/ui/TimePick.jsx', 'utf8');

          // ① ورودیِ ساعتِ دست‌ساز ممنوع. سه صفحه سه input خالی داشتند و
          //    قاعدهٔ اعتبارسنجی در دو فایل جدا نوشته شده بود — یعنی «۹:۵» در
          //    یکی به 09:05 تبدیل می‌شد و در دیگری خام به سرور می‌رفت.
          const rogue = jsx.filter((f) => !f.startsWith('src/ui/')
            && /placeholder=[\"']\\u06F0\\u06F8:\\u06F3\\u06F0[\"']/.test(fs.readFileSync(f, 'utf8')));
          if (rogue.length) { console.error('ورودیِ ساعتِ دست‌ساز در: ' + rogue.join('، ')); process.exit(1); }

          // ② الگوی ساعت فقط یک جا تعریف می‌شود.
          const owners = jsx.concat(execSync(\"find src -name '*.js'\", { encoding: 'utf8' }).split('\n').filter(Boolean))
            .filter((f) => f !== 'src/lib/time.js' && /\\[01\\]\\\\d\\|2\\[0-3\\]/.test(fs.readFileSync(f, 'utf8')));
          if (owners.length) { console.error('الگوی ساعت تکرار شده در: ' + owners.join('، ')); process.exit(1); }

          // ③ هم تایپ هم انتخاب — یکی‌شان به‌تنهایی کافی نیست: کاربرِ پشتِ میز
          //    تایپ می‌کند، کارشناسِ داخلِ اتاقِ عمل با یک دست انتخاب می‌کند.
          // ⚠️ لنگرِ سمتِ «انتخاب» روی **اتصالِ onPick به commit** است، نه روی
          //    نامِ کامپوننتِ داخلی: بارِ اول به «onPick(t)»ِ داخلِ SlotList
          //    بسته بود و با جایگزینیِ فهرستِ تخت با چرخِ ساعت، نگهبان قرمز
          //    شد بی‌آنکه چیزی خراب شده باشد.
          if (!/onChange=\{\(e\) => onChange\(toEnDigits/.test(pick)
            || !/onPick=\{\(picked\) => \{ commit\(picked\)/.test(pick)) {
            console.error('کنترلِ ساعت باید هم تایپ بپذیرد هم انتخاب'); process.exit(1);
          }

          // ④ ⚠️ input[type=time] ممنوع: قالبِ نمایشش دستِ مرورگر است و روی
          //    کرومیومِ همین‌جا ۱۲ساعته با AM/PM می‌شود — یعنی همان فیلد روی
          //    اندروید و سافاری و ویندوز سه شکلِ متفاوت می‌گیرد.
          const timeInputs = jsx.filter((f) => /type=[\"']time[\"']/.test(fs.readFileSync(f, 'utf8')));
          if (timeInputs.length) { console.error('input[type=time] در: ' + timeInputs.join('، ')); process.exit(1); }

          /* ⑤ ⚠️ **انتخاب باید ساعت باشد، نه فهرستِ بازه‌ها.** نسخهٔ اول ۹۶
             دکمهٔ مسطح («۰۰:۰۰، ۰۰:۱۵، …») می‌ریخت که مالکِ محصول «خشک و
             زشت» خواندش: کاربر برای رسیدن به ۱۴:۵۰ باید ۵۹ خانه اسکرول
             می‌کرد و ساعت و دقیقه هیچ‌وقت جدا انتخاب نمی‌شدند. */
          if (!/tp-wheels/.test(pick) || (pick.match(/<Wheel\b/g) || []).length < 2) {
            console.error('ساعت و دقیقه باید دو ستونِ جدا باشند'); process.exit(1);
          }
          const wheel = pick.slice(pick.indexOf('function Wheel('));
          /* ⚠️ چرخش با **اسکرولِ خودِ مرورگر** باشد نه درگِ دست‌ساز: فقط
             این‌طور چرخِ ماوس و شتابِ لمسِ موبایل و کیبورد هر سه کار می‌کنند.
             لنگر روی CSS است چون خودِ رفتار آن‌جا تعریف می‌شود. */
          if (!/scroll-snap-type:\\s*y/.test(fs.readFileSync('src/ui/timepick.css', 'utf8'))) {
            console.error('چرخِ ساعت باید با scroll-snapِ بومی بچرخد'); process.exit(1);
          }
          /* ⚠️ نوارِ وسط باید در **همان کادرِ ستون** جای بگیرد. نسخهٔ اول آن را
             هم‌ترازِ کلِ چرخ (شاملِ برچسبِ «ساعت») می‌گذاشت و بلندیِ برچسب را
             با یک \`margin\`ِ دستی جبران می‌کرد؛ نتیجه: نوار یک ردیف پایین‌ترِ
             عددِ انتخاب‌شده. عددِ جادویی یعنی همین اشکال با هر تغییرِ فونت
             برمی‌گردد، پس ممنوع است. */
          const css = fs.readFileSync('src/ui/timepick.css', 'utf8');
          const band = css.slice(css.indexOf('.tp-band {'), css.indexOf('}', css.indexOf('.tp-band {')));
          if (/margin/.test(band)) {
            console.error('جای نوارِ وسط نباید با marginِ دستی تنظیم شود'); process.exit(1);
          }
          if (!/tp-view/.test(pick) || !/\.tp-view\s*\{[^}]*position:\\s*relative/.test(css)) {
            console.error('نوار باید داخلِ کادرِ خودِ ستون باشد'); process.exit(1);
          }
          // ستونِ ساعت چپ و دقیقه راست — هم‌جهت با نمایشگرِ بالای آن.
          const wheels = css.slice(css.indexOf('.tp-wheels {'), css.indexOf('}', css.indexOf('.tp-wheels {')));
          if (!/direction:\\s*ltr/.test(wheels)) {
            console.error('چرخ‌ها باید هم‌جهتِ نمایشگرِ HH:MM باشند'); process.exit(1);
          }
          // فاصله‌گذارِ بالا و پایین: بدونِ آن ۰۰ و ۵۹ هرگز به وسط نمی‌رسند.
          if ((wheel.match(/tp-pad/g) || []).length < 2) {
            console.error('بدونِ فاصله‌گذار، اولین و آخرین عدد انتخاب‌نشدنی می‌شوند'); process.exit(1);
          }
          // نگهبانِ ضدِ حلقه: اسکرولِ برنامه‌ای نباید دوباره مقدار را عوض کند.
          if (!/programmatic/.test(wheel)) {
            console.error('اسکرولِ برنامه‌ای باید از رویدادِ scroll جدا شود'); process.exit(1);
          }
          // مقدار وقتی ثبت شود که اسکرول **بایستد**، نه در هر فریم.
          if (!/setTimeout\(/.test(wheel)) {
            console.error('انتخاب باید پس از ایستادنِ اسکرول ثبت شود'); process.exit(1);
          }
          // ⚠️ کلیک هم باید کار کند — روی دسکتاپ کسی چرخ را نمی‌کشد.
          if (!/onClick=\{\(\) => \{ onChange\(n\)/.test(wheel)) {
            console.error('کلیک روی عدد هم باید انتخابش کند'); process.exit(1);
          }
          /* ⚠️ **انحنای استوانه از اسکرول می‌آید، نه از حلقهٔ درگِ دست‌ساز.**
             نمونه‌های آمادهٔ «چرخِ گزینه» برای این ظاهر، اسکرولِ مرورگر را با
             \`touch-action: none\` خاموش و با رویدادِ pointer بازسازی می‌کنند —
             و همان‌جا شتابِ لمس، چرخِ ماوس و کیبورد از دست می‌رود. */
          if (/touch-action:\\s*none/.test(css)) {
            console.error('چرخ نباید اسکرولِ بومی را خاموش کند'); process.exit(1);
          }
          if (!/el\.scrollTop/.test(wheel) || !/requestAnimationFrame\(/.test(wheel)) {
            console.error('انحنا باید از موقعیتِ اسکرول و یک‌بار در هر فریم حساب شود'); process.exit(1);
          }
          // کاربرِ کم‌حرکت جلوه را نمی‌خواهد ولی چرخ باید کار کند.
          const rm = css.slice(css.indexOf('prefers-reduced-motion'));
          if (!/transform:\\s*none/.test(rm)) {
            console.error('در حالتِ کم‌حرکت باید انحنا برداشته شود'); process.exit(1);
          }
          "
          # ⑤ نرمال‌سازی واقعاً کار می‌کند — با اجرای خودِ ماژول، نه با نگاه به کد.
          node --input-type=module -e "
          import { normTime, badTime, faTime } from './src/lib/time.js';
          const cases = [['830','08:30'], ['9:5','09:05'], ['۹۴۷','09:47'], ['١٢:٣٠','12:30'], ['','']];
          for (const [inp, want] of cases) {
            const got = normTime(inp);
            if (got !== want) { console.error('normTime(' + inp + ') = ' + got + ' ≠ ' + want); process.exit(1); }
          }
          // رشتهٔ نامعتبر دست‌نخورده برمی‌گردد تا کاربر ببیند چه تایپ کرده.
          if (normTime('abc') !== 'abc' || !badTime('abc')) { console.error('ورودیِ نامعتبر نباید بی‌صدا پاک شود'); process.exit(1); }
          // ساعتِ خارج از گام باید سالم بماند، نه گرد شود.
          if (normTime('09:47') !== '09:47') { console.error('ساعتِ خارج از گام گرد شد'); process.exit(1); }
          if (faTime('08:30') !== '۰۸:۳۰') { console.error('نمایشِ فارسیِ ساعت غلط است'); process.exit(1); }
          console.log('time ok');
          "

      - name: Verify the access matrix is the single, audited writer
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const reg = fs.readFileSync('server/src/auth/access-registry.ts', 'utf8');
          const svc = fs.readFileSync('server/src/auth/access.service.ts', 'utf8');
          const feat = fs.readFileSync('server/src/features/features.controller.ts', 'utf8');
          const ui = fs.readFileSync('src/app/Access.jsx', 'utf8');

          // ① ⚠️ هر کلید باید برچسبِ فارسی داشته باشد. مدیری که ردیفِ
          //    stock.consume را می‌بیند نمی‌داند چه چیزی را باز یا بسته می‌کند —
          //    و دسترسی‌ای که فهمیده نشود، تنظیم نمی‌شود، فقط دست‌کاری می‌شود.
          const defs = reg.split('\n').filter((l) => /^\s*key: '/.test(l) || /key: '[\w.]+', label:/.test(l));
          const keys = (reg.match(/key: '[\w.]+'/g) || []).length;
          const labels = (reg.match(/label: '[^']+'/g) || []).length;
          if (!keys || labels < keys) {
            console.error('کلیدِ بی‌برچسب در رجیستریِ دسترسی: ' + keys + ' کلید، ' + labels + ' برچسب'); process.exit(1);
          }

          // ② تنها نویسنده. مسیرِ دومِ نوشتن یعنی روزی یکی از دو مسیر audit یا
          //    قفل را فراموش می‌کند و دری بی‌ردپا باز می‌شود.
          if (/@(Patch|Post|Put|Delete)\(/.test(feat)) {
            console.error('features نباید مسیرِ نوشتن داشته باشد — نویسنده فقط access است'); process.exit(1);
          }

          // ③ هر نوشتن ثبت می‌شود.
          const writes = (svc.match(/async (update|resetOne|resetAll)\(/g) || []).length;
          if (writes < 3 || !/audit\.record\(/.test(svc)) {
            console.error('نوشتنِ بی‌ردِ audit در ماتریسِ دسترسی'); process.exit(1);
          }

          // ④ ⚠️ درِ ضدِ‌ارتقا: کلیدهایی که با آن‌ها می‌شود به خود سطح داد باید
          //    قفل بمانند. بدونشان یک ادمین می‌تواند users.manage را به سطحِ
          //    خودش بیاورد و بعد هر کاری بکند.
          for (const k of ['users', 'access', 'users.manage']) {
            if (!new RegExp(\"'\" + k.replace('.', '\\\\.') + \"'\").test(reg)) {
              console.error('کلیدِ قفل‌شدنی ' + k + ' در رجیستری نیست'); process.exit(1);
            }
          }
          if (!/locked: true/.test(reg)) { console.error('هیچ ردیفی قفل نیست'); process.exit(1); }

          // ⑤ رابط باید همان دو لایه را با هم نشان دهد، وگرنه مدیر باید دو
          //    جدول را در ذهنش روی هم بگذارد.
          if (!/access\/matrix/.test(ui) || !/permissions/.test(ui) || !/features/.test(ui)) {
            console.error('صفحهٔ ماتریس باید هر دو لایه را بگیرد'); process.exit(1);
          }
          console.log('access ok');
          "

      - name: Verify search treats Persian and Latin digits as one
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const services = execSync(\"find server/src -name '*.service.ts'\", { encoding: 'utf8' }).split('\n').filter(Boolean);

          // ⚠️ کاربرِ فارسی روی گوشی «۱۶» تایپ می‌کند و کالای ثبت‌شده «16» است
          //    (یا برعکس). جستجویی که متنِ خام را مستقیم به contains بدهد،
          //    همان کالایی را که در فهرست پیشِ چشمِ کاربر است «پیدا نمی‌کند» —
          //    و کاربر نتیجه می‌گیرد که کاتالوگ خراب است.
          const bad = [];
          for (const f of services) {
            const src = fs.readFileSync(f, 'utf8');
            if (!/contains:/.test(src)) continue;
            // ⚠️ نه «فایل helper را import کرده» — خودِ شرط باید روی متغیرِ
            //    صورت‌شده باشد. import در بالای فایل، خطِ خامِ پایینِ فایل را
            //    درست نمی‌کند؛ نگهبانی که این را قبول کند اصلاً گاز نمی‌گیرد.
            const raw = src.split('\n').filter((l) => /contains: (term|t|q)\b/.test(l) && !/toEnDigits/.test(l));
            if (raw.length) bad.push(f + ' (' + raw.length + ' شرطِ خام)');
          }
          if (bad.length) { console.error('جستجوی بی‌نرمال‌سازیِ رقم در: ' + bad.join('، ')); process.exit(1); }
          "
          # هستهٔ نرمال‌سازی واقعاً هر دو صورت را می‌سازد — با اجرا، نه با نگاه
          node -e "
          require('ts-node');
          " 2>/dev/null || true
          node --input-type=module -e "
          const src = (await import('node:fs')).readFileSync('server/src/common/search.ts', 'utf8');
          // ⑤ هر دو صورتِ رقمی باید ساخته شود؛ یکی‌شان یعنی نیمی از دادهٔ موجود پیدا نمی‌شود.
          if (!/toEnDigits/.test(src) || !/۰۱۲۳۴۵۶۷۸۹/.test(src)) {
            console.error('digitVariants باید هر دو صورتِ فارسی و لاتین را بسازد'); process.exit(1);
          }
          if (!/new Set/.test(src)) { console.error('صورت‌های تکراری باید حذف شوند'); process.exit(1); }
          console.log('search ok');
          "

      - name: Verify the transport cycle is closed end to end
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          // ① پرتالِ راننده هیچ دادهٔ بیمار نمی‌دهد. راننده برای رساندنِ ست به
          //    نامِ بیمار احتیاج ندارد؛ همان قاعدهٔ ابلاغ، این‌بار روی یک
          //    endpointِ تازه که خیلی راحت می‌شد patient را در include گذاشت.
          const tp = read('server/src/patients/transport.service.ts');
          const leak = /include:[\s\S]*?\bpatient\b/.test(tp) || /select:[\s\S]*?firstName[\s\S]*?patient/.test(tp);
          if (/\bpatient:\s*{/.test(tp)) { console.error('transport.service به بیمار دسترسی می‌دهد'); process.exit(1); }
          if (/nationalId|amount|price|totalAmount/.test(tp)) { console.error('پرتالِ راننده نباید داده‌ی هویتی یا مالی بدهد'); process.exit(1); }

          // ② هویتِ راننده از شخصِ مشترک می‌آید، نه یک ستونِ تازه روی Account.
          //    ستونِ دوم یعنی دو منبعِ حقیقت برای «این کاربر کدام راننده است».
          if (!/personId/.test(tp)) { console.error('هویتِ راننده باید از Person بیاید'); process.exit(1); }

          // ③ برنامه و واقعیت دو ستونِ جدا می‌مانند: اگر راننده روی handedTo
          //    بنویسد، فردا معلوم نیست برنامه چه بود و واقعیت چه شد.
          const sch = read('server/prisma/schema.prisma');
          if (!/handedActual/.test(sch) || !/handedTo/.test(sch)) {
            console.error('هر دو ستونِ handedTo و handedActual لازم‌اند'); process.exit(1);
          }
          if (!/handedActual/.test(tp) || /handedTo:\s*dto\./.test(tp)) {
            console.error('markDone باید handedActual بنویسد نه handedTo'); process.exit(1);
          }

          // ④ ⚠️ هر فیلدی که کلاینت می‌فرستد باید در DTO باشد، وگرنه
          //    ValidationPipe با whitelist آن را بی‌صدا دور می‌ریزد و رفتار
          //    «کار می‌کند ولی ذخیره نمی‌شود» می‌شود — همین دو بار اتفاق افتاد.
          const inv = read('server/src/patients/dto/inventory.dto.ts');
          for (const f of ['pickupAt', 'leftAt']) {
            if (!new RegExp(f).test(inv)) { console.error('ReleaseDto باید ' + f + ' داشته باشد'); process.exit(1); }
          }
          const rt = read('server/src/patients/dto/routes.dto.ts');
          for (const f of ['handedTo', 'handedActual']) {
            if (!new RegExp(f).test(rt)) { console.error('DTOهای مسیر باید ' + f + ' داشته باشند'); process.exit(1); }
          }

          // ⑤ اعلامِ پایانِ کارشناس باید خودش توقفِ جمع‌آوری بسازد. اگر فقط
          //    releasedAt را می‌زد، ستِ آزادشده در هیچ صفِ کاری نمی‌افتاد.
          const invSvc = read('server/src/patients/inventory.service.ts');
          if (!/createUnassignedStop/.test(invSvc)) {
            console.error('releaseTransfer باید توقفِ جمع‌آوریِ بی‌راننده بسازد'); process.exit(1);
          }

          // ⑥ کسریِ الگو و «عملِ بی‌بار» در سرور محاسبه می‌شوند، نه در رندر —
          //    وگرنه هر نمای تازه تعریفِ خودش را از «بی‌بار» می‌سازد.
          const dis = read('server/src/patients/dispatch.service.ts');
          if (!/noCargo/.test(dis) || !/missingNeeds/.test(dis)) {
            console.error('تختهٔ چینش باید noCargo و missingNeeds بدهد'); process.exit(1);
          }
          const dj = read('src/app/Dispatch.jsx');
          if (!/noCargo/.test(dj) || !/missingNeeds/.test(dj)) {
            console.error('هشدارِ عملِ بی‌بار در تختهٔ چینش دیده نمی‌شود'); process.exit(1);
          }

          // ⑦ توقف باید از همان لحظهٔ ساخت ساعت و تحویل‌گیرنده بگیرد. مقصدِ
          //    تنها یعنی راننده نمی‌داند کِی برود و به دستِ چه کسی بدهد.
          // ⚠️ فقط بدنهٔ خودِ AddStop، نه تا آخرِ فایل: TimeBox که پایین‌تر
          //    تعریف شده هم TimePick دارد و نسخهٔ اولِ این نگهبان به‌خاطرش
          //    گاز نگرفت — فرمِ توقف را به input خام برگرداندیم و سبز ماند.
          const from = dj.indexOf('function AddStop');
          const next = dj.indexOf('\nfunction ', from + 1);
          const addStop = dj.slice(from, next === -1 ? undefined : next);
          if (!/TimePick/.test(addStop) || !/handedTo/.test(addStop)) {
            console.error('فرمِ افزودنِ توقف باید ساعت و تحویل‌گیرنده داشته باشد'); process.exit(1);
          }

          console.log('transport cycle ok');
          "

      - name: Verify the delivery place is canonical at write time
        run: |
          set -e
          node -e "
          const fs = require('fs');
          const read = (f) => fs.readFileSync(f, 'utf8');

          // ① کانونی‌سازی باید هنگامِ **نوشتن** باشد. اگر متنِ خام ذخیره شود،
          //    بعداً «csr» و «سی اس آر» قابلِ یکی‌کردن نیستند چون نمی‌دانیم
          //    کاربر کدام را قصد کرده — و گذشته بازسازی‌شدنی نیست.
          const paths = {
            'server/src/patients/inventory.service.ts': 'leftAt',
            'server/src/patients/transport.service.ts': 'handedActual',
            'server/src/patients/routes.service.ts': 'handedTo',
          };
          for (const [f, field] of Object.entries(paths)) {
            const src = read(f);
            if (!/places\.canonical\(/.test(src)) {
              console.error(f + ': ' + field + ' بدونِ کانونی‌سازی ذخیره می‌شود'); process.exit(1);
            }
          }

          // ② ⚠️ متنِ آزاد نباید رد شود. کارشناسِ وسطِ عمل باید بتواند جایی را
          //    ثبت کند که کسی از قبل تعریفش نکرده؛ قفل‌کردنِ فیلد بدتر از
          //    دادهٔ نامرتب است.
          const svc = read('server/src/patients/places.service.ts');
          if (!/hit\?\.name \?\? text/.test(svc)) {
            console.error('canonical باید متنِ ناشناخته را دست‌نخورده برگرداند، نه خطا'); process.exit(1);
          }
          // ③ املا هم باید در جست‌وجو باشد، وگرنه «سی اس آر» محلِ دوم می‌شود.
          if (!/aliasKeys: \{ has:/.test(svc)) {
            console.error('findByKey باید املاها را هم بگردد'); process.exit(1);
          }

          // ④ نرمال‌سازیِ محل عمداً «normalizeName»ِ بیمارستان نیست: آن‌جا
          //    واژهٔ «بیمارستان» حذف می‌شود و «انبارِ بیمارستان» به «انبار»
          //    می‌رسد و با انبارِ مرکزی یکی می‌شود.
          const place = read('server/src/common/place.ts');
          if (/name-match/.test(place)) {
