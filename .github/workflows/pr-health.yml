# سلامتِ PRهای باز — دو کارِ خودکار که هر دو از خرابیِ واقعی آمده‌اند.
#
#  ۱. **شاخهٔ عقب‌افتاده را جلو می‌برد.** اگر `main` تکان خورد و PRی عقب ماند،
#     `main` را داخلِ همان شاخه مرج می‌کند (جهتِ مخالفِ مرجِ PR). اگر تمیز
#     انجام شود، PR سبز و قابلِ‌مرج می‌ماند بدونِ اینکه کسی وسطِ کارش بیاید.
#
#  ۲. **کانفلیکت را داد می‌زند.** ⚠️ GitHub روی PRِ کانفلیکت‌دار **اصلاً CI
#     اجرا نمی‌کند** — یعنی PR نه قرمز می‌شود نه سبز، فقط ساکت می‌ماند. یک‌بار
#     شش ساعت دنبالِ «چرا رانِ CI ثبت نشد» گشتیم و جواب همین بود. حالا برچسبِ
#     `conflict` می‌خورد و یک کامنت می‌گذارد.
#
# ⚠️ این workflow هیچ PRی را **مرج نمی‌کند**. مرج کارِ `automerge.yml` است.
name: pr-health

on:
  push:
    branches: [main]
  schedule:
    # تورِ ایمنی: رویدادِ push گاهی گم می‌شود و PR تا فردا ساکت می‌ماند.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const CONFLICT = 'conflict';

            const { data: open } = await github.rest.pulls.list({ owner, repo, state: 'open', base: 'main', per_page: 100 });
            if (!open.length) return core.info('PR بازی نیست');

            for (const brief of open) {
              // mergeable_state فقط در پاسخِ تکی می‌آید و گاهی «unknown» است
              // تا GitHub محاسبه‌اش را تمام کند.
              let pr = null;
              for (let attempt = 0; attempt < 5; attempt++) {
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: brief.number }));
                if (pr.mergeable_state !== 'unknown') break;
                await new Promise((r) => setTimeout(r, 3000));
              }
              const labels = pr.labels.map((l) => l.name);
              const hasLabel = labels.includes(CONFLICT);

              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                if (!hasLabel) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [CONFLICT] })
                    .catch((e) => core.warning(`برچسب روی #${pr.number} نخورد: ${e.message}`));
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number,
                    body: [
                      'این PR با `main` کانفلیکت دارد.',
                      '',
                      '⚠️ GitHub روی PRِ کانفلیکت‌دار **CI اجرا نمی‌کند** — پس نبودِ رانِ قرمز به‌معنای سالم‌بودن نیست.',
                      '',
                      '```bash',
                      'git fetch origin main && git merge origin/main',
                      '```',
                      '',
                      '---',
                      '_Generated by [Claude Code](https://claude.ai/code)_',
                    ].join('\n'),
                  });
                  core.notice(`#${pr.number} کانفلیکت دارد — برچسب خورد`);
                }
                continue;
              }

              // کانفلیکت ندارد → برچسبِ قدیمی را بردار و اگر عقب است جلو ببر.
              if (hasLabel) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: CONFLICT })
                  .catch(() => {});
              }
              if (pr.mergeable_state === 'behind') {
                try {
                  await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number });
                  core.notice(`#${pr.number} با main هم‌گام شد`);
                } catch (e) {
                  core.warning(`هم‌گام‌سازیِ #${pr.number} نشد: ${e.message}`);
                }
              }
            }
